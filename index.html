goal:{en:'Talk about culture and tourism using -ed/-ing adjectives, strong adjectives and collocations.',mn:'Соёл, аялал жуулчлалын тухай -ed/-ing тэмдэг нэр, хүчтэй тэмдэг нэр, хоршоо үгээр ярих.'},
words:[['heritage','өв','Naadam is part of our cultural heritage.','Наадам бол манай соёлын өвийн нэг хэсэг.','🏛️'],['custom','заншил','It\'s a custom to offer guests milk tea.','Зочдод сүүтэй цай барих заншилтай.','🍵'],['tradition','уламжлал','We keep our traditions alive.','Бид уламжлалаа амьд байлгадаг.','🎎'],['authentic','жинхэнэ, өвөрмөц','Tourists want an authentic experience.','Жуулчид жинхэнэ туршлага хүсдэг.','💯'],['destination','очих газар','Khuvsgul is a popular destination.','Хөвсгөл бол түгээмэл очих газар.','📍'],['tourist attraction','үзвэр газар','The Chinggis statue is a tourist attraction.','Чингисийн хөшөө бол жуулчдын үзвэр газар.','🗿'],['off the beaten track','жуулчны замаас гадуур','We love places off the beaten track.','Бид жуулчны замаас гадуурх газарт дуртай.','🗺️'],['breathtaking','амьсгал хураам','The view was breathtaking.','Үзэмж амьсгал хураам байлаа.','😮'],['fascinating','гайхалтай сонирхолтой','The museum was fascinating.','Музей гайхалтай сонирхолтой байсан.','🤩'],['fascinated','их сонирхсон','I was fascinated by the history.','Түүх намайг их сонирхуулсан.','🧐'],['disappointing','сэтгэл дундуур болгосон','The hotel was disappointing.','Зочид буудал сэтгэл дундуур болгосон.','😞'],['disappointed','сэтгэл дундуур байсан','We were disappointed with the food.','Бид хоолонд сэтгэл дундуур байсан.','☹️'],['exhausting','туйлдуулсан','The journey was exhausting.','Аялал туйлдуулам байсан.','😫'],['overwhelming','сэтгэл хөдөлгөм','The welcome was overwhelming.','Угтан авалт сэтгэл хөдөлгөм байсан.','🥹'],['spectacular','гайхамшигтай','The festival was spectacular.','Баяр гайхамшигтай байлаа.','🎆'],['local','нутгийн','Try the local food.','Нутгийн хоолыг амсаад үз.','🏘️'],['hospitality','зочломтгой байдал','Mongolian hospitality is famous.','Монголчуудын зочломтгой зан алдартай.','🫖'],['culture shock','соёлын цочрол','I experienced culture shock in Japan.','Би Японд соёлын цочролд орсон.','😵'],['etiquette','ёс жудаг','Learn the local etiquette before you travel.','Аялахаасаа өмнө нутгийн ёс жудгийг сур.','🙇'],['souvenir','дурсгалын зүйл','I bought a felt souvenir.','Би эсгий дурсгалын зүйл авсан.','🎁'],['eco-tourism','эко аялал','Eco-tourism protects nature.','Эко аялал байгалиа хамгаалдаг.','🌿'],['mass tourism','олон нийтийн аялал жуулчлал','Mass tourism can damage old cities.','Олон нийтийн аялал жуулчлал эртний хотуудыг сүйтгэж болно.','🚌'],['boost','дэмжих, өсгөх','Tourism boosts the local economy.','Аялал жуулчлал орон нутгийн эдийн засгийг дэмждэг.','🚀'],['preserve','хадгалан хамгаалах','We must preserve old buildings.','Бид хуучин барилгуудаа хадгалан хамгаалах ёстой.','🏺'],['nomadic','нүүдэлчин','Tourists love the nomadic lifestyle.','Жуулчид нүүдэлчдийн амьдралын хэв маягт дуртай.','🐎'],['itinerary','аяллын маршрут','Our itinerary includes five provinces.','Манай аяллын маршрутад таван аймаг багтана.','🗒️'],['broaden your horizons','ертөнцийг үзэх хүрээгээ тэлэх','Travel broadens your horizons.','Аялал ертөнцийг үзэх хүрээг тэлдэг.','🔭'],['go sightseeing','үзвэр үзэх','We went sightseeing in Beijing.','Бид Бээжинд үзвэр үзсэн.','📸'],['stunning','гоёмсог','The landscape is absolutely stunning.','Байгаль үнэхээр гоёмсог.','✨'],['absolutely','үнэхээр (хүчтэй тэмдэг нэртэй)','It was absolutely amazing.','Үнэхээр гайхалтай байлаа.','💥']],
gram:{t:'-ed / -ing adjectives, strong adjectives and collocations',tm:'-ed / -ing тэмдэг нэр, хүчтэй тэмдэг нэр, хоршоо үг',
en:'<p><b>-ing<\/b> adjectives describe the thing that causes the feeling: The trip was <b>exhausting<\/b>. <b>-ed<\/b> adjectives describe how a person feels: I was <b>exhausted<\/b>.<\/p><p>Strong adjectives (very + adjective): very good → <b>amazing / fantastic<\/b>; very beautiful → <b>stunning / breathtaking<\/b>; very tired → <b>exhausted<\/b>; very interesting → <b>fascinating<\/b>. Use <b>absolutely<\/b> (not very) with them: <b>absolutely<\/b> stunning.<\/p><p>Collocations make you sound natural (good for IELTS lexical score): go sightseeing, a breathtaking view, rich culture, warm hospitality, boost the economy, broaden your horizons.<\/p>',
mn:'<p><b>-ing<\/b> тэмдэг нэр мэдрэмж төрүүлж буй зүйлийг тодорхойлно: The trip was <b>exhausting<\/b>. (Аялал туйлдуулам байсан.) <b>-ed<\/b> тэмдэг нэр хүний мэдрэмжийг: I was <b>exhausted<\/b>. (Би туйлдсан.)<\/p><p>Хүчтэй тэмдэг нэр: very beautiful → <b>stunning<\/b>; very tired → <b>exhausted<\/b>. Тэдэнтэй <b>very<\/b> биш <b>absolutely<\/b> хэрэглэнэ: <b>absolutely<\/b> stunning.<\/p><p>Хоршоо үг (collocation) таныг байгалийн жам ёсоор ярьдаг болгоно — IELTS-ийн үгийн сангийн оноонд чухал: go sightseeing, warm hospitality, broaden your horizons.<\/p>',
ex:[['The museum was fascinating. I was fascinated by the dinosaur bones.','Музей гайхалтай сонирхолтой байлаа. Үлэг гүрвэлийн ясанд би их сонирхсон.'],['The view from the mountain was absolutely breathtaking.','Уулнаас харагдах үзэмж үнэхээр амьсгал хураам байлаа.'],['We were disappointed because the tour was cancelled.','Аялал цуцлагдсан тул бид сэтгэл дундуур байсан.'],['Tourism can boost the local economy.','Аялал жуулчлал орон нутгийн эдийн засгийг дэмжиж чадна.'],['Travelling broadens your horizons.','Аялал ертөнцийг үзэх хүрээг тэлдэг.']],
q:[{q:'The film was really ___. I almost fell asleep.',o:['bored','boring'],a:1},{q:'I was ___ by the old temples.',o:['fascinated','fascinating'],a:0},{q:'very beautiful = ___',o:['stunning','tiny','awful'],a:0},{q:'It was ___ amazing!',o:['very','absolutely','a bit'],a:1},{q:'Natural collocation: ___ sightseeing',o:['make','do','go'],a:2},{q:'Mongolian ___ is famous: people welcome guests warmly.',o:['hospitality','heritage','itinerary'],a:0}]},
dl:[{t:'IELTS Part 2: A place you visited',tm:'IELTS 2-р хэсэг: Очиж байсан газар',lines:[['A','Describe a place you visited that you found fascinating.','Гайхалтай сонирхолтой санагдсан, очиж байсан газраа тайлбарла.'],['B','I\'d like to talk about the Flaming Cliffs in the Gobi, which I visited with my students last summer.','Өнгөрсөн зун сурагчидтайгаа очсон Говийн Галт хадны тухай ярья.'],['B','The journey was absolutely exhausting — eleven hours on a bumpy road — but the moment we arrived, I forgot how tired I was.','Аялал үнэхээр туйлдуулам байсан — овон товон замаар арван нэгэн цаг — гэхдээ очих мөчид ядарснаа мартсан.'],['B','The red cliffs at sunset were breathtaking, and the students were fascinated when our guide showed them where dinosaur eggs had been found.','Нар жаргах үеийн улаан хад амьсгал хураам байсан бөгөөд хөтөч үлэг гүрвэлийн өндөг олдсон газрыг үзүүлэхэд сурагчид их сонирхсон.'],['B','What made it special was the hospitality of a local herder family, who invited us into their ger for tea.','Онцгой болгосон зүйл нь биднийг гэртээ цайлж дайлсан нутгийн малчин айлын зочломтгой зан байлаа.'],['B','All in all, it broadened my students\' horizons, and it reminded me how rich our heritage is.','Товчхондоо, энэ нь сурагчдын маань ертөнцийг үзэх хүрээг тэлж, бидний өв ямар баялаг болохыг надад сануулсан.']]},
{t:'IELTS Part 3: Tourism',tm:'IELTS 3-р хэсэг: Аялал жуулчлал',lines:[['A','What are the positive and negative effects of tourism?','Аялал жуулчлалын эерэг, сөрөг нөлөө юу вэ?'],['B','On the positive side, tourism boosts the economy and creates jobs, especially in rural areas.','Эерэг талаас аялал жуулчлал эдийн засгийг дэмжиж, ялангуяа хөдөө орон нутагт ажлын байр бий болгодог.'],['B','On the negative side, mass tourism can damage nature and make culture less authentic.','Сөрөг талаас олон нийтийн аялал жуулчлал байгалийг сүйтгэж, соёлыг өвөрмөц бус болгож болно.'],['A','How can countries attract tourists without damaging their culture?','Улс орнууд соёлоо гэмтээлгүйгээр жуулчдыг хэрхэн татах вэ?'],['B','I think eco-tourism is the answer. Local communities should be involved, and visitors should learn about local etiquette.','Эко аялал бол хариулт гэж боддог. Нутгийн иргэдийг оролцуулж, жуулчид нутгийн ёс жудгийн талаар мэдэх хэрэгтэй.']]}],
story:{t:'IELTS listening: A guided tour',tm:'IELTS сонсгол: Хөтөчтэй аялал',listen:true,s:[['Good morning, everyone, and welcome to our one-day tour of Karakorum.','Өглөөний мэнд, Хархорумын нэг өдрийн аялалд тавтай морилно уу.'],['My name is Tsetseg, and I\'ll be your guide today.','Намайг Цэцэг гэдэг, өнөөдөр би та бүхний хөтөч байна.'],['First, let me explain the plan for the day.','Эхлээд өнөөдрийн төлөвлөгөөг тайлбарлая.'],['We\'ll start at Erdene Zuu Monastery, which was built in 1585.','Бид 1585 онд баригдсан Эрдэнэ Зуу хийдээс эхэлнэ.'],['It is surrounded by a wall with one hundred and eight stupas.','Түүнийг зуун найман суврагатай ханаар хүрээлсэн.'],['Please note that photos are not allowed inside the temples.','Сүмийн дотор зураг авахыг хориглодгийг анхаарна уу.'],['At twelve thirty, we\'ll have lunch at a local restaurant, where you can try traditional khuushuur.','12:30-д бид нутгийн ресторанд үдийн хоол идэж, уламжлалт хуушуур амсах боломжтой.'],['In the afternoon, we\'ll visit the Karakorum Museum, which displays objects from the thirteenth century.','Үдээс хойш 13-р зууны эд өлгийн зүйлсийг дэлгэн үзүүлдэг Хархорум музейд очно.'],['The bus will leave the museum at four o\'clock sharp, so please don\'t be late.','Автобус музейгээс яг дөрвөн цагт хөдөлнө, тиймээс битгий хоцроорой.'],['Remember to bring warm clothes, because the wind can be very strong here.','Энд салхи их хүчтэй байдаг тул дулаан хувцас авчрахаа мартуузай.']],
gl:{monastery:'хийд',surrounded:'хүрээлэгдсэн',stupas:'суврага','please note':'анхаарна уу',temples:'сүм',displays:'дэлгэн үзүүлдэг',objects:'эд зүйлс','thirteenth century':'13-р зуун',sharp:'яг (цаг)'},
q:[{q:'When was Erdene Zuu built?',o:['1585','1855','1258'],a:0},{q:'What is not allowed inside the temples?',o:['Talking','Photos','Shoes'],a:1},{q:'What time does the bus leave the museum?',o:['3:00','4:00','4:30'],a:1}]},
speak:[['Part 2: Describe a tourist attraction in your country that you would recommend.','2-р хэсэг: Танай улсын санал болгох үзвэр газрыг тайлбарла.','I would definitely recommend Khuvsgul Lake… The scenery is absolutely stunning… Visitors can go horse riding and stay with nomadic families…'],['Part 3: Why do people like to travel abroad?','3-р хэсэг: Хүмүүс яагаад гадаадад аялах дуртай байдаг вэ?','I think travel broadens your horizons. People are fascinated by different cultures, and it\'s exciting to try authentic local food. Also, travelling helps people relax and escape their routines.'],['Part 3: Is it important to preserve traditional customs?','3-р хэсэг: Уламжлалт заншлаа хадгалах чухал уу?','Absolutely. Our customs are part of our identity and heritage. However, I believe traditions can change slightly with time, as long as their meaning is preserved.']]}
]);

{id:33,st:3,t:'Media and advertising',tm:'Хэвлэл мэдээлэл ба зар сурталчилгаа',c:'#d00000',sc:['📢','Media and ads','Хэвлэл мэдээлэл, зар'],
goal:{en:'Discuss media and advertising, and report opinions with a range of reporting verbs.',mn:'Хэвлэл мэдээлэл, зар сурталчилгааг хэлэлцэж, олон төрлийн дамжуулах үйл үгээр санал бодлыг дамжуулах.'},
words:[['advertisement','зар сурталчилгаа','The advertisement was very creative.','Зар маш бүтээлч байлаа.','📺'],['commercial','телевизийн зар','There are too many commercials on TV.','Телевизээр хэт олон зар гардаг.','🎞️'],['brand','брэнд','Teenagers care about famous brands.','Өсвөр насныхан алдартай брэндэд анхаардаг.','🏷️'],['consumer','хэрэглэгч','Consumers compare prices online.','Хэрэглэгчид онлайнаар үнэ харьцуулдаг.','🛒'],['target audience','зорилтот хэрэглэгч','Children are the target audience of toy ads.','Тоглоомын зарын зорилтот хэрэглэгч бол хүүхдүүд.','🎯'],['persuade','итгүүлэх, ятгах','Ads try to persuade us to buy things.','Зар биднийг юм худалдан авахыг ятгадаг.','🗣️'],['influencer','инфлюэнсер','Influencers promote products on Instagram.','Инфлюэнсерүүд Instagram-д бүтээгдэхүүн сурталчилдаг.','🤳'],['promote','сурталчлах','The company promoted its new phone.','Компани шинэ утсаа сурталчилсан.','📣'],['sponsor','ивээн тэтгэгч','The event was sponsored by a bank.','Арга хэмжээг банк ивээн тэтгэсэн.','🤝'],['misleading','төөрөгдүүлсэн','The advert was misleading.','Зар төөрөгдүүлсэн байлаа.','🌀'],['exaggerate','хэтрүүлэх','Advertisements often exaggerate.','Зар ихэвчлэн хэтрүүлдэг.','🔊'],['manipulate','хуурч мэхлэх, удирдах','Some ads manipulate our emotions.','Зарим зар бидний сэтгэл хөдлөлийг удирддаг.','🎭'],['materialistic','эд хөрөнгөнд шүтэгч','Society is becoming more materialistic.','Нийгэм илүү эд хөрөнгөнд шүтэгч болж байна.','💰'],['press','хэвлэл','Freedom of the press is essential.','Хэвлэлийн эрх чөлөө зайлшгүй.','🗞️'],['journalism','сэтгүүл зүй','Good journalism checks the facts.','Сайн сэтгүүл зүй баримтыг шалгадаг.','✒️'],['biased','нэг талыг барьсан','This article is biased.','Энэ нийтлэл нэг талыг барьсан.','⚖️'],['objective','бодит, хөндлөнгийн','News should be objective.','Мэдээ бодит байх ёстой.','🎯'],['coverage','мэдээлэх хамрах хүрээ','The election got a lot of coverage.','Сонгуулийг маш их мэдээлсэн.','📡'],['censorship','цензур','Censorship limits free speech.','Цензур үг хэлэх эрх чөлөөг хязгаарладаг.','🚫'],['claim','мэдэгдэх','The company claims its product is the best.','Компани бүтээгдэхүүнээ хамгийн шилдэг гэж мэдэгддэг.','📢'],['admit','хүлээн зөвшөөрөх','The minister admitted making a mistake.','Сайд алдаа гаргаснаа хүлээн зөвшөөрсөн.','🙋'],['deny','үгүйсгэх','The company denied the accusations.','Компани буруутгалыг үгүйсгэсэн.','🙅'],['warn','анхааруулах','Doctors warned that sugar is harmful.','Эмч нар чихэр хортой гэж анхааруулсан.','⚠️'],['suggest','санал болгох','Experts suggest limiting screen time.','Мэргэжилтнүүд дэлгэцийн цагийг хязгаарлахыг санал болгодог.','💡'],['promise','амлах','The ad promised fast results.','Зар хурдан үр дүн амласан.','🤞'],['urge','уриалах','The government urged people to stay home.','Засгийн газар хүмүүсийг гэртээ байхыг уриалсан.','📣'],['catchy','санаанд амархан үлдэх','The song in the advert is very catchy.','Зарын дуу санаанд амархан үлддэг.','🎵'],['slogan','уриа','The slogan is short and clever.','Уриа нь богино бөгөөд ухаалаг.','💬'],['ban','хориглох','Junk food ads should be banned during children\'s shows.','Хүүхдийн нэвтрүүлгийн үеэр хог хоолны зарыг хориглох ёстой.','⛔'],['impulse buy','гэнэтийн худалдан авалт','That jacket was an impulse buy.','Тэр хүрэм гэнэтийн худалдан авалт байлаа.','⚡']],
gram:{t:'Reporting verbs: claim, admit, deny, warn, suggest, promise',tm:'Дамжуулах үйл үг: claim, admit, deny, warn, suggest, promise',
en:'<p>Use reporting verbs instead of always saying "said". They follow different patterns:<\/p><p>+ <b>that<\/b>: claim, admit, warn, promise, suggest — The company <b>claimed that<\/b> its product was natural.<\/p><p>+ <b>to + verb<\/b>: promise, refuse, agree, offer — They <b>promised to<\/b> refund the money.<\/p><p>+ <b>-ing<\/b>: admit, deny, suggest, recommend — He <b>denied lying<\/b>. She <b>suggested waiting<\/b>.<\/p><p>+ person + <b>to + verb<\/b>: warn, urge, advise, encourage — Doctors <b>warned people not to<\/b> eat too much sugar.<\/p>',
mn:'<p>Үргэлж «said» гэлгүйгээр дамжуулах үйл үг хэрэглэ. Тэд өөр өөр хэлбэртэй:<\/p><p>+ <b>that<\/b>: claim (мэдэгдэх), admit (хүлээх), warn, promise — The company <b>claimed that<\/b>…<\/p><p>+ <b>to + үйл үг<\/b>: promise (амлах), refuse (татгалзах), agree, offer — They <b>promised to<\/b> refund…<\/p><p>+ <b>-ing<\/b>: admit, deny (үгүйсгэх), suggest, recommend — He <b>denied lying<\/b>. (Тэр худал хэлснээ үгүйсгэсэн.)<\/p><p>+ хүн + <b>to<\/b>: warn, urge, advise, encourage — Doctors <b>warned people not to<\/b> eat too much sugar.<\/p>',
ex:[['The advert claimed that the cream made you look ten years younger.','Зар энэ тос таныг арван насаар залуу харагдуулна гэж мэдэгдсэн.'],['The company admitted making a mistake.','Компани алдаа гаргаснаа хүлээн зөвшөөрсөн.'],['The influencer denied receiving money for the post.','Инфлюэнсер нийтлэлийнхээ төлөө мөнгө авснаа үгүйсгэсэн.'],['Teachers encouraged students to check their sources.','Багш нар сурагчдыг эх сурвалжаа шалгахыг уриалсан.'],['Experts suggest limiting children\'s screen time.','Мэргэжилтнүүд хүүхдийн дэлгэцийн цагийг хязгаарлахыг санал болгодог.']],

dl:[{t:'IELTS Part 3: Advertising and children',tm:'IELTS 3-р хэсэг: Зар сурталчилгаа ба хүүхэд',lines:[['A','Do you think advertising aimed at children should be banned?','Хүүхдэд чиглэсэн зар сурталчилгааг хориглох ёстой гэж бодож байна уу?'],['B','I think some types should be. Children can\'t always tell the difference between a programme and an advert.','Заримыг нь хориглох ёстой гэж боддог. Хүүхдүүд нэвтрүүлэг, зар хоёрыг үргэлж ялгаж чаддаггүй.'],['B','For example, junk food companies use cartoon characters to persuade children, and that contributes to obesity.','Жишээ нь хог хоолны компаниуд хүүхдүүдийг ятгахдаа хүүхэлдэйн дүр ашигладаг бөгөөд энэ нь таргалалтад нөлөөлдөг.'],['A','But isn\'t it the parents\' responsibility?','Гэхдээ энэ эцэг эхийн хариуцлага биш гэж үү?'],['B','To some extent, yes. However, parents can\'t control everything their children see online.','Тодорхой хэмжээгээр тийм. Гэвч эцэг эхчүүд хүүхдийнхээ онлайнаар харж буй бүх зүйлийг хянаж чадахгүй.'],['B','So I would suggest stricter rules for advertising during children\'s programmes.','Тиймээс хүүхдийн нэвтрүүлгийн үеэр зар сурталчилгааны илүү хатуу дүрэм тогтоохыг санал болгоно.']]},
{t:'Influencers',tm:'Инфлюэнсерүүд',lines:[['A','My daughter bought a face cream because an influencer recommended it.','Нэг инфлюэнсер санал болгосон учраас охин маань нүүрний тос авсан.'],['B','Was it any good?','Сайн байсан уу?'],['A','Not really. The influencer claimed it worked in a week, but it didn\'t.','Тийм ч биш. Инфлюэнсер нэг долоо хоногт үр дүнгээ өгнө гэж мэдэгдсэн ч болоогүй.'],['B','Many influencers are paid to promote products, but they don\'t always admit it.','Олон инфлюэнсерт бүтээгдэхүүн сурталчлахын тулд мөнгө төлдөг ч тэд үүнийгээ үргэлж хүлээдэггүй.'],['A','I\'ve encouraged her to read real reviews before buying anything.','Би охиноо юм авахаасаа өмнө жинхэнэ сэтгэгдэл уншихыг зөвлөсөн.']]}],
story:{t:'IELTS listening: A lecture on advertising',tm:'IELTS сонсгол: Зар сурталчилгааны тухай лекц',listen:true,s:[['Today\'s lecture is about the psychology of advertising.','Өнөөдрийн лекц зар сурталчилгааны сэтгэл зүйн тухай.'],['Researchers estimate that the average city resident sees between four and ten thousand adverts every day.','Судлаачид хотын дундаж оршин суугч өдөрт дөрвөөс арван мянган зар хардаг гэж тооцоолдог.'],['Most of these messages are processed unconsciously.','Эдгээр мессежийн ихэнхийг бид ухамсаргүйгээр хүлээн авдаг.'],['One common technique is repetition: the more often we see a brand, the more we trust it.','Түгээмэл аргуудын нэг нь давталт: бид брэндийг олон харах тусам түүнд илүү итгэдэг.'],['Another technique is social proof — showing that many other people already use a product.','Өөр нэг арга бол нийгмийн нотолгоо — олон хүн бүтээгдэхүүнийг аль хэдийн хэрэглэж буйг харуулах.'],['Advertisers also use scarcity, for example with phrases like "only three left" or "today only".','Зар сурталчлагчид мөн хомсдол ашигладаг, жишээ нь «ердөө гурав үлдлээ» эсвэл «зөвхөн өнөөдөр» гэх мэт.'],['These messages create a feeling of urgency and lead to impulse buying.','Эдгээр мессеж яаралтай мэдрэмж төрүүлж, гэнэтийн худалдан авалтад хүргэдэг.'],['Interestingly, studies show that colour also matters: red tends to suggest excitement, while blue suggests trust.','Сонирхолтой нь өнгө ч мөн чухал болохыг судалгаа харуулдаг: улаан догдлолыг, харин цэнхэр итгэлийг илэрхийлэх хандлагатай.'],['That is why many banks and technology companies choose blue logos.','Тиймээс олон банк, технологийн компани цэнхэр лого сонгодог.'],['Next week, we will look at how these techniques are regulated by law.','Ирэх долоо хоногт эдгээр аргыг хуулиар хэрхэн зохицуулдгийг үзнэ.']],

q:[{q:'How many adverts does an average city resident see daily?',o:['400–1,000','4,000–10,000','40,000'],a:1},{q:'What does "only three left" create?',o:['A feeling of urgency','Trust','Boredom'],a:0},{q:'Which colour suggests trust?',o:['Red','Blue','Yellow'],a:1}]},
speak:[['Part 2: Describe an advertisement you remember. Say where you saw it, what it was for, what it showed, and why you remember it.','2-р хэсэг: Санаж буй нэгэн зараа тайлбарла: хаана харсан, юуны зар, юу харуулсан, яагаад санаж байгаа.','I\'d like to talk about a TV commercial for a mobile network… It showed a herder in the countryside video-calling his daughter abroad… The slogan was very catchy… I remember it because it was so emotional.'],['Part 3: Do advertisements make people more materialistic?','3-р хэсэг: Зар сурталчилгаа хүмүүсийг илүү эд хөрөнгөнд шүтэгч болгодог уу?','To a large extent, yes. Ads constantly suggest that buying new things will make us happier, and influencers promote expensive lifestyles. However, people can learn to be critical consumers.'],['Part 3: Is the news in your country objective?','3-р хэсэг: Танай улсын мэдээ бодит байдаг уу?','It depends on the source. Some channels are quite objective, whereas others are biased because they are owned by politicians. That\'s why I compare several sources.']]},

{id:34,st:3,t:'Cities and housing',tm:'Хот ба орон сууц',c:'#6c757d',sc:['🏙️','Urban life','Хотын амьдрал'],
goal:{en:'Discuss urban problems and solutions with advanced comparison and quantifiers.',mn:'Хотын асуудал, шийдлийг ахисан түвшний харьцуулалт ба тоо хэмжээний үгээр хэлэлцэх.'},
words:[['urbanisation','хотжилт','Urbanisation has been very fast in Mongolia.','Монголд хотжилт маш хурдан явагдсан.','🏗️'],['migration','шилжин суурьшилт','Rural migration to the capital continues.','Хөдөөнөөс нийслэл рүү шилжин суурьших үргэлжилсээр байна.','🚚'],['ger district','гэр хороолол','Many families live in ger districts.','Олон айл гэр хороололд амьдардаг.','⛺'],['infrastructure','дэд бүтэц','The city needs better infrastructure.','Хотод илүү сайн дэд бүтэц хэрэгтэй.','🛤️'],['congestion','түгжрэл','Traffic congestion wastes hours every day.','Замын түгжрэл өдөр бүр олон цагийг үрдэг.','🚗'],['affordable','боломжийн үнэтэй','Affordable housing is in short supply.','Боломжийн үнэтэй орон сууц дутагдалтай.','🏠'],['property','үл хөдлөх хөрөнгө','Property prices have doubled.','Үл хөдлөх хөрөнгийн үнэ хоёр дахин өссөн.','🏘️'],['mortgage','орон сууцны зээл','They took out a mortgage.','Тэд орон сууцны зээл авсан.','🏦'],['tenant','түрээслэгч','Tenants have rights too.','Түрээслэгчид ч эрхтэй.','🔑'],['landlord','түрээслүүлэгч','The landlord raised the rent.','Түрээслүүлэгч түрээсээ нэмсэн.','👤'],['suburb','хотын захын хороолол','They moved to the suburbs.','Тэд хотын зах руу нүүсэн.','🏡'],['high-rise','өндөр барилга','High-rise apartments are everywhere.','Өндөр барилгын орон сууц хаа сайгүй.','🏢'],['green space','ногоон байгууламж','Cities need more green space.','Хотуудад илүү их ногоон байгууламж хэрэгтэй.','🌳'],['pedestrian','явган зорчигч','The street is for pedestrians only.','Энэ гудамж зөвхөн явган зорчигчдод зориулагдсан.','🚶'],['cycle lane','дугуйн зам','There are few cycle lanes in the city.','Хотод дугуйн зам цөөн.','🚲'],['overcrowded','хэт дүүрэн','Schools in the city are overcrowded.','Хотын сургуулиуд хэт дүүрэн.','👥'],['amenities','үйлчилгээ, тохижилт','The area has good amenities.','Тус бүс сайн үйлчилгээтэй.','🛒'],['commuter','ажилдаа явагч','Commuters spend hours in traffic.','Ажилдаа явагчид түгжрэлд олон цаг зарцуулдаг.','🧍'],['decentralise','төвлөрлийг сааруулах','The government plans to decentralise.','Засгийн газар төвлөрлийг сааруулахаар төлөвлөж байна.','🔀'],['satellite city','дагуул хот','A new satellite city is being built.','Шинэ дагуул хот баригдаж байна.','🛰️'],['far more','хамаагүй илүү','Seoul is far more crowded than Ulaanbaatar.','Сөүл Улаанбаатараас хамаагүй хүн ихтэй.','⏫'],['slightly','бага зэрэг','Rent is slightly cheaper in the suburbs.','Захын хороололд түрээс бага зэрэг хямд.','🔽'],['the more… the more','… тусам …','The bigger the city, the worse the traffic.','Хот томрох тусам түгжрэл улам муудна.','🔁'],['a great deal of','маш их','A great deal of money is spent on roads.','Замд маш их мөнгө зарцуулдаг.','💲'],['few','цөөн (тоологдох)','Few people cycle to work in winter.','Өвөл ажилдаа дугуйгаар явдаг хүн цөөн.','🤏'],['a few','хэдэн','A few parks have been built recently.','Саяхан хэдэн цэцэрлэгт хүрээлэн баригдсан.','✌️'],['little','бага (тоологдохгүй)','There is little space for parking.','Зогсоолын зай бага.','🅿️'],['plenty of','хангалттай их','There are plenty of cafés downtown.','Хотын төвд кафе хангалттай их бий.','➕'],['the majority of','ихэнх','The majority of people live in apartments.','Ихэнх хүн орон сууцанд амьдардаг.','📊'],['quality of life','амьдралын чанар','Green spaces improve quality of life.','Ногоон байгууламж амьдралын чанарыг сайжруулдаг.','🌈']],
gram:{t:'Advanced comparison and quantifiers',tm:'Ахисан харьцуулалт ба тоо хэмжээний үг',
en:'<p>Modify comparatives: <b>far / much / a lot<\/b> (big difference), <b>slightly / a bit<\/b> (small difference): Seoul is <b>far<\/b> bigger. Rent is <b>slightly<\/b> cheaper.<\/p><p><b>The + comparative…, the + comparative<\/b>: <b>The more<\/b> cars there are, <b>the worse<\/b> the air becomes.<\/p><p><b>not nearly as … as<\/b> = much less: Darkhan is <b>not nearly as<\/b> crowded <b>as<\/b> the capital.<\/p><p>Quantifiers: countable — <b>many, few, a few, a number of<\/b>; uncountable — <b>much, little, a little, a great deal of<\/b>; both — <b>a lot of, plenty of, the majority of, most<\/b>. <b>Few<\/b> = not many (negative); <b>a few<\/b> = some (positive).<\/p>',
mn:'<p>Харьцуулалтыг хүчжүүлэх: <b>far / much<\/b> (их ялгаа), <b>slightly<\/b> (бага ялгаа): Seoul is <b>far<\/b> bigger. (Сөүл хамаагүй том.)<\/p><p><b>The + харьцуулсан…, the + харьцуулсан<\/b> = … тусам …: <b>The more<\/b> cars, <b>the worse<\/b> the air. (Машин олон байх тусам агаар улам муудна.)<\/p><p><b>not nearly as … as<\/b> = хамаагүй бага.<\/p><p>Тоо хэмжээ: тоологдох — many, few, a few; тоологдохгүй — much, little, a great deal of. <b>few<\/b> = цөөн (сөрөг утгатай), <b>a few<\/b> = хэдэн (эерэг).<\/p>',
ex:[['Housing in the capital is far more expensive than in the provinces.','Нийслэлд орон сууц аймгуудаас хамаагүй үнэтэй.'],['The bigger the city grows, the more serious the traffic problem becomes.','Хот томрох тусам түгжрэлийн асуудал улам ноцтой болдог.'],['Small towns are not nearly as polluted as Ulaanbaatar.','Жижиг хотууд Улаанбаатар шиг бохирдсон огт биш.'],['Few people can afford a new apartment without a mortgage.','Зээлгүйгээр шинэ байр авч чадах хүн цөөн.'],['The majority of residents want more green space.','Оршин суугчдын ихэнх нь илүү их ногоон байгууламж хүсдэг.']],
q:[{q:'Rent in the city centre is ___ higher than in the suburbs.',o:['far','very','more'],a:0},{q:'The more people move to the city, ___ the traffic gets.',o:['the worse','worse','the worst'],a:0},{q:'There is ___ green space in the centre. (not much)',o:['few','little','a few'],a:1},{q:'___ people live in high-rise buildings. (most)',o:['The majority of','A little','Much'],a:0},{q:'Only a ___ parks have been built.',o:['little','few','lot'],a:1},{q:'The person who pays rent = ___',o:['landlord','tenant','commuter'],a:1}]},
dl:[{t:'IELTS Part 3: Life in big cities',tm:'IELTS 3-р хэсэг: Том хотын амьдрал',lines:[['A','Why do so many people move from the countryside to the capital?','Яагаад олон хүн хөдөөнөөс нийслэл рүү нүүдэг вэ?'],['B','Mainly because there are far more job opportunities and better schools in the city.','Голчлон хотод ажлын боломж хамаагүй олон, сургууль илүү сайн учраас.'],['B','After a severe dzud, a great deal of herders lose their animals, so they have little choice.','Хүнд зудын дараа маш олон малчин малаа алддаг тул тэдэнд сонголт бага үлддэг.'],['A','What problems does this cause?','Энэ ямар асуудал үүсгэдэг вэ?'],['B','The faster the city grows, the harder it is to provide infrastructure. Ger districts lack heating and roads, which leads to pollution.','Хот хурдан томрох тусам дэд бүтэц бий болгох улам хэцүү болдог. Гэр хороолол халаалт, замгүй байдаг нь бохирдолд хүргэдэг.'],['A','How could the government solve it?','Засгийн газар үүнийг яаж шийдэж болох вэ?'],['B','By decentralising: building satellite cities and creating jobs in the provinces, so fewer people need to move.','Төвлөрлийг сааруулах замаар: дагуул хот барьж, аймгуудад ажлын байр бий болговол цөөн хүн нүүх шаардлагатай болно.']]},
{t:'Renting a flat',tm:'Байр түрээслэх',lines:[['A','I\'m looking for a flat to rent. Any advice?','Би түрээсийн байр хайж байна. Зөвлөгөө байна уу?'],['B','Check the area first. The suburbs are slightly cheaper, but the commute is much longer.','Эхлээд бүсээ шалга. Захын хороолол бага зэрэг хямд ч ажилдаа явах зам хамаагүй урт.'],['A','I\'d rather pay a bit more and live near work.','Жаахан илүү төлөөд ажлынхаа ойролцоо амьдарвал дээр.'],['B','Then make sure you sign a contract with the landlord, and ask who pays the heating bill.','Тэгвэл түрээслүүлэгчтэй гэрээ байгуулж, халаалтын төлбөрийг хэн төлөхийг асуугаарай.']]}],
story:{t:'IELTS listening: A city planning meeting',tm:'IELTS сонсгол: Хот төлөвлөлтийн хурал',listen:true,s:[['Good evening, residents. Thank you for coming to this public meeting about the new district plan.','Оройн мэнд, оршин суугчид аа. Шинэ дүүргийн төлөвлөгөөний олон нийтийн хуралд ирсэнд баярлалаа.'],['As you know, the population of our district has grown by thirty percent in five years.','Та бүхний мэдэж байгаачлан манай дүүргийн хүн ам таван жилд гучин хувиар өссөн.'],['However, the number of schools and parks has hardly changed.','Гэвч сургууль, цэцэрлэгт хүрээлэнгийн тоо бараг өөрчлөгдөөгүй.'],['The plan has three main parts.','Төлөвлөгөө гурван үндсэн хэсэгтэй.'],['First, two new schools will be built by 2027, each with space for one thousand two hundred students.','Нэгдүгээрт, 2027 он гэхэд тус бүр мянга хоёр зуун сурагчийн багтаамжтай хоёр шинэ сургууль баригдана.'],['Second, the old market area will be turned into a park with a playground and a cycle lane.','Хоёрдугаарт, хуучин захын талбайг тоглоомын талбай, дугуйн замтай цэцэрлэгт хүрээлэн болгоно.'],['Third, a new bus route will connect the district directly to the city centre.','Гуравдугаарт, шинэ автобусны чиглэл дүүргийг хотын төвтэй шууд холбоно.'],['Buses will run every ten minutes during rush hour.','Оргил цагаар автобус арван минут тутам явна.'],['The total cost of the project is estimated at forty billion tugriks.','Төслийн нийт өртгийг дөчин тэрбум төгрөг гэж тооцоолж байна.'],['After the presentation, you can write your comments on the forms at the back of the hall.','Танилцуулгын дараа танхимын ард байгаа маягт дээр санал сэтгэгдлээ бичиж болно.']],
gl:{residents:'оршин суугчид','public meeting':'олон нийтийн хурал',district:'дүүрэг',hardly:'бараг … -гүй','turned into':'… болгох',playground:'тоглоомын талбай',route:'чиглэл','rush hour':'оргил цаг',estimated:'тооцоолсон',forms:'маягт'},
q:[{q:'How much has the population grown?',o:['13% in five years','30% in five years','30% in ten years'],a:1},{q:'What will the old market become?',o:['A school','A park','A car park'],a:1},{q:'How often will buses run at rush hour?',o:['Every 5 minutes','Every 10 minutes','Every 20 minutes'],a:1}]},
speak:[['Part 2: Describe a place in your city that you think should be improved.','2-р хэсэг: Танай хотын сайжруулах ёстой гэж бодож буй нэг газрыг тайлбарла.','I\'d like to talk about the area around the central bus station… It\'s far more crowded than it should be… If more pedestrian streets were built, the quality of life would improve…'],['Part 3: What are the advantages of living in a high-rise apartment?','3-р хэсэг: Өндөр барилгын орон сууцанд амьдрахын давуу тал юу вэ?','The main advantage is that apartments have central heating and are far more comfortable than gers in winter. However, the more high-rise buildings there are, the less green space is left.'],['Part 3: Should cars be banned from city centres?','3-р хэсэг: Хотын төвд машин хориглох ёстой юу?','I think a complete ban would be too extreme, but the majority of the centre could be pedestrian-only. Many European cities have done this, and air quality has improved slightly.']]},

{id:35,st:3,t:'Science and the future',tm:'Шинжлэх ухаан ба ирээдүй',c:'#0077b6',sc:['🔭','The world of tomorrow','Маргаашийн ертөнц'],
goal:{en:'Make predictions about the future with future continuous and future perfect.',mn:'Future continuous ба future perfect-ээр ирээдүйн талаар таамаглах.'},
words:[['research','судалгаа','Scientific research needs funding.','Шинжлэх ухааны судалгаанд санхүүжилт хэрэгтэй.','🔬'],['experiment','туршилт','The experiment was successful.','Туршилт амжилттай болсон.','🧪'],['laboratory','лаборатори','She works in a laboratory.','Тэр лабораторид ажилладаг.','🥼'],['hypothesis','таамаглал (шинжлэх ухааны)','The results proved the hypothesis.','Үр дүн таамаглалыг баталсан.','💭'],['evidence','нотолгоо','There is strong evidence for climate change.','Уур амьсгалын өөрчлөлтийн хүчтэй нотолгоо бий.','📎'],['genetic','генетик','Genetic research can cure diseases.','Генетикийн судалгаа өвчнийг эдгээж чадна.','🧬'],['space exploration','сансрын судалгаа','Space exploration is very expensive.','Сансрын судалгаа маш үнэтэй.','🚀'],['colonise','колони байгуулах','Will humans colonise Mars?','Хүн төрөлхтөн Ангараг гариг дээр колони байгуулах уу?','🪐'],['astronaut','сансрын нисгэгч','Mongolia\'s first astronaut was Gurragchaa.','Монголын анхны сансрын нисгэгч Гүррагчаа.','👨‍🚀'],['self-driving','өөрөө жолоодлоготой','Self-driving cars are being tested.','Өөрөө жолоодлоготой машиныг туршиж байна.','🚘'],['virtual reality','виртуал бодит байдал','Students explored Rome in virtual reality.','Сурагчид виртуал бодит байдлаар Ромыг судалсан.','🥽'],['renewable energy','сэргээгдэх эрчим хүч','By 2050, most energy will be renewable.','2050 он гэхэд ихэнх эрчим хүч сэргээгдэх болно.','🔆'],['vaccine','вакцин','The vaccine was developed quickly.','Вакциныг хурдан бүтээсэн.','💉'],['cure','эмчлэх; эм','Scientists hope to find a cure for cancer.','Эрдэмтэд хорт хавдрын эмчилгээ олно гэж найдаж байна.','🩹'],['life span','наслалт','Our life span will increase.','Бидний наслалт уртсах болно.','⏳'],['ethics','ёс зүй','Cloning raises questions of ethics.','Клон хийх нь ёс зүйн асуулт үүсгэдэг.','⚖️'],['breakthrough','нээлт','It was a major scientific breakthrough.','Энэ бол шинжлэх ухааны томоохон нээлт байлаа.','💥'],['predict','таамаглах','Nobody can predict the future exactly.','Ирээдүйг яг таг таамаглаж чадах хүн байхгүй.','🔮'],['by 2050','2050 он гэхэд','By 2050, cities will have changed a lot.','2050 он гэхэд хотууд их өөрчлөгдсөн байна.','📅'],['in a decade','арван жилийн дараа','In a decade, we\'ll be using AI everywhere.','Арван жилийн дараа бид хиймэл оюун ухааныг хаа сайгүй ашиглаж байх болно.','🔟'],['will be living','амьдарч байх болно','People will be living longer.','Хүмүүс илүү урт насалж байх болно.','🏡'],['will have invented','зохион бүтээсэн байх болно','Scientists will have invented new medicines.','Эрдэмтэд шинэ эм зохион бүтээсэн байх болно.','💊'],['optimistic','өөдрөг','I\'m optimistic about the future.','Би ирээдүйд өөдрөг ханддаг.','🌞'],['pessimistic','гутранги','Some people are pessimistic about AI.','Зарим хүн хиймэл оюун ухаанд гутранги ханддаг.','🌧️'],['funding','санхүүжилт','The project lost its funding.','Төсөл санхүүжилтээ алдсан.','💰'],['data','өгөгдөл','The data supports the theory.','Өгөгдөл онолыг дэмжиж байна.','📊'],['theory','онол','Einstein\'s theory changed physics.','Эйнштейний онол физикийг өөрчилсөн.','📐'],['curious','сониуч','Scientists are naturally curious.','Эрдэмтэд угаасаа сониуч.','🧐'],['innovative','шинэлэг','It\'s an innovative solution.','Энэ бол шинэлэг шийдэл.','💡'],['bound to','… нь гарцаагүй','Technology is bound to change education.','Технологи боловсролыг өөрчлөх нь гарцаагүй.','🔗']],
gram:{t:'Future continuous and future perfect',tm:'Future continuous ба future perfect',
en:'<p><b>Future continuous<\/b> (will be + -ing) = an action in progress at a time in the future: This time next year, I<b>\'ll be studying<\/b> for IELTS. In 2040, people <b>will be using<\/b> self-driving cars.<\/p><p><b>Future perfect<\/b> (will have + past participle) = completed <b>before<\/b> a time in the future: <b>By<\/b> 2030, scientists <b>will have found<\/b> new treatments. By June, I <b>will have finished<\/b> this course.<\/p><p>Degrees of certainty: <b>will definitely / is bound to<\/b> (sure), <b>will probably / is likely to<\/b>, <b>may / might<\/b>, <b>probably won\'t / is unlikely to<\/b>.<\/p>',
mn:'<p><b>Future continuous<\/b> (will be + -ing) = ирээдүйн тодорхой мөчид үргэлжилж байх үйлдэл: This time next year, I<b>\'ll be studying<\/b> for IELTS. (Ирэх жилийн энэ үед би IELTS-д бэлдэж байх болно.)<\/p><p><b>Future perfect<\/b> (will have + 3-р хэлбэр) = ирээдүйн нэг цагаас <b>өмнө<\/b> дууссан байх: <b>By<\/b> 2030, scientists <b>will have found<\/b> new treatments. (2030 он гэхэд эрдэмтэд шинэ эмчилгээ олсон байх болно.)<\/p><p>Итгэлийн түвшин: <b>is bound to<\/b> (гарцаагүй), <b>is likely to<\/b> (магадлалтай), <b>might<\/b> (магадгүй), <b>is unlikely to<\/b> (магадлал бага).<\/p>',
ex:[['This time next year, I\'ll be teaching my new students.','Ирэх жилийн энэ үед би шинэ сурагчиддаа хичээл зааж байх болно.'],['By 2035, most cars will have become electric.','2035 он гэхэд ихэнх машин цахилгаан болсон байна.'],['In twenty years, we\'ll probably be working fewer hours.','Хорин жилийн дараа бид магадгүй цөөн цаг ажиллаж байх болно.'],['By the end of this course, I will have learned over a thousand words.','Энэ сургалтын төгсгөл гэхэд би мянга гаруй үг сурсан байх болно.'],['Humans are unlikely to live on Mars before 2060.','2060 оноос өмнө хүмүүс Ангараг дээр амьдрах магадлал бага.']],
q:[{q:'This time tomorrow, I ___ on a plane.',o:['will fly','will be flying','will have flown'],a:1},{q:'By 2030, they ___ a cure.',o:['will find','will be finding','will have found'],a:2},{q:'By June, I ___ this book.',o:['will have read','will be reading','read'],a:0},{q:'Technology is ___ to change our lives. (sure)',o:['bound','likely not','unlikely'],a:0},{q:'People who expect good things are ___.',o:['pessimistic','optimistic','curious'],a:1},{q:'Money for research = ___',o:['funding','evidence','theory'],a:0}]},
dl:[{t:'IELTS Part 3: The future of science',tm:'IELTS 3-р хэсэг: Шинжлэх ухааны ирээдүй',lines:[['A','How do you think daily life will be different in thirty years?','Гучин жилийн дараа өдөр тутмын амьдрал хэрхэн өөр болно гэж бодож байна?'],['B','I think we\'ll be using AI assistants for almost everything, from shopping to healthcare.','Худалдан авалтаас эрүүл мэнд хүртэл бараг бүх зүйлд хиймэл оюун ухааны туслах ашиглаж байх болно гэж боддог.'],['B','By then, scientists will probably have found cures for many diseases, so people will be living longer.','Тэр үед эрдэмтэд олон өвчний эмчилгээ олсон байх магадлалтай тул хүмүүс илүү урт насалж байх болно.'],['A','Should governments spend money on space exploration?','Засгийн газар сансрын судалгаанд мөнгө зарцуулах ёстой юу?'],['B','It\'s a difficult question. On the one hand, it leads to useful inventions like GPS.','Хэцүү асуулт. Нэг талаас энэ нь GPS зэрэг хэрэгтэй бүтээлд хүргэдэг.'],['B','On the other hand, I believe solving problems on Earth, like poverty and climate change, should come first.','Нөгөө талаас ядуурал, уур амьсгалын өөрчлөлт зэрэг дэлхий дээрх асуудлыг шийдэх нь түрүүлэх ёстой гэж боддог.']]},
{t:'My English future',tm:'Миний англи хэлний ирээдүй',lines:[['A','Where do you see yourself in five years?','Таван жилийн дараа өөрийгөө хаана байна гэж төсөөлдөг вэ?'],['B','By then, I will have passed IELTS, I hope!','Тэр үед би IELTS-ээ өгчихсөн байна гэж найдаж байна!'],['A','And what will you be doing?','Тэгээд юу хийж байх вэ?'],['B','I\'ll probably be training other teachers to use technology, maybe at international conferences.','Магадгүй бусад багш нарт технологи ашиглахыг зааж, магадгүй олон улсын хурлуудад оролцож байх болно.'],['A','That sounds like a great plan.','Гайхалтай төлөвлөгөө юм.'],['B','Thanks. I\'m optimistic — I\'ve already learned so much this year.','Баярлалаа. Би өөдрөг байна — энэ жил аль хэдийн маш их зүйл сурчихлаа.']]}],
story:{t:'IELTS listening: A podcast about Mars',tm:'IELTS сонсгол: Ангараг гаригийн тухай подкаст',listen:true,s:[['Welcome to Future Talk. Today we\'re asking a big question: will humans ever live on Mars?','Future Talk-т тавтай морил. Өнөөдөр бид том асуулт тавьж байна: хүн төрөлхтөн хэзээ нэгэн цагт Ангараг дээр амьдрах уу?'],['Mars is on average two hundred and twenty-five million kilometres from Earth.','Ангараг дэлхийгээс дунджаар хоёр зуун хорин таван сая километрийн зайтай.'],['With current technology, a journey would take about seven months.','Одоогийн технологиор аялал долоон сар орчим үргэлжилнэ.'],['The biggest challenges are radiation, a lack of oxygen and extremely low temperatures.','Хамгийн том сорилтууд нь цацраг, хүчилтөрөгчийн хомсдол, туйлын хүйтэн.'],['On average, the temperature on Mars is minus sixty degrees Celsius.','Ангараг дээрх дундаж температур хасах жаран хэм.'],['Several space agencies say that the first astronauts will have landed on Mars by the late 2030s.','Хэд хэдэн сансрын агентлаг анхны сансрын нисгэгчид 2030-аад оны сүүл гэхэд Ангараг дээр газардсан байна гэж хэлдэг.'],['At first, they will be living in small underground bases.','Эхэндээ тэд газар доорх жижиг баазад амьдарч байх болно.'],['They will grow food in greenhouses and produce oxygen from ice.','Тэд хүлэмжинд хоол тарьж, мөснөөс хүчилтөрөгч гаргаж авна.'],['However, many scientists are pessimistic about a permanent city in the near future.','Гэвч ойрын ирээдүйд байнгын хот байгуулах талаар олон эрдэмтэн гутранги байна.'],['They argue that it is far cheaper and more sensible to protect the planet we already have.','Тэд бидэнд байгаа гаригаа хамгаалах нь хамаагүй хямд бөгөөд ухаалаг гэж үздэг.']],
gl:{current:'одоогийн',radiation:'цацраг','lack of':'… -ын хомсдол',extremely:'туйлын','space agencies':'сансрын агентлагууд',landed:'газардсан',underground:'газар доорх',greenhouses:'хүлэмж',permanent:'байнгын',sensible:'ухаалаг, зохистой'},
q:[{q:'How long would a journey to Mars take?',o:['Seven days','Seven months','Seven years'],a:1},{q:'What is the average temperature on Mars?',o:['–16°C','–60°C','–160°C'],a:1},{q:'Where will the first astronauts live?',o:['In underground bases','In hotels','In spaceships only'],a:0}]},
speak:[['Part 2: Describe an invention or scientific development that has changed your life.','2-р хэсэг: Таны амьдралыг өөрчилсөн шинэ бүтээл эсвэл шинжлэх ухааны ололтыг тайлбарла.','I\'d like to talk about the smartphone… It has changed the way I teach and learn… By the time I finish my IELTS course, I will have used it for over 500 hours of study…'],['Part 3: Will robots be doing most jobs in 50 years?','3-р хэсэг: 50 жилийн дараа ихэнх ажлыг робот хийж байх уу?','Robots are bound to be doing many routine jobs, especially in factories and transport. However, jobs that need empathy and creativity are unlikely to disappear. So people will be working alongside machines rather than being replaced.'],['Part 3: Should scientists be allowed to change human genes?','3-р хэсэг: Эрдэмтдэд хүний генийг өөрчлөхийг зөвшөөрөх ёстой юу?','It\'s an ethical question. Using genetic research to cure serious diseases is clearly beneficial. However, changing genes to choose a baby\'s appearance could lead to inequality, so strict rules are needed.']]},

{id:36,st:3,t:'Global issues and the final exam',tm:'Дэлхийн асуудал ба эцсийн шалгалт',c:'#370617',sc:['🌏','Global issues','Дэлхийн асуудал'],
goal:{en:'Argue complex opinions with concession and linking — and prepare for your IELTS speaking test.',mn:'Нийлмэл санал бодлоо зөвшөөрөл, холбоос үгээр маргаж илэрхийлэх — IELTS ярианы шалгалтад бэлтгэх.'},
words:[['poverty','ядуурал','Education is the best way to reduce poverty.','Боловсрол бол ядуурлыг бууруулах хамгийн сайн арга.','🥣'],['inequality','тэгш бус байдал','Income inequality is growing.','Орлогын тэгш бус байдал нэмэгдэж байна.','⚖️'],['globalisation','даяаршил','Globalisation has connected economies.','Даяаршил эдийн засгуудыг холбосон.','🌐'],['developing country','хөгжиж буй орон','Many developing countries need investment.','Хөгжиж буй олон оронд хөрөнгө оруулалт хэрэгтэй.','🏗️'],['refugee','дүрвэгч','Millions of refugees need help.','Сая сая дүрвэгч тусламж хэрэгтэй.','🏕️'],['human rights','хүний эрх','Human rights must be protected.','Хүний эрхийг хамгаалах ёстой.','✊'],['corruption','авлига','Corruption slows development.','Авлига хөгжлийг удаашруулдаг.','💼'],['aid','тусламж','Foreign aid helped build schools.','Гадаадын тусламжаар сургууль барьсан.','🤲'],['cooperation','хамтын ажиллагаа','International cooperation is essential.','Олон улсын хамтын ажиллагаа зайлшгүй.','🤝'],['conflict','зөрчил, мөргөлдөөн','Conflict destroys communities.','Мөргөлдөөн олон нийтийг сүйрүүлдэг.','⚔️'],['shortage','хомсдол','There is a global shortage of doctors.','Дэлхий даяар эмчийн хомсдол бий.','📉'],['access to','… -д хүрэх боломж','Everyone deserves access to clean water.','Хүн бүр цэвэр усанд хүрэх эрхтэй.','🚰'],['tackle','шийдвэрлэх','We must tackle these problems together.','Бид эдгээр асуудлыг хамтдаа шийдвэрлэх ёстой.','🥊'],['address','анхаарах, шийдвэрлэх','The government must address unemployment.','Засгийн газар ажилгүйдлийг шийдвэрлэх ёстой.','📮'],['controversial','маргаантай','Nuclear energy is a controversial issue.','Цөмийн эрчим хүч бол маргаантай асуудал.','🔥'],['perspective','өнцөг, үзэл','From an economic perspective, it makes sense.','Эдийн засгийн өнцгөөс харвал утга учиртай.','🔭'],['although','хэдийгээр','Although it\'s expensive, it\'s worth it.','Хэдийгээр үнэтэй ч үнэ цэнэтэй.','🔄'],['despite','… -ыг үл харгалзан','Despite the cost, the project continued.','Өртгийг үл харгалзан төсөл үргэлжилсэн.','🧱'],['nevertheless','гэсэн хэдий ч','It was difficult. Nevertheless, we succeeded.','Хэцүү байсан. Гэсэн хэдий ч бид амжилтад хүрсэн.','➰'],['while it is true that','… нь үнэн боловч','While it is true that aid helps, it is not enough.','Тусламж тус болдог нь үнэн боловч хангалтгүй.','🗨️'],['admittedly','хүлээн зөвшөөрөхөд','Admittedly, there are some risks.','Хүлээн зөвшөөрөхөд зарим эрсдэл бий.','🙋'],['furthermore','цаашлаад','Furthermore, it creates jobs.','Цаашлаад энэ нь ажлын байр бий болгодог.','➕'],['in contrast','үүний эсрэгээр','In contrast, rural areas lack services.','Үүний эсрэгээр хөдөө орон нутагт үйлчилгээ дутагдалтай.','↔️'],['consequently','улмаар','Prices rose; consequently, people bought less.','Үнэ өссөн; улмаар хүмүүс бага худалдан авсан.','➡️'],['to sum up','дүгнэж хэлэхэд','To sum up, education is the key.','Дүгнэж хэлэхэд боловсрол бол түлхүүр.','🧾'],['fluency','чөлөөтэй ярих чадвар','Fluency improves with practice.','Дадлагаар чөлөөтэй ярих чадвар сайжирдаг.','🌊'],['coherence','уялдаа холбоо','Linking words improve coherence.','Холбоос үг уялдаа холбоог сайжруулдаг.','🔗'],['lexical resource','үгийн сан','Use less common words to show your lexical resource.','Үгийн сангаа харуулахын тулд түгээмэл бус үг хэрэглэ.','📚'],['pronunciation','дуудлага','Clear pronunciation is more important than accent.','Аялгаас илүү тод дуудлага чухал.','🗣️'],['band score','оноо (IELTS)','I\'m aiming for a band score of 6.5.','Би 6.5 оноо авахыг зорьж байна.','🎯']],
gram:{t:'Concession and linking for complex arguments',tm:'Нийлмэл үндэслэлд зориулсан зөвшөөрөл ба холбоос',
en:'<p>Concession = admitting the other side before your main point (shows B2+ thinking):<\/p><p><b>Although / Even though<\/b> + clause: <b>Although<\/b> aid is useful, it can create dependence.<\/p><p><b>Despite / In spite of<\/b> + noun or -ing: <b>Despite<\/b> the cost / <b>Despite<\/b> being expensive, solar energy is worth it.<\/p><p><b>While it is true that<\/b>…, … / <b>Admittedly<\/b>, … <b>Nevertheless<\/b>, …<\/p><p>Adding: furthermore, moreover, in addition. Contrast: however, in contrast, on the other hand. Result: consequently, as a result. Conclusion: to sum up, overall.<\/p><p><b>IELTS Speaking is marked on 4 criteria:<\/b> Fluency & Coherence, Lexical Resource, Grammatical Range & Accuracy, Pronunciation — each 25%.<\/p>',
mn:'<p>Зөвшөөрөл = гол санаагаа хэлэхээс өмнө нөгөө талыг хүлээн зөвшөөрөх (B2+ сэтгэлгээг харуулдаг):<\/p><p><b>Although / Even though<\/b> + өгүүлбэр (хэдийгээр …ч): <b>Although<\/b> aid is useful, it can create dependence.<\/p><p><b>Despite / In spite of<\/b> + нэр үг эсвэл -ing (… -ыг үл харгалзан).<\/p><p><b>While it is true that<\/b>… (… нь үнэн боловч), <b>Admittedly<\/b> (хүлээн зөвшөөрөхөд), <b>Nevertheless<\/b> (гэсэн хэдий ч).<\/p><p><b>IELTS ярианы шалгалтыг 4 шалгуураар дүгнэдэг:<\/b> Чөлөөтэй, уялдаатай ярих; Үгийн сан; Дүрмийн олон янз байдал, нарийвчлал; Дуудлага — тус бүр 25%.<\/p>',
ex:[['Although globalisation has created wealth, it has also increased inequality.','Даяаршил баялаг бүтээсэн хэдий ч тэгш бус байдлыг мөн нэмэгдүүлсэн.'],['Despite being a small country, Mongolia plays an active role in peacekeeping.','Жижиг улс хэдий ч Монгол энхийг сахиулах ажилд идэвхтэй оролцдог.'],['While it is true that technology helps, education is still the key.','Технологи тус болдог нь үнэн боловч боловсрол түлхүүр хэвээр байна.'],['Admittedly, this solution is expensive. Nevertheless, it is the most effective.','Хүлээн зөвшөөрөхөд энэ шийдэл үнэтэй. Гэсэн хэдий ч хамгийн үр дүнтэй.'],['To sum up, international cooperation is essential to tackle global problems.','Дүгнэж хэлэхэд дэлхийн асуудлыг шийдвэрлэхэд олон улсын хамтын ажиллагаа зайлшгүй.']],
q:[{q:'___ it was raining, we went hiking.',o:['Despite','Although','However'],a:1},{q:'___ the cost, the project continued.',o:['Although','Despite','Nevertheless'],a:1},{q:'It\'s difficult. ___, it\'s worth trying.',o:['Although','Despite','Nevertheless'],a:2},{q:'Despite ___ tired, she finished the report.',o:['she was','being','be'],a:1},{q:'Which is NOT an IELTS speaking criterion?',o:['Fluency and coherence','Pronunciation','Handwriting'],a:2},{q:'Best way to show "lexical resource":',o:['Use the same words again and again','Use precise, less common words and collocations','Speak very fast'],a:1}]},
dl:[{t:'IELTS Part 3: Global problems',tm:'IELTS 3-р хэсэг: Дэлхийн асуудлууд',lines:[['A','What do you think is the most serious problem facing the world today?','Өнөөдөр дэлхий нийтэд тулгарч буй хамгийн ноцтой асуудал юу гэж бодож байна?'],['B','That\'s a difficult question, but I would say inequality, because it is connected to so many other issues.','Хэцүү асуулт, гэхдээ тэгш бус байдал гэж хэлнэ, учир нь энэ нь маш олон асуудалтай холбоотой.'],['B','For instance, people in poverty often lack access to education and healthcare. Consequently, the cycle continues from one generation to the next.','Жишээ нь ядуу хүмүүс боловсрол, эрүүл мэндийн тусламжид хүрч чаддаггүй. Улмаар энэ мөчлөг үеэс үед үргэлжилдэг.'],['A','Can rich countries solve this by giving more aid?','Баян орнууд илүү их тусламж өгснөөр үүнийг шийдэж чадах уу?'],['B','While it is true that aid can save lives in emergencies, I don\'t think it\'s a long-term solution.','Тусламж онцгой байдлын үед амь аварч чаддаг нь үнэн боловч урт хугацааны шийдэл гэж би бодохгүй байна.'],['B','Admittedly, it helps. Nevertheless, investing in education and fighting corruption would have a far greater impact.','Тус болдгийг хүлээн зөвшөөрнө. Гэсэн хэдий ч боловсролд хөрөнгө оруулж, авлигатай тэмцэх нь хамаагүй их нөлөөтэй.']]},
{t:'After the exam',tm:'Шалгалтын дараа',lines:[['A','How did your IELTS speaking test go?','IELTS-ийн ярианы шалгалт чинь ямар болов?'],['B','Better than I expected! Although I was nervous at first, I relaxed after Part 1.','Бодсоноос сайн! Эхэндээ сандарсан ч 1-р хэсгийн дараа тайвширсан.'],['A','What was your Part 2 topic?','2-р хэсгийн сэдэв юу байсан бэ?'],['B','Describe a teacher who influenced you. I couldn\'t believe my luck!','Танд нөлөөлсөн багшийг тайлбарла. Азандаа итгэж чадсангүй!'],['A','Ha! You must have had plenty to say.','Ха! Хэлэх юм их байсан байх.'],['B','I did. A year ago I couldn\'t introduce myself in English. Today I spoke for two full minutes.','Тийм. Жилийн өмнө би англиар өөрийгөө танилцуулж чаддаггүй байсан. Өнөөдөр бүтэн хоёр минут ярьсан.']]}],
story:{t:'IELTS listening: How the speaking test works',tm:'IELTS сонсгол: Ярианы шалгалт хэрхэн явагддаг вэ',listen:true,s:[['In this short guide, I\'ll explain how the IELTS speaking test works.','Энэ богино зааварт IELTS-ийн ярианы шалгалт хэрхэн явагддагийг тайлбарлая.'],['The test lasts between eleven and fourteen minutes, and it is recorded.','Шалгалт арван нэгээс арван дөрвөн минут үргэлжлэх бөгөөд бичлэг хийгддэг.'],['In Part 1, the examiner asks general questions about familiar topics such as your home, work or hobbies.','1-р хэсэгт шалгагч таны гэр, ажил, хобби зэрэг танил сэдвээр ерөнхий асуулт асууна.'],['This part takes four to five minutes.','Энэ хэсэг дөрвөөс таван минут үргэлжилнэ.'],['In Part 2, you receive a task card and have one minute to prepare notes.','2-р хэсэгт та даалгаврын карт авч, тэмдэглэл бэлдэхэд нэг минут өгнө.'],['Then you speak for up to two minutes without interruption.','Дараа нь та тасралтгүй хоёр минут хүртэл ярина.'],['Part 3 is a discussion of more abstract ideas connected to the Part 2 topic.','3-р хэсэг бол 2-р хэсгийн сэдэвтэй холбоотой илүү хийсвэр санааны хэлэлцүүлэг.'],['Your score is based on fluency, vocabulary, grammar and pronunciation.','Таны оноо чөлөөтэй ярих, үгийн сан, дүрэм, дуудлагад үндэслэнэ.'],['Remember, examiners are not testing your opinions — they are testing your English.','Шалгагч таны санал бодлыг биш, англи хэлийг тань шалгадгийг санаарай.'],['So stay calm, extend your answers, and don\'t be afraid to say "That\'s an interesting question — let me think."','Тиймээс тайван байж, хариултаа дэлгэрүүлж, «Сонирхолтой асуулт байна — бодъё» гэж хэлэхээс бүү ай.']],

q:[{q:'How long is the speaking test?',o:['11–14 minutes','30 minutes','5 minutes'],a:0},{q:'How long do you have to prepare in Part 2?',o:['No time','One minute','Five minutes'],a:1},{q:'What are examiners testing?',o:['Your opinions','Your English','Your knowledge of science'],a:1}]},
speak:[['Part 3: Is globalisation good or bad for small countries like Mongolia?','3-р хэсэг: Даяаршил Монгол шиг жижиг орнуудад сайн уу, муу юу?','Although globalisation has brought investment and new technology, it has also made our economy dependent on mining exports. Nevertheless, I believe the benefits outweigh the drawbacks, as long as we protect our culture and develop other industries.'],['Part 3: What can individuals do to help solve global problems?','3-р хэсэг: Дэлхийн асуудлыг шийдэхэд хувь хүн юу хийж чадах вэ?','While it is true that governments have the most power, individuals can make a difference. For example, they can volunteer, donate to charities and make responsible choices as consumers. Furthermore, teachers can raise awareness among young people.'],['Final test (2 min): Describe how your English has changed this year, and what you will do next.','Эцсийн шалгалт (2 мин): Энэ жил таны англи хэл хэрхэн өөрчлөгдсөн, цаашид юу хийхээ ярь.','A year ago, I could only say a few sentences in English. Since then, I have been practising for about an hour and a half every day… By the end of next year, I will have…']]}
]);

/* ---------- word bank (3000+) ---------- */
const WBD=(window.WB||[]);
const LVO={A1:0,A2:1,B1:2,B2:3};
const WBO=[...WBD].sort((a,b)=>(LVO[a.lv]??9)-(LVO[b.lv]??9));
const deckOf=id=>WBD.find(d=>d.id===id);
const wbW=(d,i)=>{const x=d.w[i];return x?[x[0],x[1],x[3],x[4],x[2]]:null};
const UNITW=new Set(U.flatMap(u=>u.words.map(w=>w[0].toLowerCase())));
const SEQ=(()=>{const seen=new Set(UNITW),out=[];WBO.forEach(d=>d.w.forEach((x,i)=>{const k=x[0].toLowerCase();if(seen.has(k))return;seen.add(k);out.push('w~'+d.id+'~'+i)}));return out})();
const TOTALW=UNITW.size+SEQ.length;
function cardW(k){if(k.startsWith('w~')){const p=k.split('~'),d=deckOf(p[1]);const w=d&&wbW(d,+p[2]);return w?{w,lab:(d.ic||'📚')+' '+d.t}:null}
 const [a,b]=k.split('-').map(Number);const w=U[a-1]&&U[a-1].words[b];return w?{w,lab:'Unit '+a}:null}
function wbPool(g){if(g.startsWith('d:')){const d=deckOf(g.slice(2));return d?d.w.map((x,i)=>wbW(d,i)):U[0].words}
 const L=WBD.filter(d=>g==='all'||d.lv===g).flatMap(d=>d.w.map((x,i)=>wbW(d,i)));return L.length?L:U[0].words}
const deckProg=d=>{let n=0;d.w.forEach((x,i)=>{if(S.cards['w~'+d.id+'~'+i])n++});return n/d.w.length};
function addDeckCards(keys){let n=0;const t=dayNum(today());keys.forEach(k=>{if(!S.cards[k]){S.cards[k]={lv:0,due:t,n:0};n++}});markDay();save();return n}

function wbBanner(){const n=Object.keys(S.cards).filter(k=>k.startsWith('w~')).length;

function tileHTML(w,n,lab){return `<div class="wt"><button class="wpic" data-say="${esc(w[0])}" aria-label="${esc(w[0])}">${pic(w)}</button><div class="row" style="justify-content:space-between;flex-wrap:nowrap"><b>${esc(w[0])}</b>${canListen()?`<button class="spk mic" style="width:34px;height:34px" data-check="${esc(w[0])}" data-out="wb${n}" aria-label="Say it">${IC.mic}</button>`:''}</div><span class="m">${esc(w[1])}</span><div class="exs">${lab?`<span class="rl">${esc(lab)}</span>`:''}<div>${esc(w[2])} ${spkBtn(w[2],'sm')}</div>${S.mn?`<span class="mn">${esc(w[3])}</span>`:''}</div><div class="res" id="wb${n}" hidden></div></div>`}
function vWords(){const lv=route.a&&LVO[route.a]!=null?route.a:'all';const D=WBD.filter(d=>lv==='all'||d.lv===lv);

 <div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(155px,1fr))">${D.map(d=>`<a class="unit deck" href="#deck/${d.id}" style="--uc:${d.lv==='A1'?'#12a46b':d.lv==='A2'?'#22c3e6':d.lv==='B1'?'#2f6bff':'#ff4f9a'}"><div class="row" style="justify-content:space-between;flex-wrap:nowrap"><span style="font-size:34px">${d.ic}</span><span class="lvb">${d.lv}</span></div><h3 style="font-size:16px;margin-top:6px">${T(esc(d.t),esc(d.tm))}</h3><div style="font-size:20px;letter-spacing:2px">${d.w.slice(0,5).map(x=>x[2]).join('')}</div><div class="row small mut" style="justify-content:space-between"><span>${d.w.length} ${S.mn?'үг':'words'}</span></div><div class="bar" style="margin-top:6px"><i style="width:${Math.round(deckProg(d)*100)}%"></i></div></a>`).join('')}</div>`}
vWords.bnd=()=>{const q=$('#wbq'),r=$('#wbr');if(!q)return;q.oninput=()=>{const s=q.value.trim().toLowerCase();if(s.length<2){r.innerHTML='';return}
