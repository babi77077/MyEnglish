goal:{en:'Answer everyday Part 1 questions fully and naturally, and talk about past habits with "used to".',mn:'1-р хэсгийн өдөр тутмын асуултад бүрэн, чөлөөтэй хариулж, «used to»-гоор өнгөрсөн зуршлаа ярих.'},
words:[['hometown','төрсөн нутаг','My hometown is famous for its copper mine.','Миний төрсөн нутаг зэсийн уурхайгаараа алдартай.','🏘️'],['grow up','өсөх','I grew up in a small town.','Би жижиг хотод өссөн.','🌱'],['used to','… дог байсан','I used to walk to school.','Би сургууль руугаа алхдаг байсан.','⏪'],['nowadays','өнөө үед','Nowadays, I mostly work online.','Өнөө үед би голдуу онлайнаар ажилладаг.','📱'],['these days','энэ үед','These days, I\'m busier than ever.','Энэ үед би урьд урьдынхаас завгүй байна.','🗓️'],['to be honest','үнэнийг хэлэхэд','To be honest, I don\'t like cooking.','Үнэнийг хэлэхэд би хоол хийх дургүй.','🤫'],['I\'d say','… гэж хэлэх байна','I\'d say I\'m quite an active person.','Би нэлээд идэвхтэй хүн гэж хэлэх байна.','💬'],['it depends','… -аас шалтгаална','It depends on the weather.','Цаг агаараас шалтгаална.','⚖️'],['quite','нэлээд','My job is quite demanding.','Миний ажил нэлээд их шаардлагатай.','📶'],['rather','харьцангуй, бага зэрэг','It\'s rather cold in my office.','Манай оффис бага зэрэг хүйтэн.','🌡️'],['particularly','ялангуяа','I particularly enjoy teaching coding.','Би ялангуяа код заах дуртай.','🎯'],['spare time','сул цаг','I don\'t have much spare time.','Надад сул цаг тийм их байдаггүй.','🕰️'],['unwind','тайвшрах','I unwind by listening to music.','Би хөгжим сонсож тайвширдаг.','🛋️'],['commute','ажилдаа явах зам','My commute takes about thirty minutes.','Ажилдаа очиход гучин минут орчим болдог.','🚌'],['neighbourhood','хороолол','My neighbourhood is quiet and green.','Манай хороолол нам гүм, ногоон.','🏡'],['facilities','үйлчилгээний байгууламж','There are good sports facilities nearby.','Ойролцоо сайн спортын байгууламж бий.','🏟️'],['convenient','тохиромжтой','The location is very convenient.','Байршил маш тохиромжтой.','👌'],['crowded','хүн ихтэй','The centre gets crowded at weekends.','Төв амралтын өдөр хүн ихтэй болдог.','👥'],['traditional','уламжлалт','We celebrate Tsagaan Sar in a traditional way.','Бид Цагаан сарыг уламжлалт байдлаар тэмдэглэдэг.','🏮'],['childhood','бага нас','In my childhood, we didn\'t have the internet.','Бага насанд маань интернэт байгаагүй.','🧸'],['memorable','мартагдашгүй','My graduation was very memorable.','Миний төгсөлт мартагдашгүй байсан.','📸'],['prefer','илүүд үзэх','I prefer mornings to evenings.','Би оройноос өглөөг илүүд үздэг.','👍'],['routine','хэвшил','My daily routine is quite fixed.','Миний өдөр тутмын хэвшил нэлээд тогтмол.','🔁'],['in my free time','чөлөөт цагаараа','In my free time, I go hiking.','Чөлөөт цагаараа явган аялал хийдэг.','🥾'],['major','мэргэжил (их сургуулийн)','My major was computer science.','Миний мэргэжил компьютерын ухаан байсан.','🎓'],['rewarding','сэтгэл ханамжтай','Teaching is a rewarding job.','Багшлах бол сэтгэл ханамжтай ажил.','🏅'],['demanding','их шаардлагатай, хүнд','It\'s rewarding but demanding.','Сэтгэл ханамжтай ч хүнд ажил.','🏋️'],['look forward to','тэсэн ядан хүлээх','I\'m looking forward to the summer holiday.','Зуны амралтыг тэсэн ядан хүлээж байна.','🤩'],['as far as I know','миний мэдэхээр','As far as I know, it opened in 2010.','Миний мэдэхээр 2010 онд нээгдсэн.','🧠'],['for example','жишээ нь','For example, I often read on the bus.','Жишээ нь, би ихэвчлэн автобусанд уншдаг.','🔎']],
gram:{t:'used to / would for past habits; extending your answers',tm:'used to / would — өнгөрсөн зуршил; хариултаа дэлгэрүүлэх',
en:'<p><b>used to + verb<\/b> = a past habit or state that is not true now: I <b>used to<\/b> live in Darkhan. I <b>didn\'t use to<\/b> like coffee.<\/p><p><b>would + verb<\/b> for repeated past actions (not states): Every summer we <b>would<\/b> visit my grandparents.<\/p><p>Do not confuse with <b>be used to + -ing<\/b> = be familiar with: I\'m <b>used to<\/b> getting up early.<\/p><p><b>IELTS Part 1 tip:<\/b> never answer with just "yes" or "no". Use the <b>A-R-E<\/b> pattern: <b>A<\/b>nswer → <b>R<\/b>eason → <b>E<\/b>xample (2–4 sentences, about 20 seconds).<\/p>',
mn:'<p><b>used to + үйл үг<\/b> = одоо үнэн биш болсон өнгөрсөн зуршил, байдал: I <b>used to<\/b> live in Darkhan. (Би Дарханд амьдардаг байсан.)<\/p><p><b>would + үйл үг<\/b> = өнгөрсөнд давтагддаг байсан үйлдэл: Every summer we <b>would<\/b> visit my grandparents.<\/p><p><b>be used to + -ing<\/b> = дассан: I\'m <b>used to<\/b> getting up early. (Би эрт босоход дассан.)<\/p><p><b>IELTS 1-р хэсгийн зөвлөгөө:<\/b> зөвхөн «тийм/үгүй» гэж бүү хариул. <b>A-R-E<\/b>: Хариулт → Шалтгаан → Жишээ (2–4 өгүүлбэр, 20 секунд орчим).<\/p>',
ex:[['I used to play basketball, but now I prefer yoga.','Би сагсан бөмбөг тоглодог байсан, харин одоо иогийг илүүд үздэг.'],['When I was a child, we would spend every summer in the countryside.','Хүүхэд байхад бид зун бүр хөдөө өнгөрүүлдэг байсан.'],['I didn\'t use to like vegetables.','Би ногоонд дургүй байсан.'],['I\'m used to working with teenagers.','Би өсвөр насныхантай ажиллахад дассан.'],['Yes, I do. I find it relaxing because… For example…','Тийм ээ. Тайвшруулдаг гэж боддог, учир нь… Жишээ нь…']],
q:[{q:'I ___ live in the countryside, but now I live in the city.',o:['used to','use to','am used to'],a:0},{q:'She ___ like coffee, but now she loves it.',o:['didn\'t use to','didn\'t used to','wasn\'t used'],a:0},{q:'I\'m used to ___ early.',o:['get up','getting up','got up'],a:1},{q:'Every winter, my grandmother ___ make buuz for us.',o:['would','will','is'],a:0},{q:'Best Part 1 answer: "Do you like your job?"',o:['Yes.','Yes, I do. It\'s rewarding because I help young people, for example…','Job is good.'],a:1},{q:'"___ honest, I\'m not a morning person."',o:['To be','For be','Be'],a:0}]},
dl:[{t:'IELTS Part 1: Work and home',tm:'IELTS 1-р хэсэг: Ажил, гэр',lines:[['A','Let\'s talk about your work. What do you do?','Ажлынхаа тухай ярья. Та юу хийдэг вэ?'],['B','I\'m a secondary school IT teacher. I\'ve been teaching for over twelve years, and I particularly enjoy teaching coding.','Би ерөнхий боловсролын сургуулийн мэдээллийн технологийн багш. Арван хоёр гаруй жил заасан, ялангуяа код заах дуртай.'],['A','Is it a demanding job?','Энэ ажил хүнд үү?'],['B','I\'d say it\'s demanding but rewarding. For example, preparing lessons takes a lot of time, but seeing students succeed is wonderful.','Хүнд ч сэтгэл ханамжтай гэж хэлэх байна. Жишээ нь хичээл бэлтгэхэд их цаг ордог ч сурагчид амжилтад хүрэхийг харах гайхалтай.'],['A','Do you live in a house or an apartment?','Та байшинд үү, орон сууцанд амьдардаг уу?'],['B','An apartment, in a quiet neighbourhood. It\'s very convenient because it\'s close to my school.','Нам гүм хороололд орон сууцанд. Сургуульд ойр тул маш тохиромжтой.'],['A','Has your neighbourhood changed in recent years?','Сүүлийн жилүүдэд танай хороолол өөрчлөгдсөн үү?'],['B','Yes, quite a lot. There used to be a lot of empty land, but nowadays there are new shops and a park.','Тийм, нэлээд. Өмнө нь хоосон газар их байсан, харин одоо шинэ дэлгүүр, цэцэрлэгт хүрээлэн бий.']]},
{t:'IELTS Part 1: Free time',tm:'IELTS 1-р хэсэг: Чөлөөт цаг',lines:[['A','What do you like doing in your spare time?','Сул цагаараа юу хийх дуртай вэ?'],['B','To be honest, I don\'t have much spare time, but when I do, I like hiking in the mountains near the city.','Үнэнийг хэлэхэд сул цаг их байдаггүй, гэхдээ гарвал хотын ойролцоох ууланд явган аялах дуртай.'],['A','Did you have the same hobbies as a child?','Хүүхэд байхдаа ч мөн адил хоббитой байсан уу?'],['B','Not really. I used to draw a lot, and I would spend hours making cartoons.','Тийм ч биш. Би их зурдаг байсан, хүүхэлдэйн кино хийж олон цаг өнгөрүүлдэг байлаа.'],['A','Do you prefer spending free time alone or with others?','Чөлөөт цагаа ганцаараа эсвэл бусадтай өнгөрүүлэхийг илүүд үздэг үү?'],['B','It depends. On weekdays I need some quiet time to unwind, but at weekends I prefer being with my family.','Шалтгаална. Ажлын өдөр тайвшрах нам гүм цаг хэрэгтэй, харин амралтын өдөр гэр бүлтэйгээ байхыг илүүд үздэг.']]}],
story:{t:'IELTS listening: Welcome to the English club',tm:'IELTS сонсгол: Англи хэлний клубт тавтай морил',listen:true,s:[['Good evening, everyone, and welcome to the City Library English Club.','Оройн мэнд, бүгдэд нь, Хотын номын сангийн англи хэлний клубт тавтай морил.'],['My name is Sarah, and I\'ll be your coordinator this term.','Намайг Сара гэдэг, энэ улиралд би та бүхний зохицуулагч байна.'],['Our meetings are held every Tuesday from half past six to eight o\'clock.','Бидний уулзалт мягмар гараг бүр зургаан хагасаас найман цаг хүртэл болно.'],['We meet in Room 204, which is on the second floor, next to the computer lab.','Бид хоёрдугаар давхарт, компьютерын лабораторийн хажууд байрлах 204 тоот өрөөнд уулзана.'],['Membership costs fifteen thousand tugriks per month, and students get a twenty percent discount.','Гишүүнчлэл сард арван таван мянган төгрөг, оюутнууд хорин хувийн хөнгөлөлттэй.'],['Each week, we focus on one topic, for example travel, work or technology.','Долоо хоног бүр бид нэг сэдэвт анхаарна, жишээ нь аялал, ажил, технологи.'],['In the first half, we practise speaking in small groups.','Эхний хагаст бид жижиг бүлгээр ярианы дасгал хийнэ.'],['After a short break, we do a listening activity or watch a short video.','Богино завсарлагын дараа сонсголын дасгал хийх эсвэл богино видео үзнэ.'],['Please bring a notebook, and remember that phones should be on silent.','Дэвтэр авчраарай, утсаа чимээгүй горимд тавихаа мартуузай.'],['If you have any questions, you can email me at sarah dot club at library dot mn.','Асуулт байвал sarah.club@library.mn хаягаар надад имэйл бичиж болно.']],
gl:{coordinator:'зохицуулагч',term:'улирал',held:'болдог',membership:'гишүүнчлэл',discount:'хөнгөлөлт','focus on':'анхаарах','first half':'эхний хагас',break:'завсарлага','on silent':'чимээгүй горимд'},
q:[{q:'When are the meetings?',o:['Tuesdays, 6:30–8:00','Thursdays, 6:00–8:30','Tuesdays, 8:00–9:30'],a:0},{q:'Which room do they meet in?',o:['Room 402','Room 204','Room 214'],a:1},{q:'How much discount do students get?',o:['15%','20%','50%'],a:1}]},
speak:[['IELTS Part 1: Where is your hometown? What do you like about it?','IELTS 1-р хэсэг: Таны төрсөн нутаг хаана вэ? Юу нь танд таалагддаг вэ?','I\'m from Erdenet, which is a city in the north of Mongolia. What I like most is that it\'s greener and less polluted than the capital. For example, there are forests just outside the city.'],['IELTS Part 1: How has your daily routine changed since you were a student?','IELTS 1-р хэсэг: Оюутан байхаас хойш өдөр тутмын хэвшил тань хэрхэн өөрчлөгдсөн бэ?','It has changed a lot. I used to stay up late and sleep until noon, but nowadays I get up at six because classes start early.'],['IELTS Part 1: Do you like cooking? Why or why not?','IELTS 1-р хэсэг: Та хоол хийх дуртай юу? Яагаад?','To be honest, it depends on my mood. At weekends I enjoy cooking traditional food like buuz with my family, but on weekdays I\'m usually too tired.']]},

{id:26,st:3,t:'IELTS Part 2: describing people and events',tm:'IELTS 2-р хэсэг: хүн, үйл явдлыг тайлбарлах',c:'#7209b7',sc:['⏱️','Long turn (1–2 min)','Урт яриа (1–2 мин)'],
goal:{en:'Speak for two minutes about a person or event, using narrative tenses and the past perfect.',mn:'Хүн эсвэл үйл явдлын тухай хоёр минут ярьж, өгүүлэмжийн цаг, past perfect-ийг хэрэглэх.'},
words:[['inspire','урам зориг өгөх','My teacher inspired me to study IT.','Багш маань намайг мэдээллийн технологи сурахад урам зориг өгсөн.','✨'],['influence','нөлөөлөх','My father influenced my career choice.','Аав маань миний мэргэжил сонголтод нөлөөлсөн.','🧲'],['look up to','хүндэтгэн дагах','I\'ve always looked up to my older sister.','Би эгчийгээ үргэлж үлгэр болгодог.','👀'],['determined','шийдэмгий','She was determined to finish her degree.','Тэр дипломоо дуусгахаар шийдэмгий байсан.','💪'],['ambitious','хүсэл тэмүүлэлтэй','He\'s ambitious and hard-working.','Тэр хүсэл тэмүүлэлтэй, хөдөлмөрч.','🚀'],['supportive','дэмжлэг үзүүлдэг','My family has always been supportive.','Гэр бүл маань үргэлж дэмждэг.','🤗'],['humble','даруу','Despite his success, he is very humble.','Амжилтаа үл харгалзан тэр маш даруу.','🙇'],['occasion','тохиолдол, баяр ёслол','A wedding is a special occasion.','Хурим бол онцгой тохиолдол.','🎊'],['ceremony','ёслол','The award ceremony was held in the theatre.','Шагнал гардуулах ёслол театрт болсон.','🎖️'],['atmosphere','уур амьсгал','The atmosphere was amazing.','Уур амьсгал гайхалтай байлаа.','🌈'],['vivid','тод (дурсамж)','I have a vivid memory of that day.','Тэр өдрийн талаар тод дурсамж бий.','🎨'],['take place','болох','The event took place in 2019.','Арга хэмжээ 2019 онд болсон.','📍'],['by the time','… гэхэд','By the time I arrived, the film had started.','Намайг ирэхэд кино эхэлчихсэн байсан.','⏲️'],['had already','аль хэдийн … байсан','They had already left when I called.','Намайг залгахад тэд аль хэдийн явчихсан байсан.','✅'],['for the first time','анх удаа','I saw the sea for the first time in 2015.','Би 2015 онд анх удаа далай харсан.','🥇'],['overwhelmed','сэтгэл догдолж, бухимдсан','I felt overwhelmed with joy.','Баярласандаа сэтгэл хөдөлсөн.','🥹'],['grateful','талархсан','I\'m grateful for her help.','Түүний тусламжид талархаж байна.','🙏'],['admire','бахдах','I admire her courage.','Би түүний зоригийг бахддаг.','👏'],['achievement','амжилт','Winning the award was a great achievement.','Шагнал хүртсэн нь том амжилт байлаа.','🏆'],['challenge','сорилт','It was the biggest challenge of my life.','Энэ миний амьдралын хамгийн том сорилт байсан.','🧗'],['overcome','даван туулах','She overcame many difficulties.','Тэр олон бэрхшээлийг даван туулсан.','⛰️'],['turning point','эргэлтийн цэг','That trip was a turning point in my life.','Тэр аялал миний амьдралын эргэлтийн цэг болсон.','🔀'],['mentor','зөвлөгч','She was my mentor in my first year of teaching.','Тэр багшилсан эхний жилд минь зөвлөгч байсан.','🧑‍🏫'],['generation','үе','My grandparents\' generation worked very hard.','Өвөө эмээгийн маань үеийнхэн их шаргуу ажилласан.','👪'],['background','гарал, суурь','He comes from a herding background.','Тэр малчин гэр бүлээс гаралтай.','🏞️'],['impression','сэтгэгдэл','She made a strong impression on me.','Тэр надад хүчтэй сэтгэгдэл төрүүлсэн.','💭'],['describe','тайлбарлах','Describe a person who helped you.','Танд тусалсан хүнийг тайлбарла.','🗣️'],['explain why','яагаад гэдгийг тайлбарлах','Explain why this person is important to you.','Энэ хүн яагаад танд чухал болохыг тайлбарла.','❓'],['as I mentioned','миний дурдсанчлан','As I mentioned, she was very patient.','Миний дурдсанчлан тэр их тэвчээртэй байсан.','🔙'],['all in all','товчхондоо','All in all, it was an unforgettable experience.','Товчхондоо, мартагдашгүй туршлага байлаа.','🧾']],
gram:{t:'Narrative tenses and the past perfect',tm:'Өгүүлэмжийн цаг ба past perfect',
en:'<p>Good stories mix tenses: <b>past simple<\/b> for main events, <b>past continuous<\/b> for background, <b>past perfect<\/b> (had + past participle) for things that happened <b>before<\/b> another past event.<\/p><p>When I <b>arrived<\/b>, the ceremony <b>had already started<\/b>. (It started first.)<\/p><p>I <b>had never seen<\/b> the sea before I <b>went<\/b> to Korea.<\/p><p><b>IELTS Part 2 tip:<\/b> you get one minute to prepare. Write 4–5 key words, follow the cue card points in order, and finish with why it matters to you. Speak for the full 2 minutes.<\/p><p>Useful phrases: I\'d like to talk about… / What I remember most is… / The reason why… / All in all…<\/p>',
mn:'<p>Сайн өгүүлэмж хэд хэдэн цагийг хольдог: гол үйл явдал — <b>past simple<\/b>, ар тал — <b>past continuous<\/b>, өөр нэг өнгөрсөн үйлдлээс <b>өмнө<\/b> болсон зүйл — <b>past perfect<\/b> (had + 3-р хэлбэр).<\/p><p>When I <b>arrived<\/b>, the ceremony <b>had already started<\/b>. (Намайг ирэхэд ёслол аль хэдийн эхэлчихсэн байсан.)<\/p><p><b>IELTS 2-р хэсгийн зөвлөгөө:<\/b> бэлтгэхэд нэг минут өгнө. 4–5 түлхүүр үг бичиж, картын асуултуудыг дарааллаар нь хариулаад, яагаад чухал болохоор төгсгө. Бүтэн 2 минут ярь.<\/p>',
ex:[['By the time we got to the station, the train had left.','Биднийг буудал дээр очиход галт тэрэг явчихсан байсан.'],['I had never spoken English with a foreigner until I met Anna.','Аннатай танилцах хүртлээ би гадаад хүнтэй англиар ярьж байгаагүй.'],['She was crying because she had lost her passport.','Тэр паспортоо гээсэн учраас уйлж байлаа.'],['I\'d like to talk about my first teacher, who inspired me a lot.','Надад их урам зориг өгсөн анхны багшийнхаа тухай ярья.'],['All in all, she is the person I admire most.','Товчхондоо, тэр бол миний хамгийн их бахддаг хүн.']],
q:[{q:'When I arrived, the meeting ___.',o:['already started','had already started','has already started'],a:1},{q:'I ___ never flown before that trip.',o:['have','had','was'],a:1},{q:'She was tired because she ___ all night.',o:['had worked','has worked','works'],a:0},{q:'In Part 2 you have ___ to prepare.',o:['one minute','five minutes','no time'],a:0},{q:'Good way to finish Part 2:',o:['That\'s all.','All in all, that\'s why this day is so special to me.','I don\'t know.'],a:1},{q:'I have always looked ___ to my grandmother.',o:['at','up','for'],a:1}]},
dl:[{t:'Part 2 cue card: Describe a person who has influenced you',tm:'2-р хэсгийн карт: Танд нөлөөлсөн хүнийг тайлбарла',lines:[['A','Here is your topic. Describe a person who has influenced you. You have one minute to prepare.','Энэ таны сэдэв. Танд нөлөөлсөн хүнийг тайлбарла. Бэлтгэхэд нэг минут байна.'],['B','I\'d like to talk about my first IT teacher, Mr. Dorj, who taught me when I was in grade nine.','Есдүгээр ангид байхад минь заасан анхны мэдээллийн технологийн багш Дорж багшийнхаа тухай ярья.'],['B','Before I met him, I had never used a computer, and I was quite shy.','Түүнтэй уулзахаасаа өмнө би хэзээ ч компьютер хэрэглэж байгаагүй бөгөөд нэлээд ичимхий байсан.'],['B','What I remember most is how patient he was. He would stay after school to help us.','Хамгийн их санаж байгаа зүйл бол тэр ямар тэвчээртэй байсан нь. Хичээлийн дараа үлдэж бидэнд тусалдаг байсан.'],['B','He encouraged me to enter a programming competition, and to my surprise, I won second prize.','Тэр намайг програмчлалын тэмцээнд оролцоход урамшуулсан бөгөөд гэнэтийн байдлаар би хоёрдугаар байр эзэлсэн.'],['B','That was a real turning point. It was the reason why I decided to become a teacher myself.','Энэ үнэхээр эргэлтийн цэг болсон. Тэр л шалтгаанаар би өөрөө багш болохоор шийдсэн.'],['A','Thank you. Do you still keep in touch with him?','Баярлалаа. Түүнтэй одоо ч холбоотой байдаг уу?'],['B','Yes, we meet every Teachers\' Day.','Тийм ээ, Багш нарын баяраар уулздаг.']]},
{t:'Part 2 cue card: Describe a special event',tm:'2-р хэсгийн карт: Онцгой үйл явдлыг тайлбарла',lines:[['A','Describe a special event you attended. Say what it was, when it took place, who was there and why it was special.','Оролцож байсан онцгой арга хэмжээгээ тайлбарла. Юу байсан, хэзээ болсон, хэн байсан, яагаад онцгой байсныг хэл.'],['B','I\'m going to talk about my younger brother\'s wedding, which took place in the countryside two years ago.','Хоёр жилийн өмнө хөдөө болсон дүүгийнхээ хуримын тухай ярья.'],['B','By the time we arrived, our relatives had already put up three gers and prepared a huge feast.','Биднийг очиход хамаатнууд маань гурван гэр барьж, асар их найр бэлдчихсэн байсан.'],['B','The atmosphere was wonderful. People were singing long songs and the children were racing horses.','Уур амьсгал гайхалтай байлаа. Хүмүүс уртын дуу дуулж, хүүхдүүд морь уралдуулж байв.'],['B','It was special because the whole family had come together for the first time in ten years.','Бүх гэр бүл арван жилд анх удаа нэг дор цугларсан учраас онцгой байсан.'],['B','All in all, it was an unforgettable day, and I still have vivid memories of it.','Товчхондоо, мартагдашгүй өдөр байсан, одоо ч тод санадаг.']]}],
story:{t:'IELTS listening: A talk about a famous explorer',tm:'IELTS сонсгол: Алдартай судлаачийн тухай илтгэл',listen:true,s:[['Today I\'d like to tell you about Roy Chapman Andrews, an American explorer who became famous in Mongolia.','Өнөөдөр би Монголд алдаршсан Америкийн судлаач Рой Чапман Эндрюсийн тухай ярих гэж байна.'],['He was born in 1884 in Wisconsin, and as a boy he had always loved nature and animals.','Тэрээр 1884 онд Висконсинд төрсөн бөгөөд хүүхэд байхаасаа байгаль, амьтанд үргэлж дуртай байжээ.'],['After he had finished university, he got a job at a natural history museum in New York.','Их сургуулиа төгссөний дараа тэр Нью-Йоркийн байгалийн түүхийн музейд ажилд оржээ.'],['At first, his job was cleaning the floors, but he worked hard and was soon promoted.','Эхэндээ түүний ажил шал угаах байсан ч шаргуу ажилласнаар удалгүй дэвшсэн.'],['In the 1920s, he led several expeditions to the Gobi Desert.','1920-иод онд тэр Говь руу хэд хэдэн экспедицийг удирдсан.'],['His team used cars and camels to cross the desert.','Түүний баг цөлийг гатлахдаа машин, тэмээ ашигласан.'],['In 1923, they discovered the first dinosaur eggs that scientists had ever seen.','1923 онд тэд эрдэмтдийн урьд өмнө нь хэзээ ч харж байгаагүй анхны үлэг гүрвэлийн өндгийг илрүүлсэн.'],['The place where they found them is now called the Flaming Cliffs, or Bayanzag.','Тэдний олсон газрыг одоо Галт хад буюу Баянзаг гэдэг.'],['Some people believe that the character Indiana Jones was based on his adventures.','Зарим хүн Индиана Жонсын дүрийг түүний адал явдал дээр үндэслэсэн гэж үздэг.'],['His work helped the world learn about Mongolia\'s rich history.','Түүний ажил дэлхий нийтэд Монголын баялаг түүхийг таниулахад тусалсан.']],
gl:{explorer:'судлаач','natural history':'байгалийн түүх',promoted:'дэвшсэн',expeditions:'экспедиц',cross:'гатлах','dinosaur eggs':'үлэг гүрвэлийн өндөг',scientists:'эрдэмтэд','Flaming Cliffs':'Галт хад','based on':'үндэслэсэн',adventures:'адал явдал'},
q:[{q:'What was his first job at the museum?',o:['Guide','Cleaning the floors','Scientist'],a:1},{q:'What did they discover in 1923?',o:['Dinosaur eggs','Gold','An old city'],a:0},{q:'What is the place called now?',o:['Flaming Cliffs (Bayanzag)','Khongoryn Els','Terelj'],a:0}]},
speak:[['Part 2 (2 min): Describe a teacher who inspired you. You should say: who the teacher was, what subject they taught, what was special about them, and explain how they influenced you.','2-р хэсэг (2 мин): Танд урам зориг өгсөн багшийг тайлбарла: хэн байсан, ямар хичээл заадаг байсан, юугаараа онцгой байсан, танд хэрхэн нөлөөлсөн.','I\'d like to talk about my maths teacher in high school… Before I met her, I had always thought I was bad at maths… What made her special was… All in all, she taught me that hard work matters more than talent.'],['Part 2 (2 min): Describe a day when you felt very proud. Say when it was, what happened, who was with you, and why you felt proud.','2-р хэсэг (2 мин): Их бахархаж байсан өдрөө тайлбарла: хэзээ, юу болсон, хэн хамт байсан, яагаад бахархсан.','I\'m going to describe the day my students won a national robotics competition. We had practised for months… By the time the results were announced, we had almost lost hope…'],['Part 2 (2 min): Describe a trip that you remember well.','2-р хэсэг (2 мин): Сайн санаж буй нэгэн аяллаа тайлбарла.','I\'d like to talk about a trip to Khuvsgul Lake that I took with my family three summers ago…']]},

{id:27,st:3,t:'Education and learning',tm:'Боловсрол ба суралцахуй',c:'#4895ef',sc:['🎓','Education debates','Боловсролын хэлэлцүүлэг'],
goal:{en:'Discuss education (IELTS Part 3): give balanced opinions, compare and speculate.',mn:'Боловсролын сэдвээр (IELTS 3-р хэсэг) тэнцвэртэй санал бодол илэрхийлж, харьцуулж, таамаглах.'},
words:[['curriculum','сургалтын хөтөлбөр','The curriculum was updated last year.','Сургалтын хөтөлбөрийг өнгөрсөн жил шинэчилсэн.','📚'],['assessment','үнэлгээ','Continuous assessment is fairer than one final exam.','Тасралтгүй үнэлгээ нэг төгсөлтийн шалгалтаас шударга.','📝'],['rote learning','цээжлэх аргаар сурах','Rote learning doesn\'t develop creativity.','Цээжлэх арга бүтээлч сэтгэлгээг хөгжүүлдэггүй.','🔁'],['critical thinking','шүүмжлэлт сэтгэлгээ','Schools should teach critical thinking.','Сургуулиуд шүүмжлэлт сэтгэлгээ заах ёстой.','🧠'],['academic','академик, эрдэм шинжилгээний','She has excellent academic results.','Тэр сурлагын маш сайн үзүүлэлттэй.','🎓'],['vocational','мэргэжлийн (сургалт)','Vocational training leads to good jobs.','Мэргэжлийн сургалт сайн ажилд хүргэдэг.','🔧'],['tuition fees','сургалтын төлбөр','Tuition fees are rising every year.','Сургалтын төлбөр жил бүр өсөж байна.','💳'],['scholarship','тэтгэлэг','He studied abroad on a scholarship.','Тэр тэтгэлгээр гадаадад суралцсан.','🏅'],['distance learning','зайн сургалт','Distance learning became common during the pandemic.','Цар тахлын үеэр зайн сургалт түгээмэл болсон.','💻'],['face-to-face','биечлэн','Some students learn better face-to-face.','Зарим сурагч биечлэн илүү сайн сурдаг.','🧑‍🏫'],['motivation','сэдэл','Motivation is the key to learning a language.','Сэдэл бол хэл сурах түлхүүр.','🔥'],['discipline','сахилга бат','Learning online requires self-discipline.','Онлайнаар суралцахад өөрийн сахилга бат шаардлагатай.','🧭'],['peer','үе тэнгийн','Students often learn from their peers.','Сурагчид ихэвчлэн үе тэнгийнхнээсээ суралцдаг.','👫'],['compulsory','заавал','Is English compulsory in Mongolian schools?','Монголын сургуульд англи хэл заавал үздэг үү?','📌'],['literacy','бичиг үсэг, мэдлэг','Digital literacy is essential today.','Өнөөдөр цахим бичиг үсэг зайлшгүй.','🔤'],['lifelong learning','насан туршийн боловсрол','Lifelong learning keeps your mind active.','Насан туршийн суралцахуй оюун ухааныг идэвхтэй байлгадаг.','♾️'],['acquire','эзэмших','Children acquire languages quickly.','Хүүхдүүд хэлийг хурдан эзэмшдэг.','🧲'],['gifted','авьяаслаг','Gifted children need extra challenges.','Авьяаслаг хүүхдүүдэд нэмэлт сорилт хэрэгтэй.','🌟'],['struggle','хүндрэлтэй байх','Some students struggle with maths.','Зарим сурагч математикт хүндрэлтэй байдаг.','😓'],['pressure','дарамт','Exam pressure causes stress.','Шалгалтын дарамт стресс үүсгэдэг.','🗜️'],['equal opportunities','тэгш боломж','All children deserve equal opportunities.','Бүх хүүхэд тэгш боломж эдлэх ёстой.','⚖️'],['rural','хөдөөгийн','Rural schools often lack resources.','Хөдөөгийн сургуульд нөөц хангалтгүй байдаг.','🌾'],['urban','хотын','Urban schools are often overcrowded.','Хотын сургуулиуд ихэвчлэн хэт дүүрэн байдаг.','🏙️'],['on the one hand','нэг талаас','On the one hand, online classes are flexible.','Нэг талаас онлайн хичээл уян хатан.','🤚'],['on the other hand','нөгөө талаас','On the other hand, students feel isolated.','Нөгөө талаас сурагчид тусгаарлагдсан мэт санагддаг.','✋'],['whereas','харин','Children learn by playing, whereas adults need structure.','Хүүхдүүд тоглож сурдаг, харин насанд хүрэгчдэд бүтэц хэрэгтэй.','↔️'],['it could be argued','… гэж маргаж болно','It could be argued that homework is unnecessary.','Гэрийн даалгавар шаардлагагүй гэж маргаж болно.','🗣️'],['in the long term','урт хугацаанд','In the long term, education reduces poverty.','Урт хугацаанд боловсрол ядуурлыг бууруулдаг.','📈'],['likely','магадлалтай','Schools are likely to use more AI.','Сургуулиуд илүү их хиймэл оюун ухаан ашиглах магадлалтай.','🎲'],['essential','зайлшгүй','Teachers are essential for society.','Багш нар нийгэмд зайлшгүй хэрэгтэй.','❗']],
gram:{t:'Balanced opinions and speculating about the future',tm:'Тэнцвэртэй санал бодол ба ирээдүйг таамаглах',
en:'<p>In IELTS Part 3, show both sides before your conclusion: <b>On the one hand<\/b>… <b>On the other hand<\/b>… <b>Overall, I believe<\/b>…<\/p><p>Contrast: <b>whereas / while<\/b> (two facts in one sentence), <b>however<\/b> (new sentence), <b>although<\/b> + clause.<\/p><p>Speculate with: <b>is likely to<\/b>, <b>might / may / could<\/b>, <b>I would imagine that<\/b>, <b>there\'s a good chance that<\/b>. Schools <b>are likely to<\/b> use more technology. Teachers <b>might<\/b> become guides rather than lecturers.<\/p><p>Generalise carefully: <b>tend to<\/b>, <b>in many cases<\/b>, <b>to some extent<\/b>.<\/p>',
mn:'<p>IELTS 3-р хэсэгт дүгнэлтээсээ өмнө хоёр талыг харуул: <b>On the one hand<\/b> (нэг талаас)… <b>On the other hand<\/b> (нөгөө талаас)… <b>Overall, I believe<\/b> (ерөнхийдөө би … гэж боддог).<\/p><p>Эсрэгцүүлэх: <b>whereas / while<\/b> (харин), <b>however<\/b> (гэсэн хэдий ч), <b>although<\/b> (хэдийгээр).<\/p><p>Таамаглах: <b>is likely to<\/b> (… магадлалтай), <b>might / may / could<\/b> (… байж магадгүй), <b>I would imagine that<\/b>.<\/p><p>Болгоомжтой ерөнхийлөх: <b>tend to<\/b> (… хандлагатай), <b>to some extent<\/b> (тодорхой хэмжээгээр).<\/p>',
ex:[['On the one hand, online learning is flexible. On the other hand, it requires a lot of self-discipline.','Нэг талаас онлайн суралцахуй уян хатан. Нөгөө талаас их өөрийн сахилга бат шаарддаг.'],['Urban schools tend to have better facilities, whereas rural schools often lack teachers.','Хотын сургуулиуд илүү сайн байгууламжтай байх хандлагатай, харин хөдөөгийнх ихэвчлэн багшаар дутагдалтай.'],['In the future, classrooms are likely to become more digital.','Ирээдүйд анги танхимууд илүү цахим болох магадлалтай.'],['Although exams are stressful, they can motivate students.','Шалгалт стресстэй ч сурагчдыг урамшуулж чаддаг.'],['To some extent, I agree that homework is useful.','Гэрийн даалгавар хэрэгтэй гэдэгтэй тодорхой хэмжээгээр санал нэг байна.']],
q:[{q:'___ the one hand, it\'s cheap. On the other hand, it\'s slow.',o:['In','On','At'],a:1},{q:'City children have many choices, ___ rural children have fewer.',o:['whereas','because','so'],a:0},{q:'Schools are ___ to use more AI in the future.',o:['likely','likes','like'],a:0},{q:'___ exams are stressful, they are necessary.',o:['Although','However','Despite'],a:0},{q:'Learning that lasts your whole life = ___ learning.',o:['lifelong','distance','rote'],a:0},{q:'A best Part 3 answer is…',o:['One word','An opinion with reasons, examples and the other side','A story about your weekend'],a:1}]},
dl:[{t:'IELTS Part 3: Technology in education',tm:'IELTS 3-р хэсэг: Боловсрол дахь технологи',lines:[['A','Do you think technology has improved education?','Технологи боловсролыг сайжруулсан гэж бодож байна уу?'],['B','Generally, yes. On the one hand, students can access huge amounts of information, and lessons can be more interactive.','Ерөнхийдөө тийм. Нэг талаас сурагчид асар их мэдээлэлд хүрч, хичээл илүү интерактив болж чадна.'],['B','On the other hand, there are some drawbacks. For example, many students get distracted by social media.','Нөгөө талаас зарим сул тал бий. Жишээ нь олон сурагчийн анхаарлыг сошиал медиа сарниулдаг.'],['A','Will teachers still be necessary in the future?','Ирээдүйд багш нар хэрэгтэй хэвээр байх уу?'],['B','I would imagine so. Teachers are likely to become guides rather than just sources of information.','Тийм гэж төсөөлж байна. Багш нар зөвхөн мэдээллийн эх сурвалж биш, чиглүүлэгч болох магадлалтай.'],['B','Machines can explain facts, whereas people can motivate and inspire. So overall, I believe teachers will always be essential.','Машин баримтыг тайлбарлаж чадна, харин хүн урамшуулж, урам зориг өгч чаддаг. Тиймээс ерөнхийдөө багш нар үргэлж зайлшгүй хэрэгтэй гэж боддог.']]},
{t:'IELTS Part 3: Rural and urban schools',tm:'IELTS 3-р хэсэг: Хөдөө ба хотын сургууль',lines:[['A','What are the differences between schools in cities and in the countryside in your country?','Танай улсын хот, хөдөөгийн сургуулиудын ялгаа юу вэ?'],['B','Urban schools tend to be bigger and better equipped, whereas rural schools are often small and lack specialist teachers.','Хотын сургуулиуд илүү том, сайн тоноглогдсон байх хандлагатай, харин хөдөөгийнх ихэвчлэн жижиг, мэргэжлийн багшаар дутагдалтай.'],['B','However, rural schools have some advantages. Classes are smaller, so teachers know every child well.','Гэсэн хэдий ч хөдөөгийн сургуульд давуу тал бий. Анги жижиг тул багш хүүхэд бүрийг сайн мэддэг.'],['A','How could the government reduce this gap?','Засгийн газар энэ ялгааг хэрхэн багасгаж болох вэ?'],['B','One solution might be online classes taught by specialist teachers from the city.','Нэг шийдэл бол хотын мэргэжлийн багш нарын заадаг онлайн хичээл байж болох юм.'],['B','Another could be offering higher salaries to teachers who work in remote areas.','Өөр нэг нь алслагдсан нутагт ажилладаг багш нарт илүү өндөр цалин санал болгох.']]}],
story:{t:'IELTS listening: How we remember new words',tm:'IELTS сонсгол: Шинэ үгийг хэрхэн тогтоодог вэ',listen:true,s:[['Good morning. In today\'s lecture, we\'ll look at how the brain remembers new vocabulary.','Өглөөний мэнд. Өнөөдрийн лекцээр тархи шинэ үгсийг хэрхэн тогтоодгийг үзнэ.'],['In the 1880s, a German scientist called Hermann Ebbinghaus studied memory by testing himself.','1880-аад онд Херманн Эббингаус гэдэг Германы эрдэмтэн өөрийгөө шалгах замаар ой санамжийг судалжээ.'],['He discovered what we now call the forgetting curve.','Тэр бидний одоо «мартах муруй» гэж нэрлэдэг зүйлийг нээсэн.'],['According to his research, we forget about half of new information within one day.','Түүний судалгаагаар бид шинэ мэдээллийн тал орчмыг нэг өдрийн дотор мартдаг.'],['However, every time we review the information, we forget it more slowly.','Гэсэн хэдий ч мэдээллийг давтах бүрт бид түүнийг илүү удаан мартдаг.'],['This is the idea behind spaced repetition: reviewing words after one day, then three days, then a week.','Энэ бол зайтай давталтын санаа юм: үгсийг нэг өдрийн дараа, дараа нь гурван өдөр, дараа нь долоо хоногийн дараа давтах.'],['A second important factor is context.','Хоёр дахь чухал хүчин зүйл бол нөхцөл, орчин.'],['Words are easier to remember when they are connected to pictures, stories or real situations.','Зураг, түүх, бодит нөхцөлтэй холбоотой үгийг тогтооход амархан.'],['Finally, using a new word in speaking or writing is far more effective than just reading it.','Эцэст нь шинэ үгийг ярианд эсвэл бичгээр хэрэглэх нь зөвхөн уншихаас хавьгүй үр дүнтэй.'],['So, for your homework, choose ten new words and use each one in a sentence about your own life.','Тиймээс гэрийн даалгавраар арван шинэ үг сонгоод, тус бүрийг өөрийн амьдралтай холбоотой өгүүлбэрт хэрэглээрэй.']],
gl:{lecture:'лекц',brain:'тархи',memory:'ой санамж','forgetting curve':'мартах муруй',research:'судалгаа',review:'давтах','spaced repetition':'зайтай давталт',factor:'хүчин зүйл',context:'нөхцөл, орчин',effective:'үр дүнтэй'},
q:[{q:'How much new information do we forget in one day?',o:['About 10%','About half','Nothing'],a:1},{q:'What is spaced repetition?',o:['Reviewing after increasing gaps','Reading a word 100 times','Learning only at night'],a:0},{q:'What is the homework?',o:['Use ten new words in sentences about your life','Read a book','Watch a film'],a:0}]},
speak:[['Part 3: What are the advantages and disadvantages of studying online?','3-р хэсэг: Онлайнаар суралцахын давуу ба сул тал юу вэ?','On the one hand, online learning is flexible and cheaper, so people can study while they work. On the other hand, it requires strong self-discipline, and students may feel isolated. Overall, I think a mix of online and face-to-face learning works best.'],['Part 3: Should university education be free? Why?','3-р хэсэг: Их сургуулийн боловсрол үнэгүй байх ёстой юу? Яагаад?','It could be argued that free education gives equal opportunities to everyone. However, it is very expensive for the government. In my opinion, there should be more scholarships for talented students from poor families.'],['Part 3: How might schools change in the next twenty years?','3-р хэсэг: Ирэх хорин жилд сургуулиуд хэрхэн өөрчлөгдөж болох вэ?','I would imagine that classrooms are likely to become more digital, and AI might help with marking. However, I think teachers will still be essential because students need motivation and guidance.']]},

{id:28,st:3,t:'Technology and society',tm:'Технологи ба нийгэм',c:'#4cc9f0',sc:['🌐','Our digital world','Бидний цахим ертөнц'],
goal:{en:'Discuss the effects of technology, using advanced passives and cause–effect language.',mn:'Технологийн нөлөөг ахисан түвшний идэвхгүй хэв, шалтгаан-үр дагаврын хэллэгээр хэлэлцэх.'},
words:[['impact','нөлөө','Smartphones have a huge impact on our lives.','Ухаалаг утас бидний амьдралд асар их нөлөөтэй.','💥'],['addiction','донтолт','Screen addiction is a growing problem.','Дэлгэцийн донтолт өсөн нэмэгдэж буй асуудал.','📵'],['privacy','хувийн нууц','Online privacy is important.','Цахим орчны хувийн нууц чухал.','🔒'],['surveillance','хяналт, тандалт','Cameras are used for surveillance.','Камерыг хяналтад ашигладаг.','📹'],['automation','автоматжуулалт','Automation will change many jobs.','Автоматжуулалт олон ажлыг өөрчилнө.','🦾'],['algorithm','алгоритм','Algorithms decide what we see online.','Бидний онлайнаар юу харахыг алгоритм шийддэг.','🧮'],['innovation','инноваци','Innovation drives the economy.','Инноваци эдийн засгийг урагшлуулдаг.','💡'],['cutting-edge','хамгийн сүүлийн үеийн','The lab has cutting-edge equipment.','Лаборатори хамгийн сүүлийн үеийн тоног төхөөрөмжтэй.','🔪'],['obsolete','хоцрогдсон','DVDs are almost obsolete.','DVD бараг хоцрогдсон.','📼'],['access','хандалт','Not everyone has access to the internet.','Хүн бүр интернэтэд хандах боломжгүй.','🔑'],['digital divide','цахим хуваагдал','The digital divide affects rural areas.','Цахим хуваагдал хөдөө орон нутагт нөлөөлдөг.','🌉'],['cyberbullying','цахим дээрэлхэлт','Cyberbullying can harm young people.','Цахим дээрэлхэлт залуучуудад хор хөнөөл учруулдаг.','🚫'],['misinformation','буруу мэдээлэл','Misinformation spreads quickly online.','Буруу мэдээлэл онлайнаар хурдан тархдаг.','❌'],['connect','холбох','Technology connects people across the world.','Технологи дэлхий даяар хүмүүсийг холбодог.','🔗'],['isolated','тусгаарлагдсан','Some people feel isolated despite being online.','Зарим хүн онлайн байгаа ч ганцаардмал санагддаг.','🏝️'],['efficient','үр ашигтай','Online banking is more efficient.','Онлайн банк илүү үр ашигтай.','⚙️'],['convenience','тав тух','People value convenience.','Хүмүүс тав тухыг эрхэмлэдэг.','🛋️'],['rely on','найдах, түшиглэх','We rely on our phones too much.','Бид утсандаа хэт их найддаг.','🫱'],['distract','анхаарал сарниулах','Notifications distract students.','Мэдэгдлүүд сурагчдын анхаарлыг сарниулдаг.','🔔'],['consequence','үр дагавар','Every choice has consequences.','Сонголт бүр үр дагавартай.','➡️'],['lead to','хүргэх','Too much screen time can lead to sleep problems.','Дэлгэцийн өмнө хэт удах нь нойрны асуудалд хүргэж болно.','🛤️'],['result in','үр дүнд хүргэх','Automation may result in job losses.','Автоматжуулалт ажлын байр алдагдахад хүргэж магадгүй.','🎯'],['due to','… -аас болж','Due to the storm, the internet was down.','Шуурганаас болж интернэт тасарсан.','⛈️'],['as a result','үүний үр дүнд','As a result, people work from home more.','Үүний үр дүнд хүмүүс гэрээсээ илүү ажилладаг болсон.','📊'],['regulate','зохицуулах','Governments need to regulate AI.','Засгийн газрууд хиймэл оюун ухааныг зохицуулах хэрэгтэй.','📜'],['ethical','ёс зүйн','There are ethical questions about AI.','Хиймэл оюун ухааны талаар ёс зүйн асуултууд бий.','⚖️'],['vulnerable','эмзэг','Children are vulnerable online.','Хүүхдүүд цахим орчинд эмзэг.','🥚'],['screen time','дэлгэцийн цаг','Parents should limit screen time.','Эцэг эхчүүд дэлгэцийн цагийг хязгаарлах хэрэгтэй.','⏱️'],['remote work','зайнаас ажиллах','Remote work is popular in IT.','Мэдээллийн технологийн салбарт зайнаас ажиллах түгээмэл.','🏡'],['breakthrough','нээлт, ололт','Vaccines were a medical breakthrough.','Вакцин бол анагаах ухааны нээлт байсан.','🚀']],
gram:{t:'Advanced passives and cause–effect language',tm:'Ахисан идэвхгүй хэв ба шалтгаан-үр дагаврын хэллэг',
en:'<p>Passive in other tenses: has been + pp (<b>Millions of jobs have been created<\/b>), will be + pp (<b>Many tasks will be automated<\/b>), can/should be + pp (<b>AI should be regulated<\/b>), is being + pp (<b>A new law is being discussed<\/b>).<\/p><p>Impersonal passive for opinions: <b>It is believed that<\/b>… / <b>It is often said that<\/b>… / Technology <b>is thought to<\/b> improve productivity.<\/p><p>Cause and effect: X <b>leads to / results in / causes<\/b> Y. Y <b>is caused by / is due to<\/b> X. <b>As a result<\/b>, … / <b>Consequently<\/b>, …<\/p>',
mn:'<p>Бусад цагийн идэвхгүй хэв: has been + 3-р хэлбэр (<b>олон ажлын байр бий болсон<\/b>), will be + pp (<b>автоматжуулагдана<\/b>), should be + pp (<b>зохицуулагдах ёстой<\/b>), is being + pp (<b>хэлэлцэгдэж байна<\/b>).<\/p><p>Санал бодлыг хувийн бусаар: <b>It is believed that<\/b>… (… гэж үздэг) / <b>It is often said that<\/b>…<\/p><p>Шалтгаан-үр дагавар: X <b>leads to / results in<\/b> Y (Y-д хүргэдэг). Y <b>is caused by / is due to<\/b> X (X-ээс болдог). <b>As a result<\/b> (үүний үр дүнд).<\/p>',
ex:[['Many jobs have been replaced by machines.','Олон ажлыг машинаар орлуулсан.'],['It is believed that AI will create new types of work.','Хиймэл оюун ухаан шинэ төрлийн ажил бий болгоно гэж үздэг.'],['Social media should be regulated more strictly.','Сошиал медиаг илүү хатуу зохицуулах ёстой.'],['Too much screen time can lead to poor sleep.','Дэлгэцийн өмнө хэт удах нь муу нойронд хүргэж болно.'],['The digital divide is caused by a lack of infrastructure.','Цахим хуваагдал дэд бүтэц дутагдсанаас үүсдэг.']],

dl:[{t:'IELTS Part 3: Social media',tm:'IELTS 3-р хэсэг: Сошиал медиа',lines:[['A','How has social media changed the way people communicate?','Сошиал медиа хүмүүсийн харилцааг хэрхэн өөрчилсөн бэ?'],['B','It has made communication much faster. Families who live far apart can be connected instantly.','Харилцааг хамаагүй хурдан болгосон. Хол амьдардаг гэр бүлүүд тэр дороо холбогдож чаддаг болсон.'],['B','However, it is often said that online conversations are more superficial than face-to-face ones.','Гэсэн хэдий ч онлайн яриа биечлэн ярихаас илүү өнгөц байдаг гэж ихэвчлэн хэлдэг.'],['A','Should children\'s use of social media be limited?','Хүүхдийн сошиал медиа хэрэглээг хязгаарлах ёстой юу?'],['B','Definitely. Children are vulnerable, and too much time online can lead to anxiety and cyberbullying.','Мэдээж. Хүүхдүүд эмзэг бөгөөд онлайн хэт удах нь түгшүүр, цахим дээрэлхэлтэд хүргэж болно.'],['B','I think parents and schools should work together, and platforms should be regulated more strictly.','Эцэг эх, сургууль хамтран ажиллаж, платформуудыг илүү хатуу зохицуулах ёстой гэж боддог.']]},
{t:'Debate: Will AI take our jobs?',tm:'Мэтгэлцээн: Хиймэл оюун ухаан бидний ажлыг булаах уу?',lines:[['A','I\'m worried that AI will replace many teachers and office workers.','Хиймэл оюун ухаан олон багш, оффисын ажилтныг орлох вий гэж санаа зовж байна.'],['B','Some routine tasks will certainly be automated. But historically, technology has created more jobs than it has destroyed.','Зарим давтагддаг ажил автоматжуулагдах нь гарцаагүй. Гэхдээ түүхэнд технологи устгаснаасаа илүү олон ажил бий болгосон.'],['A','That\'s true, but the new jobs need new skills.','Үнэн, гэхдээ шинэ ажилд шинэ ур чадвар хэрэгтэй.'],['B','Exactly. As a result, lifelong learning is more important than ever.','Яг тийм. Үүний үр дүнд насан туршийн суралцахуй урьд урьдынхаас чухал болж байна.'],['A','So the real question is how quickly we can adapt.','Тэгэхээр жинхэнэ асуулт бол бид хэр хурдан дасан зохицож чадах вэ гэдэг.']]}],
story:{t:'IELTS listening: A radio report on smartphone use',tm:'IELTS сонсгол: Ухаалаг утасны хэрэглээний тухай радиогийн мэдээ',listen:true,s:[['Welcome back to Science Today. A new study about smartphone use has been published this week.','Science Today нэвтрүүлэгт эргэн тавтай морил. Энэ долоо хоногт ухаалаг утасны хэрэглээний тухай шинэ судалгаа нийтлэгджээ.'],['More than three thousand adults in five countries were asked about their daily habits.','Таван орны гурван мянга гаруй насанд хүрэгчдээс өдөр тутмын зуршлыг нь асуужээ.'],['On average, participants checked their phones ninety-six times a day.','Оролцогчид өдөрт дунджаар ерэн зургаан удаа утсаа шалгадаг байжээ.'],['That is roughly once every ten minutes while they are awake.','Энэ нь сэрүүн байх хугацаандаа ойролцоогоор арван минут тутамд нэг удаа гэсэн үг.'],['The researchers found that heavy users slept forty minutes less than light users.','Утсаа их хэрэглэдэг хүмүүс бага хэрэглэдгээсээ дөчин минутаар бага унтдаг болохыг судлаачид олжээ.'],['This is thought to be caused by blue light and by notifications late at night.','Энэ нь цэнхэр гэрэл болон шөнө орой ирэх мэдэгдлүүдээс шалтгаалдаг гэж үзэж байна.'],['Interestingly, people who turned off notifications reported feeling less stressed after two weeks.','Сонирхолтой нь, мэдэгдлээ унтраасан хүмүүс хоёр долоо хоногийн дараа стресс багассан гэж мэдээлжээ.'],['The study also showed that people over fifty used their phones half as much as people in their twenties.','Мөн тавиас дээш насныхан хорьд насныхнаас хоёр дахин бага утас хэрэглэдэг нь харагдсан.'],['The researchers recommend keeping phones out of the bedroom.','Судлаачид утсаа унтлагын өрөөнөөс гадуур байлгахыг зөвлөж байна.'],['They also suggest one phone-free hour before going to sleep.','Мөн унтахаасаа өмнө нэг цаг утасгүй байхыг санал болгож байна.']],
gl:{published:'нийтлэгдсэн',participants:'оролцогчид','on average':'дунджаар',roughly:'ойролцоогоор',awake:'сэрүүн','heavy users':'их хэрэглэгчид','blue light':'цэнхэр гэрэл',reported:'мэдээлсэн',recommend:'зөвлөх','phone-free':'утасгүй'},
q:[{q:'How many times a day did people check their phones?',o:['16','69','96'],a:2},{q:'How much less did heavy users sleep?',o:['14 minutes','40 minutes','4 hours'],a:1},{q:'What do the researchers recommend?',o:['Keeping phones out of the bedroom','Buying new phones','Using phones more at night'],a:0}]},
speak:[['Part 3: Has technology made people\'s lives better or worse?','3-р хэсэг: Технологи хүмүүсийн амьдралыг сайжруулсан уу, муутгасан уу?','Overall, I believe it has made life better. For example, medical breakthroughs have been achieved and people can work remotely. However, it has also led to new problems, such as screen addiction and misinformation.'],['Part 3: Should governments control what people post online?','3-р хэсэг: Засгийн газар хүмүүсийн онлайн нийтлэлийг хянах ёстой юу?','To some extent, yes. Harmful content such as cyberbullying should be removed. However, too much control could limit freedom of speech, so a balance is needed.'],['Part 3: What skills will people need for jobs in the future?','3-р хэсэг: Ирээдүйн ажилд хүмүүст ямар ур чадвар хэрэгтэй болох вэ?','Since many routine tasks will be automated, people will need creativity, critical thinking and digital skills. Communication skills are also likely to become more valuable.']]}
]);

{id:29,st:3,t:'The environment: problems and solutions',tm:'Байгаль орчин: асуудал ба шийдэл',c:'#2d6a4f',sc:['🌿','Global environment','Дэлхийн байгаль орчин'],
goal:{en:'Discuss environmental issues and imagine different pasts with the third conditional.',mn:'Байгаль орчны асуудлыг хэлэлцэж, гуравдугаар нөхцөлөөр өнгөрсний өөр хувилбарыг төсөөлөх.'},
words:[['emissions','ялгарал','Carbon emissions must be reduced.','Нүүрстөрөгчийн ялгарлыг бууруулах ёстой.','🏭'],['renewable','сэргээгдэх','Wind is a renewable energy source.','Салхи бол сэргээгдэх эрчим хүчний эх үүсвэр.','🌬️'],['fossil fuels','чулуужсан түлш','Coal and oil are fossil fuels.','Нүүрс, газрын тос бол чулуужсан түлш.','⛽'],['carbon footprint','нүүрстөрөгчийн ул мөр','Flying increases your carbon footprint.','Онгоцоор нисэх нь нүүрстөрөгчийн ул мөрийг нэмэгдүүлдэг.','👣'],['desertification','цөлжилт','Desertification threatens Mongolian pastures.','Цөлжилт Монголын бэлчээрт заналхийлж байна.','🏜️'],['overgrazing','хэт бэлчээрлэлт','Overgrazing damages the grassland.','Хэт бэлчээрлэлт тал нутгийг сүйтгэдэг.','🐐'],['biodiversity','биологийн олон янз байдал','Forests protect biodiversity.','Ой биологийн олон янз байдлыг хамгаалдаг.','🦋'],['habitat','амьдрах орчин','The snow leopard\'s habitat is shrinking.','Ирвэсийн амьдрах орчин багасаж байна.','🏔️'],['extinct','устаж үгүй болсон','Many species could become extinct.','Олон зүйл устаж үгүй болж болзошгүй.','🦖'],['deforestation','ойн хомсдол','Deforestation leads to floods.','Ойн хомсдол үерт хүргэдэг.','🪓'],['contaminate','бохирдуулах','Mining can contaminate rivers.','Уул уурхай голыг бохирдуулж болно.','☣️'],['consumption','хэрэглээ','Energy consumption rises in winter.','Өвөл эрчим хүчний хэрэглээ өсдөг.','🔌'],['conserve','хэмнэх, хадгалах','We must conserve water.','Бид усаа хэмнэх ёстой.','💧'],['initiative','санаачилга','The government launched a tree-planting initiative.','Засгийн газар мод тарих санаачилга эхлүүлсэн.','🌱'],['awareness','мэдлэг, ухамсар','We need to raise awareness about pollution.','Бохирдлын талаарх мэдлэгийг дээшлүүлэх хэрэгтэй.','📣'],['incentive','урамшуулал','Tax incentives encourage solar energy.','Татварын урамшуулал нарны эрчим хүчийг дэмждэг.','🎁'],['ban','хориглох','Some countries have banned plastic bags.','Зарим улс хуванцар уутыг хориглосон.','⛔'],['sustainable','тогтвортой','Sustainable farming protects the soil.','Тогтвортой газар тариалан хөрсийг хамгаалдаг.','♻️'],['long-term','урт хугацааны','We need long-term solutions.','Бидэнд урт хугацааны шийдэл хэрэгтэй.','⏳'],['short-term','богино хугацааны','That\'s only a short-term fix.','Энэ зөвхөн богино хугацааны засвар.','⌛'],['severe','ноцтой','The drought was severe.','Ган ноцтой байсан.','🔥'],['tackle','шийдвэрлэх, тэмцэх','We must tackle climate change together.','Бид уур амьсгалын өөрчлөлттэй хамтдаа тэмцэх ёстой.','🥊'],['individual','хувь хүн','Individuals can make a difference.','Хувь хүн өөрчлөлт авчирч чадна.','🧍'],['responsibility','хариуцлага','Protecting nature is everyone\'s responsibility.','Байгалиа хамгаалах нь хүн бүрийн хариуцлага.','🤝'],['inevitable','зайлшгүй, гарцаагүй','Some climate change is now inevitable.','Уур амьсгалын зарим өөрчлөлт одоо зайлшгүй болсон.','🔜'],['reverse','буцаах','Can we reverse the damage?','Бид хохирлыг буцааж чадах уу?','↩️'],['shortage','хомсдол','There is a water shortage in some regions.','Зарим бүс нутагт усны хомсдол бий.','🚱'],['generate','үйлдвэрлэх, бий болгох','Solar panels generate electricity.','Нарны хавтан цахилгаан үйлдвэрлэдэг.','⚡'],['urgent','яаралтай','This is an urgent problem.','Энэ бол яаралтай асуудал.','🚨'],['should have','… байх ёстой байсан','We should have acted earlier.','Бид эрт арга хэмжээ авах ёстой байсан.','🔙']],
gram:{t:'Third conditional and should have',tm:'Гуравдугаар нөхцөл ба should have',
en:'<p>Use the <b>third conditional<\/b> to imagine a different past: <b>If<\/b> + past perfect, <b>would have<\/b> + past participle.<\/p><p><b>If<\/b> we <b>had planted<\/b> more trees, the floods <b>would not have been<\/b> so bad. (But we didn\'t plant them.)<\/p><p><b>should have / shouldn\'t have<\/b> + pp = criticism or regret: We <b>should have<\/b> protected the forests. They <b>shouldn\'t have<\/b> built a factory near the river.<\/p><p><b>could have<\/b> + pp = a past possibility that didn\'t happen: We <b>could have<\/b> used solar energy.<\/p>',
mn:'<p>Өнгөрсний өөр хувилбарыг төсөөлөхдөө <b>гуравдугаар нөхцөл<\/b>: <b>If<\/b> + past perfect, <b>would have<\/b> + 3-р хэлбэр.<\/p><p><b>If<\/b> we <b>had planted<\/b> more trees, the floods <b>would not have been<\/b> so bad. (Илүү олон мод тарьсан бол үер ийм муу байхгүй байсан. — Гэхдээ тариагүй.)<\/p><p><b>should have<\/b> + pp = харамсал, шүүмжлэл: We <b>should have<\/b> protected the forests. (Ойгоо хамгаалах ёстой байсан.)<\/p><p><b>could have<\/b> + pp = болох байсан ч болоогүй боломж.<\/p>',
ex:[['If the government had acted earlier, the air would have been cleaner.','Засгийн газар эрт арга хэмжээ авсан бол агаар цэвэр байх байсан.'],['If it had rained in spring, the herders wouldn\'t have lost their animals.','Хавар бороо орсон бол малчид малаа алдахгүй байсан.'],['We should have recycled more.','Бид илүү их дахин боловсруулах ёстой байсан.'],['They shouldn\'t have cut down the forest.','Тэд ойг огтлох ёсгүй байсан.'],['We could have used wind energy instead of coal.','Бид нүүрсний оронд салхины эрчим хүч ашиглаж болох байсан.']],
q:[{q:'If we ___ earlier, we would have saved the lake.',o:['acted','had acted','have acted'],a:1},{q:'If it had rained, the grass ___ grown.',o:['would have','will have','had'],a:0},{q:'We ___ protected the forest. Now it\'s too late.',o:['should have','should','must'],a:0},{q:'They ___ built the factory near the river. It was a mistake.',o:['should have','shouldn\'t have','could'],a:1},{q:'Energy from wind and sun is ___.',o:['renewable','fossil','extinct'],a:0},{q:'Too many animals eating grass = ___',o:['overgrazing','deforestation','emissions'],a:0}]},
dl:[{t:'IELTS Part 3: Who is responsible?',tm:'IELTS 3-р хэсэг: Хэн хариуцлагатай вэ?',lines:[['A','Who should be responsible for protecting the environment — individuals or governments?','Байгаль орчныг хамгаалах хариуцлагыг хэн хүлээх ёстой вэ — хувь хүн үү, засгийн газар уу?'],['B','I think it\'s a shared responsibility, but governments play the biggest role.','Энэ бол хамтын хариуцлага гэж боддог, гэхдээ засгийн газар хамгийн том үүрэгтэй.'],['B','For example, individuals can recycle, but only governments can ban harmful products or invest in renewable energy.','Жишээ нь хувь хүн дахин боловсруулж чадна, харин зөвхөн засгийн газар хортой бүтээгдэхүүнийг хориглож, сэргээгдэх эрчим хүчинд хөрөнгө оруулж чадна.'],['A','What could have been done differently in your country?','Танай улсад юуг өөрөөр хийж болох байсан бэ?'],['B','If clean heating had been introduced twenty years ago, Ulaanbaatar wouldn\'t have such severe air pollution today.','Хорин жилийн өмнө цэвэр халаалт нэвтрүүлсэн бол Улаанбаатар өнөөдөр ийм ноцтой агаарын бохирдолтой байхгүй байсан.'],['B','We also should have controlled the number of animals to prevent overgrazing.','Мөн хэт бэлчээрлэлтээс сэргийлэхийн тулд малын тоог хянах ёстой байсан.']]},
{t:'Solutions',tm:'Шийдлүүд',lines:[['A','What do you think is the most effective solution to air pollution?','Агаарын бохирдлын хамгийн үр дүнтэй шийдэл юу гэж бодож байна?'],['B','In the short term, providing cleaner fuel to ger districts. In the long term, connecting homes to central heating.','Богино хугацаанд гэр хорооллыг цэвэр түлшээр хангах. Урт хугацаанд айлуудыг төвийн халаалтад холбох.'],['A','Would people accept higher prices for clean energy?','Хүмүүс цэвэр эрчим хүчний өндөр үнийг хүлээн зөвшөөрөх үү?'],['B','Probably not, unless there are incentives. That\'s why subsidies are important.','Урамшуулалгүй бол магадгүй үгүй. Тиймээс татаас чухал.']]}],
story:{t:'IELTS listening: The Great Green Wall',tm:'IELTS сонсгол: Их ногоон хэрэм',listen:true,s:[['In today\'s talk, I\'m going to describe one of the largest environmental projects in the world.','Өнөөдрийн илтгэлээр дэлхийн хамгийн том байгаль орчны төслүүдийн нэгийг танилцуулна.'],['It is called the Great Green Wall, and it was started in Africa in 2007.','Үүнийг Их ногоон хэрэм гэдэг бөгөөд 2007 онд Африкт эхлүүлсэн.'],['The aim was to plant a line of trees eight thousand kilometres long, across eleven countries.','Зорилго нь арван нэгэн орныг дайрсан найман мянган километр урт модны зурвас тарих байв.'],['The trees were supposed to stop the Sahara Desert from spreading south.','Мод Сахарын цөл урагш тэлэхийг зогсоох ёстой байлаа.'],['However, in the first years, many young trees died because local people had not been involved.','Гэвч эхний жилүүдэд нутгийн иргэдийг оролцуулаагүй тул олон залуу мод үхсэн.'],['If farmers had been asked earlier, they would have chosen trees that were useful to them.','Тариачдаас эрт асуусан бол тэд өөрсдөд нь хэрэгтэй модыг сонгох байсан.'],['Today, the project focuses on helping communities restore their own land.','Өнөөдөр төсөл орон нутгийн иргэдэд өөрсдийн газрыг нөхөн сэргээхэд туслахад анхаарч байна.'],['Mongolia has a similar programme, called the Billion Trees initiative, which began in 2021.','Монголд 2021 онд эхэлсэн Тэрбум мод гэх ижил төстэй хөтөлбөр бий.'],['Experts say these projects succeed only when people see real benefits.','Мэргэжилтнүүд хүмүүс бодит ашиг тусыг харсан үед л ийм төсөл амжилттай болдог гэж хэлдэг.'],['For example, fruit trees provide food and income as well as shade.','Жишээ нь жимсний мод сүүдэр төдийгүй хоол хүнс, орлого өгдөг.']],
gl:{aim:'зорилго','supposed to':'… ёстой байсан',spreading:'тэлэх',involved:'оролцуулсан',communities:'олон нийт, орон нутаг',restore:'нөхөн сэргээх',programme:'хөтөлбөр',benefits:'ашиг тус',shade:'сүүдэр',income:'орлого'},
q:[{q:'How long is the Great Green Wall planned to be?',o:['800 km','8,000 km','80,000 km'],a:1},{q:'Why did many trees die at first?',o:['Local people were not involved','There was too much rain','Animals ate them'],a:0},{q:'When did Mongolia\'s Billion Trees initiative begin?',o:['2007','2017','2021'],a:2}]},
speak:[['Part 2: Describe an environmental problem in your area. Say what it is, what causes it, how it affects people, and what should be done.','2-р хэсэг: Танай нутгийн байгаль орчны асуудлыг тайлбарла: юу, шалтгаан, хүмүүст үзүүлэх нөлөө, юу хийх ёстой.','I\'d like to talk about air pollution in Ulaanbaatar. It is mainly caused by coal stoves in ger districts… If clean heating had been introduced earlier… In my view, the government should…'],['Part 3: Is it too late to stop climate change?','3-р хэсэг: Уур амьсгалын өөрчлөлтийг зогсооход хэтэрхий оройтсон уу?','Some climate change is inevitable now. We should have acted decades ago. However, if we tackle emissions urgently, we can still limit the damage.'],['Part 3: Should flying be more expensive to protect the environment?','3-р хэсэг: Байгаль орчноо хамгаалахын тулд нислэг илүү үнэтэй байх ёстой юу?','On the one hand, higher prices would reduce emissions. On the other hand, it would be unfair to people with low incomes. A better solution might be investing in cleaner aircraft.']]},

{id:30,st:3,t:'Health and lifestyle',tm:'Эрүүл мэнд ба амьдралын хэв маяг',c:'#e76f51',sc:['🩺','Healthy living','Эрүүл амьдрал'],
goal:{en:'Discuss health and lifestyle, and make deductions with must / might / can\'t.',mn:'Эрүүл мэнд, амьдралын хэв маягийг хэлэлцэж, must / might / can\'t-ээр дүгнэлт хийх.'},
words:[['sedentary','суугаа (хөдөлгөөн багатай)','Office workers often have sedentary lifestyles.','Оффисын ажилтнууд ихэвчлэн хөдөлгөөн багатай амьдралтай.','🪑'],['obesity','таргалалт','Obesity is increasing among children.','Хүүхдүүдийн дунд таргалалт нэмэгдэж байна.','⚖️'],['nutrition','шим тэжээл','Good nutrition helps children grow.','Зөв шим тэжээл хүүхдийн өсөлтөд тусалдаг.','🥦'],['balanced diet','тэнцвэртэй хооллолт','A balanced diet includes vegetables.','Тэнцвэртэй хооллолтод ногоо ордог.','🥗'],['processed food','боловсруулсан хүнс','Processed food contains a lot of salt.','Боловсруулсан хүнс их давс агуулдаг.','🍟'],['prevention','урьдчилан сэргийлэлт','Prevention is better than cure.','Урьдчилан сэргийлэх нь эмчлэхээс дээр.','🛡️'],['symptom','шинж тэмдэг','Fever is a common symptom of flu.','Халуурах бол томуугийн түгээмэл шинж тэмдэг.','🌡️'],['diagnose','онош тавих','The doctor diagnosed an infection.','Эмч халдвар гэж оношилсон.','🩻'],['treatment','эмчилгээ','The treatment worked quickly.','Эмчилгээ хурдан үр дүнгээ өгсөн.','💉'],['recover','эдгэрэх','It took him a month to recover.','Түүнд эдгэрэхэд нэг сар зарцуулсан.','💪'],['mental health','сэтгэцийн эрүүл мэнд','Mental health is as important as physical health.','Сэтгэцийн эрүүл мэнд бие махбодийнхтой адил чухал.','🧠'],['wellbeing','сайн сайхан байдал','Exercise improves wellbeing.','Дасгал сайн сайхан байдлыг дээшлүүлдэг.','🌼'],['burnout','ядаргаа, туйлдал','Many teachers suffer from burnout.','Олон багш ажлын ядаргаанд өртдөг.','🪫'],['work-life balance','ажил, амьдралын тэнцвэр','A good work-life balance prevents stress.','Ажил амьдралын зөв тэнцвэр стрессээс сэргийлдэг.','⚖️'],['life expectancy','дундаж наслалт','Life expectancy has increased.','Дундаж наслалт нэмэгдсэн.','📈'],['healthcare','эрүүл мэндийн тусламж','Healthcare should be accessible to all.','Эрүүл мэндийн тусламж бүх хүнд хүртээмжтэй байх ёстой.','🏥'],['check-up','үзлэг','I have a medical check-up every year.','Би жил бүр эрүүл мэндийн үзлэгт ордог.','🩺'],['immune system','дархлааны систем','Sleep strengthens the immune system.','Нойр дархлааны системийг бэхжүүлдэг.','🦠'],['addicted','донтсон','He is addicted to sugar.','Тэр чихэрт донтсон.','🍬'],['moderation','хэмжээтэй байх','Eat sweets in moderation.','Чихэрлэг зүйлийг хэмжээтэй идээрэй.','🎚️'],['cardio','кардио дасгал','Running is good cardio exercise.','Гүйлт бол сайн кардио дасгал.','🏃'],['posture','биеийн байдал (суух, зогсох)','Bad posture causes back pain.','Буруу суулт нуруу өвдөхөд хүргэдэг.','🧍'],['hydrated','усжилттай','Stay hydrated in summer.','Зун усаа хангалттай уугаарай.','💧'],['insomnia','нойргүйдэл','Stress can cause insomnia.','Стресс нойргүйдэл үүсгэж болно.','🌙'],['must be','… байх нь гарцаагүй','You must be exhausted after the trip.','Аяллын дараа чи туйлдсан байх нь гарцаагүй.','✅'],['might be','… байж магадгүй','She might be ill.','Тэр өвчтэй байж магадгүй.','🤔'],['can\'t be','… байж таарахгүй','That can\'t be healthy!','Энэ эрүүл байж таарахгүй!','❌'],['must have','… байсан байх нь гарцаагүй','He must have forgotten his medicine.','Тэр эмээ мартсан байх нь гарцаагүй.','🔙'],['exhausted','туйлдсан','I was exhausted after work.','Ажлын дараа би туйлдсан байлаа.','😩'],['habit','зуршил','Healthy habits start in childhood.','Эрүүл зуршил бага наснаас эхэлдэг.','🔁']],
gram:{t:'Modals of deduction: must, might, can\'t (present and past)',tm:'Дүгнэлтийн модаль үйл үг: must, might, can\'t (одоо ба өнгөрсөн)',
en:'<p>Use modals to show how sure you are.<\/p><p>Present: <b>must<\/b> be (I\'m sure it\'s true), <b>might / may / could<\/b> be (maybe), <b>can\'t<\/b> be (I\'m sure it\'s not true). She\'s coughing — she <b>must be<\/b> ill. He <b>might be<\/b> at the gym. That <b>can\'t be<\/b> true!<\/p><p>Past: modal + <b>have + past participle<\/b>: He <b>must have<\/b> worked late. She <b>might have<\/b> missed the bus. You <b>can\'t have<\/b> finished already!<\/p><p>Useful in IELTS Part 3 to speculate about causes: Obesity <b>might be<\/b> caused by… / People <b>must have<\/b> been healthier in the past because…<\/p>',
mn:'<p>Хэр итгэлтэй байгаагаа модаль үйл үгээр илэрхийлнэ.<\/p><p>Одоо: <b>must<\/b> be (гарцаагүй үнэн), <b>might / may / could<\/b> be (магадгүй), <b>can\'t<\/b> be (үнэн байж таарахгүй). She\'s coughing — she <b>must be<\/b> ill. (Ханиалгаж байна — өвчтэй байх нь гарцаагүй.)<\/p><p>Өнгөрсөн: модаль + <b>have + 3-р хэлбэр<\/b>: He <b>must have<\/b> worked late. (Орой болтол ажилласан байх нь гарцаагүй.) You <b>can\'t have<\/b> finished already! (Чи аль хэдийн дуусгасан байж таарахгүй!)<\/p>',
ex:[['You\'ve worked twelve hours. You must be exhausted.','Арван хоёр цаг ажилласан. Туйлдсан байх нь гарцаагүй.'],['He isn\'t answering. He might be asleep.','Тэр утсаа авахгүй байна. Унтаж байж магадгүй.'],['She can\'t be sick — I saw her at the gym this morning.','Тэр өвчтэй байж таарахгүй — өнөө өглөө фитнест харсан.'],['The road is wet. It must have rained last night.','Зам нойтон байна. Өчигдөр шөнө бороо орсон байх нь гарцаагүй.'],['People in the past might have been healthier because they walked more.','Эрт үеийн хүмүүс илүү их алхдаг байсан тул илүү эрүүл байсан байж магадгүй.']],
q:[{q:'She\'s sneezing a lot. She ___ have a cold.',o:['must','can\'t','mustn\'t'],a:0},{q:'He ___ be at work — it\'s Sunday and the office is closed.',o:['must','can\'t','might'],a:1},{q:'I\'m not sure where she is. She ___ be at the doctor\'s.',o:['might','must','can\'t'],a:0},{q:'His eyes are red. He must ___ slept badly.',o:['has','have','had'],a:1},{q:'A lifestyle with little movement = ___',o:['sedentary','balanced','hydrated'],a:0},{q:'Prevention is better than ___.',o:['cure','care','check'],a:0}]},
dl:[{t:'Speculating about a colleague',tm:'Хамт ажиллагчийн талаар таамаглах',lines:[['A','Have you seen Bold today? He looks terrible.','Өнөөдөр Болдыг харсан уу? Их муу харагдаж байна.'],['B','He must be exhausted. He\'s been working late every night this month.','Туйлдсан байх нь гарцаагүй. Энэ сард шөнө бүр орой болтол ажиллаж байгаа.'],['A','He might be suffering from burnout.','Ажлын ядаргаанд өртсөн байж магадгүй.'],['B','You could be right. He can\'t have had a holiday for at least a year.','Чиний зөв байж магадгүй. Тэр дор хаяж нэг жил амраагүй байх.'],['A','We should suggest that he takes a few days off.','Хэд хоног чөлөө авахыг санал болгох хэрэгтэй.'],['B','Good idea. A better work-life balance would help him.','Сайн санаа. Ажил амьдралын илүү зөв тэнцвэр түүнд тусална.']]},
{t:'IELTS Part 3: Healthy societies',tm:'IELTS 3-р хэсэг: Эрүүл нийгэм',lines:[['A','Why do you think obesity is increasing in many countries?','Олон оронд таргалалт яагаад нэмэгдэж байна гэж бодож байна?'],['B','It must be partly due to processed food, which is cheap and widely available.','Нэг хэсэг нь хямд, хаа сайгүй олддог боловсруулсан хүнснээс шалтгаалж байгаа нь гарцаагүй.'],['B','Another reason might be our sedentary lifestyles. Most people sit at a desk all day.','Өөр нэг шалтгаан нь хөдөлгөөн багатай амьдрал байж магадгүй. Ихэнх хүн өдөржин ширээний ард суудаг.'],['A','What can governments do about it?','Засгийн газар үүнд юу хийж чадах вэ?'],['B','They could tax sugary drinks and make sports facilities free for young people.','Чихэрлэг ундаанд татвар ногдуулж, залуучуудад спортын байгууламжийг үнэгүй болгож болно.']]}],
story:{t:'IELTS listening: Booking a health check',tm:'IELTS сонсгол: Эрүүл мэндийн үзлэгт бүртгүүлэх',listen:true,s:[['Receptionist: Good morning, City Health Clinic. How can I help you?','Хүлээн авагч: Өглөөний мэнд, Хотын эрүүл мэндийн клиник байна. Юугаар туслах вэ?'],['Caller: Hello, I\'d like to book a general health check, please.','Залгагч: Сайн байна уу, ерөнхий үзлэгт цаг авмаар байна.'],['Receptionist: Of course. Can I have your full name?','Хүлээн авагч: Мэдээж. Бүтэн нэрээ хэлнэ үү?'],['Caller: It\'s Oyuna Batbold. That\'s B-A-T-B-O-L-D.','Залгагч: Оюуна Батболд. B-A-T-B-O-L-D.'],['Receptionist: Thank you. And your date of birth?','Хүлээн авагч: Баярлалаа. Төрсөн он сар өдөр?'],['Caller: The fourteenth of March, nineteen eighty-eight.','Залгагч: 1988 оны гуравдугаар сарын 14.'],['Receptionist: We have an appointment on Thursday at ten fifteen with Dr. Lee.','Хүлээн авагч: Пүрэв гарагийн 10:15-д эмч Литэй цаг байна.'],['Caller: That\'s fine. Do I need to do anything before the appointment?','Залгагч: Тохирч байна. Үзлэгээс өмнө юу хийх хэрэгтэй вэ?'],['Receptionist: Yes, please don\'t eat anything after midnight, because we\'ll take a blood test.','Хүлээн авагч: Тийм, шөнө дундаас хойш юу ч идэж болохгүй, учир нь цусны шинжилгээ авна.'],['Receptionist: The check-up costs forty-five thousand tugriks, and please bring your ID card.','Хүлээн авагч: Үзлэг дөчин таван мянган төгрөг, иргэний үнэмлэхээ авчраарай.']],

speak:[['Part 1: What do you do to stay healthy?','1-р хэсэг: Та эрүүл байхын тулд юу хийдэг вэ?','I try to walk at least thirty minutes a day, and I avoid processed food. To be honest, I should sleep more, because I often work late.'],['Part 3: Why do many young people suffer from stress nowadays?','3-р хэсэг: Өнөө үед олон залуу яагаад стресст өртөж байна вэ?','It might be because of exam pressure and social media. Young people constantly compare themselves with others online. Also, many of them must find it hard to balance study and part-time work.'],['Part 3: Should the government make unhealthy food more expensive?','3-р хэсэг: Засгийн газар эрүүл бус хүнсийг илүү үнэтэй болгох ёстой юу?','To some extent, yes. A sugar tax has worked in some countries. However, education is also essential, because people need to understand why a balanced diet matters.']]},

{id:31,st:3,t:'Work and the economy',tm:'Ажил ба эдийн засаг',c:'#264653',sc:['📊','The world of work','Ажлын ертөнц'],
goal:{en:'Discuss jobs, the economy and changes over time, using the present perfect continuous.',mn:'Ажил, эдийн засаг, цаг хугацааны өөрчлөлтийг present perfect continuous-оор хэлэлцэх.'},
words:[['economy','эдийн засаг','Mining is important for the economy.','Уул уурхай эдийн засагт чухал.','📊'],['unemployment','ажилгүйдэл','Unemployment has fallen this year.','Энэ жил ажилгүйдэл буурсан.','📉'],['inflation','инфляц','Inflation makes everything more expensive.','Инфляц бүх зүйлийг үнэтэй болгодог.','🎈'],['industry','салбар, үйлдвэрлэл','The tourism industry is growing.','Аялал жуулчлалын салбар өсөж байна.','🏭'],['sector','салбар','The IT sector needs more workers.','Мэдээллийн технологийн салбарт илүү олон ажилтан хэрэгтэй.','🧩'],['skilled','мэргэшсэн','There is a shortage of skilled workers.','Мэргэшсэн ажилтан дутагдаж байна.','🛠️'],['entrepreneur','бизнес эрхлэгч','Young entrepreneurs start online businesses.','Залуу бизнес эрхлэгчид онлайн бизнес эхлүүлдэг.','🚀'],['start-up','гарааны компани','She works for a tech start-up.','Тэр технологийн гарааны компанид ажилладаг.','🌱'],['freelance','бие даасан (ажил)','He works freelance as a designer.','Тэр бие даасан дизайнераар ажилладаг.','🧑‍💻'],['employer','ажил олгогч','Employers value communication skills.','Ажил олгогчид харилцааны ур чадварыг үнэлдэг.','🏢'],['job security','ажлын байрны баталгаа','Government jobs offer job security.','Төрийн ажил ажлын байрны баталгаа өгдөг.','🔐'],['flexible hours','уян хатан цаг','Flexible hours help parents.','Уян хатан цаг эцэг эхчүүдэд тусалдаг.','🕒'],['qualified','мэргэшсэн, шаардлага хангасан','She is highly qualified.','Тэр өндөр мэргэшилтэй.','🎓'],['wage','цалин (цагийн)','The minimum wage has increased.','Хөдөлмөрийн хөлсний доод хэмжээ нэмэгдсэн.','💵'],['export','экспорт','Mongolia exports coal and copper.','Монгол нүүрс, зэс экспортолдог.','🚢'],['import','импорт','We import most of our vegetables.','Бид ногооныхоо ихэнхийг импортолдог.','📦'],['trade','худалдаа','Trade with China is very important.','Хятадтай хийх худалдаа маш чухал.','🤝'],['growth','өсөлт','Economic growth was 5% last year.','Өнгөрсөн жил эдийн засгийн өсөлт 5% байсан.','📈'],['decline','буурах','Sales have been declining.','Борлуулалт буурсаар байна.','📉'],['rise','өсөх','Prices have risen sharply.','Үнэ огцом өссөн.','⬆️'],['steadily','тогтвортой','The number of tourists has grown steadily.','Жуулчдын тоо тогтвортой өссөн.','📶'],['dramatically','эрс','Online shopping has increased dramatically.','Онлайн худалдаа эрс нэмэгдсэн.','🚀'],['workforce','ажиллах хүч','Women make up half the workforce.','Ажиллах хүчний талыг эмэгтэйчүүд бүрдүүлдэг.','👥'],['career path','мэргэжлийн зам','Teaching is a stable career path.','Багшлах бол тогтвортой мэргэжлийн зам.','🛤️'],['promotion','албан тушаал ахих','He\'s been hoping for a promotion.','Тэр дэвших найдлагатай байсаар байна.','⬆️'],['productivity','бүтээмж','Remote work can increase productivity.','Зайнаас ажиллах нь бүтээмжийг нэмэгдүүлж болно.','⚡'],['brain drain','оюуны цөлжилт','Brain drain is a problem for small countries.','Оюуны цөлжилт жижиг орнуудад асуудал болдог.','✈️'],['invest in','хөрөнгө оруулах','The country should invest in education.','Улс боловсролд хөрөнгө оруулах ёстой.','💹'],['competitive','өрсөлдөөнтэй','The job market is very competitive.','Ажлын зах зээл маш өрсөлдөөнтэй.','🏁'],['been working','ажилласаар','I\'ve been working here since 2012.','Би 2012 оноос хойш энд ажилласаар байна.','⏳']],
gram:{t:'Present perfect continuous; describing trends',tm:'Present perfect continuous; чиг хандлагыг тайлбарлах',
en:'<p><b>Present perfect continuous<\/b> (have/has been + -ing) for actions that started in the past and are still continuing, focusing on duration: I<b>\'ve been teaching<\/b> for twelve years. Prices <b>have been rising<\/b> since January.<\/p><p>Compare: I<b>\'ve written<\/b> three reports (result, number). I<b>\'ve been writing<\/b> reports all day (activity, duration).<\/p><p>Describing trends (useful for IELTS charts and Part 3): rise / increase / grow ↔ fall / decrease / decline; <b>sharply, dramatically, steadily, slightly<\/b>; a sharp rise, a steady decline.<\/p>',
mn:'<p><b>Present perfect continuous<\/b> (have/has been + -ing) — өнгөрсөнд эхэлж одоо ч үргэлжилж буй үйлдэл, үргэлжлэх хугацаанд анхаарна: I<b>\'ve been teaching<\/b> for twelve years. (Би арван хоёр жил багшилсаар байна.)<\/p><p>Харьцуул: I<b>\'ve written<\/b> three reports (үр дүн, тоо). I<b>\'ve been writing<\/b> reports all day (үйл ажиллагаа, хугацаа).<\/p><p>Чиг хандлага: rise / increase / grow (өсөх) ↔ fall / decrease / decline (буурах); <b>sharply<\/b> (огцом), <b>steadily<\/b> (тогтвортой), <b>slightly<\/b> (бага зэрэг).<\/p>',
ex:[['I\'ve been working at this school since 2012.','Би 2012 оноос хойш энэ сургуульд ажилласаар байна.'],['The price of meat has been rising steadily.','Махны үнэ тогтвортой өссөөр байна.'],['She\'s tired because she\'s been marking exams all day.','Тэр өдөржин шалгалт шалгаж байсан тул ядарсан байна.'],['The number of tourists increased dramatically in 2023.','2023 онд жуулчдын тоо эрс нэмэгдсэн.'],['Unemployment has fallen slightly this year.','Энэ жил ажилгүйдэл бага зэрэг буурсан.']],
q:[{q:'I ___ English for six months.',o:['have been learning','am learning','learned'],a:0},{q:'She\'s tired because she ___ all day.',o:['has been working','worked','works'],a:0},{q:'I\'ve ___ three emails this morning. (number)',o:['written','been writing'],a:0},{q:'Prices went up very fast = Prices rose ___.',o:['slightly','sharply','steadily'],a:1},{q:'When skilled people leave the country = ___',o:['brain drain','trade','growth'],a:0},{q:'A new small company = a ___',o:['start-up','sector','wage'],a:0}]},
dl:[{t:'IELTS Part 3: Jobs of the future',tm:'IELTS 3-р хэсэг: Ирээдүйн ажил',lines:[['A','Which jobs will be most in demand in the future?','Ирээдүйд аль ажлын эрэлт хамгийн их байх вэ?'],['B','I think jobs in IT and healthcare will be in high demand. The IT sector has been growing dramatically for the last ten years.','Мэдээллийн технологи, эрүүл мэндийн салбарын ажилд эрэлт өндөр байна гэж бодож байна. Мэдээллийн технологийн салбар сүүлийн арван жил эрс өссөөр ирсэн.'],['A','Why do you think so many young people want to work abroad?','Яагаад олон залуу гадаадад ажиллахыг хүсдэг гэж бодож байна?'],['B','Mainly because wages are higher. However, this has been causing brain drain in Mongolia.','Голчлон цалин өндөр учраас. Гэвч энэ нь Монголд оюуны цөлжилт үүсгэсээр байна.'],['A','How could this be solved?','Үүнийг хэрхэн шийдэж болох вэ?'],['B','The government could invest in start-ups and offer incentives to skilled workers who return.','Засгийн газар гарааны компаниудад хөрөнгө оруулж, эх орондоо буцаж ирсэн мэргэшсэн ажилтнуудад урамшуулал санал болгож болно.']]},
{t:'Talking about a graph',tm:'Графикийн тухай ярих',lines:[['A','What does this graph show?','Энэ график юуг харуулж байна?'],['B','It shows the number of international tourists in Mongolia from 2015 to 2024.','2015–2024 онд Монголд ирсэн олон улсын жуулчдын тоог харуулж байна.'],['A','What\'s the main trend?','Гол чиг хандлага юу вэ?'],['B','The number rose steadily until 2019, then fell sharply in 2020 because of the pandemic.','Тоо 2019 он хүртэл тогтвортой өсөөд, 2020 онд цар тахлын улмаас огцом буурсан.'],['A','And after that?','Түүний дараа?'],['B','It has been recovering since 2022, and last year it reached a record high.','2022 оноос хойш сэргэсээр, өнгөрсөн жил дээд амжилтдаа хүрсэн.']]}],
story:{t:'IELTS listening: A careers talk',tm:'IELTS сонсгол: Мэргэжлийн чиг баримжааны илтгэл',listen:true,s:[['Thank you for inviting me. I\'ve been working as a software developer for eight years.','Урьсанд баярлалаа. Би найман жил програм хангамж хөгжүүлэгчээр ажилласаар байна.'],['When I was at school, I had no idea what I wanted to do.','Сургуульд байхдаа би юу хийхээ огт мэддэггүй байсан.'],['I studied economics first, because my parents thought it was a safe choice.','Эцэг эх маань аюулгүй сонголт гэж үзсэн тул би эхлээд эдийн засаг сурсан.'],['But in my second year, I took an online coding course just for fun.','Гэвч хоёрдугаар курст зүгээр л сонирхлоор онлайн код бичих сургалтад суусан.'],['I loved it so much that I changed my major to computer science.','Маш их таалагдсан болохоор мэргэжлээ компьютерын ухаан руу сольсон.'],['My first job was at a small start-up with only five employees.','Миний анхны ажил ердөө таван ажилтантай жижиг гарааны компанид байсан.'],['The salary was low, but I learned more in one year than in four years at university.','Цалин бага байсан ч их сургуулийн дөрвөн жилээс илүү ихийг нэг жилд сурсан.'],['Today, I lead a team of twelve people, and we build apps for schools.','Өнөөдөр би арван хоёр хүний баг ахалж, сургуулиудад зориулсан апп бүтээдэг.'],['My advice is simple: try different things, and don\'t be afraid to change direction.','Миний зөвлөгөө энгийн: янз бүрийн зүйл туршиж, чиглэлээ өөрчлөхөөс бүү ай.'],['Also, keep improving your English, because most technical documents are written in it.','Мөн англи хэлээ сайжруулсаар бай, учир нь ихэнх техникийн баримт бичиг англиар бичигддэг.']],

speak:[['Part 2: Describe a job you would like to do in the future. Say what it is, what skills you need, how you would prepare, and why you want it.','2-р хэсэг: Ирээдүйд хийхийг хүсэж буй ажлаа тайлбарла: юу вэ, ямар ур чадвар хэрэгтэй, хэрхэн бэлтгэх, яагаад хүсэж байгаа.','I\'d like to talk about becoming a teacher trainer at an international level. I\'ve been teaching IT for many years… To prepare, I\'ve been improving my English…'],['Part 3: Is it better to work for a big company or to start your own business?','3-р хэсэг: Том компанид ажиллах уу, өөрийн бизнес эхлүүлэх үү — аль нь дээр вэ?','It depends on the person. Big companies offer job security and training, whereas running your own business gives you freedom but more risk.'],['Part 3: How has the job market changed in your country in recent years?','3-р хэсэг: Сүүлийн жилүүдэд танай улсын ажлын зах зээл хэрхэн өөрчлөгдсөн бэ?','The IT sector has been growing dramatically, and more people have been working freelance. At the same time, prices have risen sharply, so many young people have been looking for jobs abroad.']]},
