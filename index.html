{id:17,st:2,t:'Our planet',tm:'Бидний гараг',c:'#2a9d8f',sc:['🌍','Protecting nature','Байгалиа хамгаалахад'],
goal:{en:'Talk about the environment, causes and results, using the first conditional.',mn:'Байгаль орчин, шалтгаан үр дагаврыг нөхцөлт өгүүлбэрээр ярих.'},
words:[['environment','байгаль орчин','We must protect the environment.','Бид байгаль орчноо хамгаалах ёстой.','🌳'],['pollution','бохирдол','Air pollution is a big problem in winter.','Агаарын бохирдол өвөл том асуудал.','🏭'],['recycle','дахин боловсруулах','We recycle paper and plastic.','Бид цаас, хуванцар дахин боловсруулдаг.','♻️'],['plastic','хуванцар','Plastic bags are bad for animals.','Хуванцар уут амьтдад хортой.','🛍️'],['rubbish','хог','Don\'t leave rubbish in the mountains.','Ууланд хог бүү орхи.','🗑️'],['waste','хаягдал; үрэх','Don\'t waste water.','Усаа бүү үр.','🚮'],['energy','эрчим хүч','Solar energy is clean.','Нарны эрчим хүч цэвэр.','⚡'],['solar panel','нарны хавтан','Many gers use solar panels.','Олон гэр нарны хавтан ашигладаг.','☀️'],['climate change','уур амьсгалын өөрчлөлт','Climate change affects herders.','Уур амьсгалын өөрчлөлт малчдад нөлөөлдөг.','🌡️'],['global warming','дэлхийн дулаарал','Global warming melts glaciers.','Дэлхийн дулаарал мөсөн голыг хайлуулдаг.','🔥'],['flood','үер','The flood damaged many houses.','Үер олон байшинг сүйтгэсэн.','🌊'],['drought','ган','The drought killed the grass.','Ган гачиг өвсийг хатаасан.','🏜️'],['dzud','зуд','Dzud is a disaster for herders.','Зуд бол малчдад гамшиг.','❄️'],['forest','ой','Forests give us oxygen.','Ой бидэнд хүчилтөрөгч өгдөг.','🌲'],['wildlife','зэрлэг амьтад','Mongolia has rare wildlife.','Монголд ховор зэрлэг амьтад бий.','🦌'],['endangered','устах аюулд орсон','The snow leopard is endangered.','Ирвэс устах аюулд орсон.','🐆'],['protect','хамгаалах','Laws protect national parks.','Хууль үндэсний паркуудыг хамгаалдаг.','🛡️'],['reduce','багасгах','We can reduce waste at school.','Бид сургуульд хог хаягдлаа багасгаж чадна.','📉'],['reuse','дахин ашиглах','Reuse your shopping bag.','Дэлгүүрийн уутаа дахин ашигла.','🔁'],['save','хэмнэх','Turn off the lights to save energy.','Эрчим хүч хэмнэхийн тулд гэрлээ унтраа.','💡'],['coal','нүүрс','Many families burn coal in winter.','Олон айл өвөл нүүрс түлдэг.','⚫'],['smoke','утаа','Smoke covers the city in January.','Нэгдүгээр сард хотыг утаа бүрхдэг.','💨'],['mask','маск','Wear a mask on smoky days.','Утаатай өдөр маск зүү.','😷'],['plant','тарих; ургамал','Let\'s plant trees in spring.','Хавар мод тарьцгаая.','🌱'],['volunteer','сайн дурын ажилтан','Students volunteered to clean the river.','Сурагчид гол цэвэрлэхээр сайн дураараа оролцсон.','🙋'],['natural','байгалийн','Water is a natural resource.','Ус бол байгалийн баялаг.','🍃'],['resource','нөөц баялаг','We must use resources carefully.','Нөөц баялгаа зөв ашиглах ёстой.','⛏️'],['sustainable','тогтвортой','We need sustainable tourism.','Бидэнд тогтвортой аялал жуулчлал хэрэгтэй.','🌿'],['public transport','нийтийн тээвэр','Using public transport reduces traffic.','Нийтийн тээвэр түгжрэлийг багасгадаг.','🚌'],['future generations','хойч үе','We must think about future generations.','Бид хойч үеэ бодох ёстой.','👶']],
gram:{t:'First conditional: if + present, will',tm:'Нэгдүгээр нөхцөл: if + одоо цаг, will',
en:'<p>Use the <b>first conditional<\/b> for real possibilities in the future: <b>If<\/b> + present simple, <b>will<\/b> + verb.<\/p><p><b>If<\/b> we <b>recycle<\/b>, there <b>will be<\/b> less rubbish.<\/p><p>You can change the order: There will be less rubbish <b>if<\/b> we recycle. (No comma.)<\/p><p><b>unless<\/b> = if not: The air won\'t get better <b>unless<\/b> we stop burning coal.<\/p><p>Also: <b>when<\/b> (sure to happen): <b>When<\/b> spring comes, we\'ll plant trees.<\/p>',
mn:'<p>Ирээдүйд бодитоор болох нөхцөлийг <b>нэгдүгээр нөхцөл<\/b>-ээр хэлнэ: <b>If<\/b> + одоо энгийн цаг, <b>will<\/b> + үйл үг.<\/p><p><b>If<\/b> we <b>recycle<\/b>, there <b>will be<\/b> less rubbish. (Хэрэв бид дахин боловсруулбал хог бага болно.)<\/p><p><b>unless<\/b> = хэрэв … -гүй бол: The air won\'t get better <b>unless<\/b> we stop burning coal. (Нүүрс түлэхээ болихгүй бол агаар сайжрахгүй.)<\/p><p><b>when<\/b> — заавал болох зүйлд: <b>When<\/b> spring comes, we\'ll plant trees.<\/p>',
ex:[['If we plant trees, the air will be cleaner.','Мод тарьвал агаар цэвэр болно.'],['If you leave rubbish, animals will eat it.','Хог орхивол амьтад түүнийг идэнэ.'],['We won\'t save energy unless we turn off the lights.','Гэрлээ унтраахгүй бол эрчим хүч хэмнэхгүй.'],['If it doesn\'t rain, there will be a drought.','Бороо орохгүй бол ган болно.'],['When I get home, I\'ll sort the rubbish.','Гэртээ очмогцоо хогоо ангилна.']],
q:[{q:'If we ___ less plastic, the oceans will be cleaner.',o:['use','will use','used'],a:0},{q:'If you turn off the lights, you ___ energy.',o:['save','will save','saved'],a:1},{q:'___ we act now, it will be too late.',o:['If','Unless','When'],a:1},{q:'If it ___ tomorrow, we won\'t plant trees.',o:['rains','will rain','rained'],a:0},{q:'The snow leopard is ___.',o:['endangered','plastic','sustainable'],a:0},{q:'Reduce, reuse, ___',o:['recycle','rubbish','repeat'],a:0}]},
dl:[{t:'Smoky winter',tm:'Утаатай өвөл',lines:[['A','The smoke is terrible today. I can\'t see the mountains.','Өнөөдөр утаа аймаар байна. Уулс харагдахгүй байна.'],['B','I know. If it continues, more children will get sick.','Тийм. Ингэж үргэлжилбэл илүү олон хүүхэд өвчилнө.'],['A','What can we do?','Бид юу хийж чадах вэ?'],['B','If more families get clean heating, the air will improve.','Илүү олон айл цэвэр халаалттай болбол агаар сайжирна.'],['A','And if we take the bus instead of driving, there will be less traffic.','Машинаар биш автобусаар явбал түгжрэл багасна.'],['B','Exactly. Small changes make a big difference.','Яг тийм. Жижиг өөрчлөлт том ялгаа гаргадаг.']]},
{t:'School project',tm:'Сургуулийн төсөл',lines:[['A','Let\'s start a recycling project at school.','Сургуульдаа дахин боловсруулах төсөл эхлүүлье.'],['B','Good idea. If we put bins in every classroom, students will use them.','Сайн санаа. Анги бүрт хогийн сав тавивал сурагчид ашиглана.'],['A','What will we do with the plastic bottles?','Хуванцар савыг яах вэ?'],['B','We\'ll send them to a recycling company.','Дахин боловсруулах компанид өгнө.'],['A','I\'ll ask the principal tomorrow.','Би маргааш захиралаас асууя.'],['B','Great. Unless she says no, we\'ll start next week.','Гоё. Тэр татгалзахгүй л бол ирэх долоо хоногт эхэлнэ.']]}],
story:{t:'The river cleaners',tm:'Гол цэвэрлэгчид',s:[['Every spring, the river near Erdene\'s school was full of rubbish.','Хавар бүр Эрдэнийн сургуулийн ойролцоох гол хогоор дүүрдэг байв.'],['Plastic bottles, bags and old shoes floated in the water.','Хуванцар сав, уут, хуучин гутал усанд хөвдөг байв.'],['One day, Erdene said to his class, "If we don\'t do something, the fish will die."','Нэг өдөр Эрдэнэ ангийнхандаа «Хэрэв бид юм хийхгүй бол загас үхнэ» гэв.'],['His teacher agreed and helped them make a plan.','Багш нь санал нийлж, төлөвлөгөө гаргахад тусалсан.'],['On Saturday, thirty students volunteered with gloves and big bags.','Бямба гарагт гучин сурагч бээлий, том уут бариад сайн дураараа очив.'],['They worked for five hours and collected two hundred kilos of rubbish.','Тэд таван цаг ажиллаж, хоёр зуун кило хог цуглуулав.'],['A journalist took photos, and the story was on the news.','Сэтгүүлч зураг авч, энэ түүх мэдээгээр гарав.'],['Now the city puts bins along the river, and people use them.','Одоо хот голын дагуу хогийн сав тавьсан бөгөөд хүмүүс ашигладаг болжээ.'],['Last month, Erdene saw fish in the river again.','Өнгөрсөн сард Эрдэнэ голд дахиад загас харав.'],['"If everyone helps a little, nature will thank us," he says.','«Хүн бүр бага ч гэсэн тусалбал байгаль бидэнд талархана» гэж тэр хэлдэг.']],
gl:{floated:'хөвж байсан',agreed:'санал нийлсэн',gloves:'бээлий',collected:'цуглуулсан',journalist:'сэтгүүлч','on the news':'мэдээгээр',along:'дагуу',bins:'хогийн сав',nature:'байгаль',thank:'талархах'},

speak:[['What are the biggest environmental problems in your city?','Танай хотын хамгийн том байгаль орчны асуудал юу вэ?','The biggest problem is air pollution in winter. Many families burn coal, and there is too much traffic.'],['Complete: If I were the mayor, … / If we don\'t…, …','Гүйцээ: Хэрэв бид … хийхгүй бол …','If we don\'t reduce traffic, the air will get worse. If people use public transport, the city will be cleaner.'],['What do you do to protect the environment?','Та байгаль орчноо хамгаалахын тулд юу хийдэг вэ?','I recycle bottles, I bring my own bag to the shop and I try to save electricity.']]},

{id:18,st:2,t:'Rules and responsibilities',tm:'Дүрэм ба үүрэг хариуцлага',c:'#e63946',sc:['📏','Rules at school and work','Сургууль, ажлын дүрэм'],
goal:{en:'Talk about rules, obligations and advice using must, have to, should, can\'t.',mn:'Дүрэм, үүрэг, зөвлөгөөг must, have to, should, can\'t-аар ярих.'},
words:[['rule','дүрэм','Every school has rules.','Сургууль бүр дүрэмтэй.','📏'],['allowed','зөвшөөрөгдсөн','Phones are not allowed in class.','Хичээлийн үеэр утас ашиглахыг хориглоно.','✅'],['forbidden','хориотой','Smoking is forbidden here.','Энд тамхи татахыг хориглоно.','⛔'],['uniform','дүрэмт хувцас','Students must wear a uniform.','Сурагчид дүрэмт хувцас өмсөх ёстой.','👔'],['punctual','цагтаа','Please be punctual for meetings.','Хуралд цагтаа ирээрэй.','⏰'],['responsibility','үүрэг хариуцлага','Taking care of pets is a big responsibility.','Тэжээвэр амьтан арчлах том хариуцлага.','🧭'],['obey','дагах (дүрэм)','We must obey traffic laws.','Бид замын хөдөлгөөний дүрмийг дагах ёстой.','🚦'],['law','хууль','It\'s against the law.','Энэ хууль зөрчсөн үйлдэл.','⚖️'],['fine','торгууль','He paid a fine for speeding.','Тэр хурд хэтрүүлсний төлөө торгууль төлсөн.','💸'],['permission','зөвшөөрөл','You need permission to leave early.','Эрт явахын тулд зөвшөөрөл хэрэгтэй.','📝'],['polite','эелдэг','Always be polite to guests.','Зочдод үргэлж эелдэг бай.','🙇'],['respect','хүндлэх','Students should respect their teachers.','Сурагчид багшаа хүндлэх ёстой.','🤝'],['cheat','хуурах (шалгалтад)','You mustn\'t cheat in exams.','Шалгалтад хуурч болохгүй.','🙈'],['attendance','ирц','Attendance is checked every morning.','Ирцийг өглөө бүр шалгадаг.','📋'],['absent','тасалсан','Two students are absent today.','Өнөөдөр хоёр сурагч тасалсан.','🪑'],['late','хоцорсон','Don\'t be late again!','Дахиж бүү хоцор!','🐢'],['dress code','хувцаслалтын дүрэм','The office has a strict dress code.','Оффис хатуу хувцаслалтын дүрэмтэй.','👗'],['safety','аюулгүй байдал','Safety is the most important rule.','Аюулгүй байдал хамгийн чухал дүрэм.','🦺'],['helmet','дуулга','You have to wear a helmet on a bike.','Дугуй унахдаа дуулга өмсөх ёстой.','⛑️'],['seat belt','суудлын бүс','Always wear your seat belt.','Үргэлж суудлын бүсээ зүү.','🚗'],['speed limit','хурдны хязгаар','The speed limit here is 60.','Энд хурдны хязгаар 60.','🔢'],['necessary','шаардлагатай','Is it necessary to bring ID?','Иргэний үнэмлэх авчрах шаардлагатай юу?','❗'],['optional','заавал биш','Homework this week is optional.','Энэ долоо хоногийн даалгавар заавал биш.','🆓'],['strict','хатуу','My first teacher was very strict.','Миний анхны багш их хатуу байсан.','🧐'],['fair','шударга','The rules should be fair for everyone.','Дүрэм хүн бүрт шударга байх ёстой.','⚖️'],['behave','биеэ авч явах','The children behaved very well.','Хүүхдүүд маш сайн биеэ авч явсан.','😇'],['bully','дээрэлхэх','Bullying is never acceptable.','Дээрэлхэх нь хэзээ ч зөвшөөрөгдөхгүй.','🚫'],['report','мэдээлэх','Report any problems to your teacher.','Аливаа асуудлыг багшдаа мэдээл.','📣'],['deadline','эцсийн хугацаа','You must meet the deadline.','Эцсийн хугацаанд амжих ёстой.','⏳'],['equipment','тоног төхөөрөмж','Look after the school equipment.','Сургуулийн тоног төхөөрөмжийг гамтай хэрэглэ.','🧰']],
gram:{t:'must, have to, don\'t have to, mustn\'t, should',tm:'must, have to, don\'t have to, mustn\'t, should',
en:'<p><b>must<\/b> / <b>have to<\/b> = it is necessary: You <b>must<\/b> wear a uniform. I <b>have to<\/b> work on Saturday. (have to = a rule from outside; past: <b>had to<\/b>)<\/p><p><b>mustn\'t<\/b> = it is forbidden: You <b>mustn\'t<\/b> use phones in exams.<\/p><p><b>don\'t have to<\/b> = it is NOT necessary (you can choose): You <b>don\'t have to<\/b> come early.<\/p><p><b>should / shouldn\'t<\/b> = advice: You <b>should<\/b> sleep more.<\/p><p><b>can / can\'t<\/b> = permission: You <b>can<\/b> leave at four. You <b>can\'t<\/b> park here.<\/p>',
mn:'<p><b>must<\/b> / <b>have to<\/b> = заавал хийх ёстой: You <b>must<\/b> wear a uniform. Өнгөрсөн цаг: <b>had to<\/b>.<\/p><p><b>mustn\'t<\/b> = хориотой: You <b>mustn\'t<\/b> use phones in exams. (Шалгалтын үеэр утас хэрэглэж болохгүй.)<\/p><p><b>don\'t have to<\/b> = шаардлагагүй, заавал биш: You <b>don\'t have to<\/b> come early. (Эрт ирэх шаардлагагүй.) — mustn\'t-тэй андуурч болохгүй!<\/p><p><b>should<\/b> = зөвлөгөө. <b>can / can\'t<\/b> = зөвшөөрөл.<\/p>',
ex:[['Teachers have to plan every lesson.','Багш нар хичээл бүрээ төлөвлөх ёстой.'],['You mustn\'t talk during the test.','Шалгалтын үеэр ярьж болохгүй.'],['We don\'t have to wear a tie on Fridays.','Баасан гарагт зангиа зүүх шаардлагагүй.'],['When I was a child, I had to walk to school.','Хүүхэд байхдаа би сургууль руугаа алхаж явах шаардлагатай байсан.'],['You should talk to the principal.','Та захиралтай ярих хэрэгтэй.']],
q:[{q:'You ___ smoke in the hospital. It\'s forbidden.',o:['mustn\'t','don\'t have to','should'],a:0},{q:'It\'s Sunday. I ___ get up early.',o:['mustn\'t','don\'t have to','must'],a:1},{q:'Yesterday I ___ stay late at work.',o:['must','had to','have to'],a:1},{q:'Drivers ___ wear a seat belt.',o:['have to','don\'t have to','can'],a:0},{q:'You look tired. You ___ rest.',o:['should','mustn\'t','had to'],a:0},{q:'Students ___ use the library after 6 p.m. It\'s closed.',o:['can','can\'t','have to'],a:1}]},
dl:[{t:'First day at a new school',tm:'Шинэ сургуулийн эхний өдөр',lines:[['A','Welcome! Let me tell you about our rules.','Тавтай морил! Манай дүрмийн талаар хэлье.'],['B','Thank you. Do teachers have to wear a uniform?','Баярлалаа. Багш нар дүрэмт хувцас өмсөх ёстой юу?'],['A','No, you don\'t have to, but you should dress smartly.','Үгүй, шаардлагагүй, гэхдээ цэвэрхэн, албаны хувцас өмсөх хэрэгтэй.'],['B','What time do I have to arrive?','Хэдэн цагт ирэх ёстой вэ?'],['A','You must be here by 7:45. Lessons start at eight.','7:45 гэхэд ирсэн байх ёстой. Хичээл найман цагт эхэлнэ.'],['B','Can students use phones in class?','Сурагчид хичээлийн үеэр утас хэрэглэж болох уу?'],['A','No, they mustn\'t, unless the teacher allows it.','Үгүй, багш зөвшөөрөхгүй л бол болохгүй.']]},
{t:'Rules at home',tm:'Гэрийн дүрэм',lines:[['A','Mum, can I play games tonight?','Ээж ээ, өнөө орой тоглоом тоглож болох уу?'],['B','You can, but you have to finish your homework first.','Болно, гэхдээ эхлээд даалгавраа дуусгах ёстой.'],['A','I finished it at school!','Би сургууль дээрээ дуусгасан!'],['B','Great. But you mustn\'t play after ten o\'clock.','Гоё. Гэхдээ арван цагаас хойш тоглож болохгүй шүү.'],['A','Do I have to wash the dishes too?','Аяга таваг бас угаах ёстой юу?'],['B','No, you don\'t have to tonight. It\'s your sister\'s turn.','Үгүй, өнөө орой шаардлагагүй. Эгчийн чинь ээлж.']]}],
story:{t:'The strict teacher',tm:'Хатуу багш',s:[['When Batsetseg was in grade seven, her maths teacher was very strict.','Батцэцэгийг долдугаар ангид байхад математикийн багш нь их хатуу байжээ.'],['Students had to arrive five minutes early.','Сурагчид таван минутын өмнө ирэх ёстой байв.'],['They mustn\'t talk without raising their hands.','Гараа өргөхгүйгээр ярьж болохгүй байв.'],['Homework was never optional, and late work got zero points.','Гэрийн даалгавар хэзээ ч заавал биш байгаагүй бөгөөд хоцорсон ажил тэг оноо авдаг байв.'],['Many students were afraid of her.','Олон сурагч түүнээс айдаг байв.'],['But she was always fair, and she explained everything clearly.','Гэвч тэр үргэлж шударга, бүх зүйлийг ойлгомжтой тайлбарладаг байв.'],['When Batsetseg failed a test, the teacher stayed after school to help her.','Батцэцэг шалгалтад унахад багш хичээлийн дараа үлдэж түүнд тусалсан.'],['By the end of the year, maths was her favourite subject.','Жилийн эцэс гэхэд математик түүний хамгийн дуртай хичээл болсон.'],['Now Batsetseg is a teacher herself.','Одоо Батцэцэг өөрөө багш болжээ.'],['"You don\'t have to be loud to be strong," she says. "You have to be fair."','«Хүчтэй байхын тулд чанга дуугарах шаардлагагүй. Шударга байх ёстой» гэж тэр хэлдэг.']],
gl:{'raising their hands':'гараа өргөх',optional:'заавал биш',zero:'тэг',afraid:'айдаг',fair:'шударга',clearly:'ойлгомжтой',failed:'унасан (шалгалтад)','by the end of':'… эцэс гэхэд',herself:'өөрөө',loud:'чанга'},
q:[{q:'What did students have to do?',o:['Arrive five minutes early','Wear a hat','Sing every morning'],a:0},{q:'Why did students respect the teacher?',o:['She was fair and explained clearly','She gave no homework','She was funny'],a:0},{q:'What happened by the end of the year?',o:['Maths became her favourite subject','She changed school','She stopped studying'],a:0}]},
speak:[['What are the rules at your school or workplace?','Танай сургууль эсвэл ажлын байрны дүрэм юу вэ?','Teachers have to arrive by 7:45. We must check attendance every lesson. We don\'t have to wear a uniform, but we should dress smartly.'],['Talk about rules you had to follow when you were a child.','Хүүхэд байхдаа дагах ёстой байсан дүрмүүдээ ярь.','When I was a child, I had to help my mother every evening. I couldn\'t watch TV after nine.'],['Should students be allowed to use phones at school? Why?','Сурагчдыг сургуульд утас хэрэглэхийг зөвшөөрөх ёстой юу? Яагаад?','I think they should use phones only for learning, because games and social media can distract them.']]},

{id:19,st:2,t:'Memories and stories',tm:'Дурсамж ба өгүүлэмж',c:'#bc6c25',sc:['📸','Telling stories','Түүх ярихад'],
goal:{en:'Tell stories about the past using the past continuous and past simple.',mn:'Өнгөрсөн үйл явдлыг past continuous ба past simple-ээр өгүүлэх.'},
words:[['memory','дурсамж','I have happy memories of my childhood.','Надад бага насны аз жаргалтай дурсамж бий.','🧠'],['childhood','бага нас','I spent my childhood in Arkhangai.','Би бага насаа Архангайд өнгөрүүлсэн.','🧸'],['suddenly','гэнэт','Suddenly, the lights went out.','Гэнэт гэрэл унтарлаа.','⚡'],['while','… байх үед','While I was cooking, the phone rang.','Намайг хоол хийж байхад утас дуугарсан.','⏳'],['happen','болох','What happened next?','Дараа нь юу болсон бэ?','❓'],['accident','осол','He had a car accident last year.','Тэр өнгөрсөн жил автын осолд орсон.','💥'],['luckily','азаар','Luckily, nobody was hurt.','Азаар хэн ч гэмтээгүй.','🍀'],['unfortunately','харамсалтай нь','Unfortunately, we missed the bus.','Харамсалтай нь бид автобуснаас хоцорсон.','😞'],['finally','эцэст нь','Finally, we arrived home.','Эцэст нь бид гэртээ ирлээ.','🏁'],['at first','эхэндээ','At first, I didn\'t understand.','Эхэндээ би ойлгоогүй.','1️⃣'],['in the end','эцэст нь','In the end, everything was fine.','Эцэст нь бүх зүйл сайн болсон.','🔚'],['storm','шуурга','A storm started in the night.','Шөнө шуурга эхэлсэн.','⛈️'],['shout','хашгирах','Someone shouted for help.','Хэн нэгэн тусламж гуйн хашгирав.','📢'],['notice','анзаарах','I noticed a strange noise.','Би хачин чимээ анзаарав.','👀'],['realise','ойлгох, ухаарах','I realised I had no money.','Мөнгөгүйгээ ухаарав.','💡'],['drop','унагах','She dropped her phone in the water.','Тэр утсаа усанд унагав.','📉'],['fall','унах','I fell off my bike.','Би дугуйнаасаа унасан.','🤕'],['laugh','инээх','We laughed all evening.','Бид орой турш инээлдсэн.','😂'],['cry','уйлах','The baby was crying.','Хүүхэд уйлж байв.','😢'],['embarrassed','ичсэн','I was so embarrassed!','Би маш их ичсэн!','😳'],['surprised','гайхсан','I was surprised to see him.','Түүнийг хараад гайхсан.','😮'],['frightened','айсан','The children were frightened of the dog.','Хүүхдүүд нохойноос айсан.','😱'],['relieved','санаа амарсан','I was relieved when I found my keys.','Түлхүүрээ олоод санаа амарсан.','😮‍💨'],['excited','баяр хөөртэй, догдолсон','We were excited about the trip.','Бид аяллын талаар баяр хөөртэй байсан.','🤩'],['journey','аялал, зорчих зам','The journey took six hours.','Аялал зургаан цаг үргэлжилсэн.','🚂'],['neighbour','хөрш','Our neighbour helped us.','Хөрш маань бидэнд тусалсан.','🏘️'],['stranger','танихгүй хүн','A kind stranger showed us the way.','Нэг эелдэг танихгүй хүн бидэнд зам заасан.','🧍'],['meanwhile','энэ хооронд','Meanwhile, my sister was sleeping.','Энэ хооронд эгч маань унтаж байлаа.','↔️'],['remember','санах','I remember my first day at school.','Сургуулийн эхний өдрөө санаж байна.','🧠'],['forget','мартах','I\'ll never forget that day.','Тэр өдрийг хэзээ ч мартахгүй.','🫥']],
gram:{t:'Past continuous and past simple',tm:'Өнгөрсөн үргэлжилсэн ба өнгөрсөн энгийн цаг',
en:'<p><b>Past continuous<\/b> (was/were + -ing) = an action in progress at a time in the past: At 8 p.m. I <b>was watching<\/b> TV.<\/p><p>Use it for the background, and the <b>past simple<\/b> for the short event that interrupts it: I <b>was walking<\/b> home <b>when<\/b> it <b>started<\/b> to rain.<\/p><p><b>while<\/b> + past continuous: <b>While<\/b> we <b>were eating<\/b>, the lights <b>went<\/b> out.<\/p><p>Story words: at first, then, suddenly, luckily, unfortunately, in the end.<\/p>',
mn:'<p><b>Past continuous<\/b> (was/were + -ing) = өнгөрсөн тодорхой мөчид үргэлжилж байсан үйлдэл: At 8 p.m. I <b>was watching<\/b> TV. (Оройн 8-д би зурагт үзэж байсан.)<\/p><p>Ар талын үйл явдлыг үүгээр, түүнийг тасалдуулсан богино үйлдлийг <b>past simple<\/b>-ээр: I <b>was walking<\/b> home <b>when<\/b> it <b>started<\/b> to rain. (Намайг гэр лүүгээ алхаж явахад бороо орж эхэлсэн.)<\/p><p><b>while<\/b> + past continuous: <b>While<\/b> we <b>were eating<\/b>, the lights <b>went<\/b> out.<\/p>',
ex:[['I was teaching when the fire alarm rang.','Намайг хичээл зааж байхад галын дохио дуугарсан.'],['While she was driving, it started to snow.','Түүнийг машин жолоодож явахад цас орж эхэлсэн.'],['What were you doing at ten last night?','Өчигдөр оройн 10 цагт юу хийж байсан бэ?'],['The sun was shining and the birds were singing.','Нар гийж, шувууд жиргэж байлаа.'],['Suddenly, I heard a loud noise.','Гэнэт би чанга чимээ сонсов.']],
q:[{q:'I ___ dinner when you called.',o:['cooked','was cooking','am cooking'],a:1},{q:'While they were playing, it ___ to rain.',o:['started','was starting','starts'],a:0},{q:'What ___ you doing at 9 p.m.?',o:['did','were','was'],a:1},{q:'She ___ her phone while she was running.',o:['dropped','was dropping','drops'],a:0},{q:'___, nobody was hurt. (good news)',o:['Unfortunately','Luckily','Suddenly'],a:1},{q:'We ___ sleeping when the storm began.',o:['was','were','did'],a:1}]},
dl:[{t:'You won\'t believe what happened!',tm:'Юу болсныг итгэхгүй байх!',lines:[['A','You look tired. What happened?','Ядарсан харагдаж байна. Юу болов?'],['B','I was driving to work when my car stopped in the middle of the road.','Ажил руугаа машинаар явж байтал зам дунд машин зогсчихсон.'],['A','Oh no! What did you do?','Өө яав аа! Тэгээд яасан бэ?'],['B','At first, I didn\'t know what to do. It was snowing and very cold.','Эхэндээ яахаа мэдээгүй. Цас орж, их хүйтэн байсан.'],['A','Did anyone help you?','Хэн нэгэн тусалсан уу?'],['B','Luckily, a kind stranger stopped and called a tow truck.','Азаар нэг эелдэг танихгүй хүн зогсоод чирэх машин дуудаж өгсөн.'],['A','Thank goodness!','Бурхан минь, ямар сайн юм!']]},
{t:'Embarrassing moment',tm:'Ичмээр мөч',lines:[['A','What\'s your most embarrassing moment?','Таны хамгийн ичмээр мөч юу вэ?'],['B','I was giving a presentation at a conference…','Би нэг хурал дээр илтгэл тавьж байлаа…'],['A','And?','Тэгээд?'],['B','While I was speaking, my slides started to play a cartoon!','Намайг ярьж байхад слайд маань хүүхэлдэйн кино тоглуулж эхэлсэн!'],['A','No way! What did people do?','Үгүй ээ! Хүмүүс яасан бэ?'],['B','Everyone laughed. In the end, I laughed too.','Бүгд инээсэн. Эцэст нь би ч бас инээсэн.']]}],
story:{t:'The night of the storm',tm:'Шуургатай шөнө',s:[['It was January, and the Damdin family was sleeping in their ger in the countryside.','Нэгдүгээр сар байлаа. Дамдины гэр бүл хөдөө гэртээ унтаж байв.'],['Outside, the wind was blowing hard and snow was falling.','Гадаа салхи хүчтэй салхилж, цас орж байв.'],['At about two o\'clock, the father heard a strange noise.','Хоёр цагийн үед аав нь хачин чимээ сонсов.'],['He went outside with a torch and realised that the sheep were missing.','Тэр гар чийдэн бариад гараад хонь алга болсныг ухаарав.'],['While his wife was waking the children, he got on his horse.','Эхнэр нь хүүхдүүдээ сэрээж байх хооронд тэр морь унав.'],['He rode for an hour, but he couldn\'t see anything.','Тэр нэг цаг давхисан ч юу ч харсангүй.'],['He was starting to lose hope when he noticed a dark shape near the hill.','Итгэл алдарч эхлэх үед тэр толгодын дэргэд бараан дүрс анзаарав.'],['It was his sheep! They were standing close together behind some rocks.','Энэ бол түүний хонь байв! Тэд хадны ард бөөгнөрөн зогсож байлаа.'],['Slowly, he brought them home through the snow.','Тэр тэднийг цасан дундуур аажмаар гэрт нь авчрав.'],['In the morning, the whole family was tired but very relieved.','Өглөө нь бүхэл гэр бүл ядарсан ч санаа их амарсан байв.']],
gl:{blowing:'салхилж',torch:'гар чийдэн',missing:'алга болсон','waking':'сэрээж','lose hope':'итгэл алдах',shape:'дүрс',hill:'толгод',rocks:'хад',through:'дундуур',whole:'бүхэл'},
q:[{q:'What was the weather like?',o:['Windy and snowy','Hot and sunny','Rainy'],a:0},{q:'What was missing?',o:['The horses','The sheep','The children'],a:1},{q:'Where were the sheep?',o:['Behind some rocks','In the river','In the ger'],a:0}]},
speak:[['Tell a story about a day when something went wrong. Use: was …-ing when…','Нэг зүйл буруу болсон өдрийн тухай ярь. «was …-ing when…» ашигла.','I was preparing for an open lesson when the projector stopped working. Luckily, a colleague lent me her laptop.'],['What is your earliest childhood memory?','Таны хамгийн анхны бага насны дурсамж юу вэ?','My earliest memory is when I was riding a horse with my grandfather. The sun was setting and he was singing.'],['Describe a time when you felt very relieved.','Санаа их амарсан нэг мөчөө тайлбарла.','I felt relieved when my son passed his exam. He was studying every night for weeks.']]},

{id:20,st:2,t:'Free time and hobbies',tm:'Чөлөөт цаг ба хобби',c:'#ff9f1c',sc:['🎨','In your free time','Чөлөөт цагаараа'],
goal:{en:'Talk about hobbies and preferences using gerunds and infinitives.',mn:'Хобби, дуртай зүйлээ gerund ба infinitive хэрэглэн ярих.'},
words:[['hobby','хобби','Photography is my favourite hobby.','Гэрэл зураг бол миний хамгийн дуртай хобби.','🎯'],['photography','гэрэл зураг авах','She\'s really into photography.','Тэр гэрэл зурагт их сонирхолтой.','📷'],['knitting','сүлжих','My grandmother taught me knitting.','Эмээ маань надад сүлжмэл заасан.','🧶'],['hiking','явган аялал','We go hiking every summer.','Бид зун бүр явган аялалд явдаг.','🥾'],['camping','майхантай аялал','Camping by the lake is so relaxing.','Нуурын эрэг дээр майхантай буух их тайвшруулдаг.','🏕️'],['gardening','цэцэрлэгжүүлэлт','Gardening helps me relax.','Цэцэрлэгжүүлэлт намайг тайвшруулдаг.','🌻'],['board game','ширээний тоглоом','We play board games on Fridays.','Бид Баасан гарагт ширээний тоглоом тоглодог.','🎲'],['chess','шатар','My son is good at chess.','Хүү маань шатар сайн тоглодог.','♟️'],['instrument','хөгжмийн зэмсэг','Do you play an instrument?','Та хөгжмийн зэмсэг тоглодог уу?','🎻'],['guitar','гитар','I\'m learning to play the guitar.','Би гитар тоглож сурч байна.','🎸'],['podcast','подкаст','I listen to podcasts on the bus.','Би автобусанд подкаст сонсдог.','🎧'],['series','цуврал','I\'m watching a Korean series.','Би Солонгос цуврал үзэж байна.','📺'],['gym','фитнес','I go to the gym twice a week.','Би долоо хоногт хоёр удаа фитнест явдаг.','🏋️'],['yoga','иог','Yoga is good for your back.','Иог нуруунд сайн.','🧘'],['be into','сонирхох, дурлах','I\'m really into cooking.','Би хоол хийхэд их дуртай.','😍'],['keen on','их сонирхолтой','He\'s keen on football.','Тэр хөлбөмбөгт их сонирхолтой.','⚽'],['can\'t stand','огт тэвчихгүй','I can\'t stand horror films.','Би аймшгийн кинонд огт тэвчдэггүй.','😖'],['prefer','илүүд үзэх','I prefer reading to watching TV.','Би зурагт үзэхээс илүү уншихыг илүүд үздэг.','👍'],['relaxing','тайвшруулдаг','Fishing is very relaxing.','Загасчлах их тайвшруулдаг.','😌'],['challenging','сорилттой','Rock climbing is challenging.','Хаданд авирах сорилттой.','🧗'],['club','клуб, дугуйлан','I joined a book club.','Би номын клубт элссэн.','📚'],['member','гишүүн','She\'s a member of a choir.','Тэр найрал дууны гишүүн.','🪪'],['take up','эхлэх (хобби)','I\'ve taken up swimming.','Би усанд сэлэх хичээллэж эхэлсэн.','🏊'],['give up','орхих, болих','He gave up playing the piano.','Тэр төгөлдөр хуур тоглохоо больсон.','🏳️'],['spare time','сул цаг','What do you do in your spare time?','Сул цагаараа юу хийдэг вэ?','🕰️'],['collect','цуглуулах','My son collects stamps.','Хүү маань марк цуглуулдаг.','📬'],['bake','жигнэх','I bake bread at the weekend.','Би амралтын өдрөөр талх жигнэдэг.','🥖'],['draw','зурах','My daughter loves drawing.','Охин маань зурах их дуртай.','✏️'],['handmade','гар хийцийн','She sells handmade bags.','Тэр гар хийцийн цүнх зардаг.','🧵'],['enjoyable','таатай, сайхан','It was an enjoyable evening.','Таатай орой байлаа.','😊']],
gram:{t:'Verb + -ing or to + verb',tm:'Үйл үг + -ing эсвэл to + үйл үг',
en:'<p>After some verbs we use <b>-ing<\/b>: enjoy, like, love, hate, don\'t mind, can\'t stand, finish, give up, keep, suggest: I <b>enjoy cooking<\/b>. She <b>gave up smoking<\/b>.<\/p><p>After others we use <b>to + verb<\/b>: want, would like, hope, decide, plan, learn, need, promise, try: I <b>want to learn<\/b> the guitar. We <b>decided to go<\/b> hiking.<\/p><p>After prepositions always <b>-ing<\/b>: I\'m good <b>at drawing<\/b>. I\'m interested <b>in learning<\/b> Korean.<\/p><p>-ing as a subject: <b>Swimming<\/b> is good exercise.<\/p>',
mn:'<p>Зарим үйл үгийн дараа <b>-ing<\/b>: enjoy, like, love, hate, don\'t mind, can\'t stand, finish, give up: I <b>enjoy cooking<\/b>. (Би хоол хийх дуртай.)<\/p><p>Заримынх нь дараа <b>to + үйл үг<\/b>: want, would like, hope, decide, plan, learn, need: I <b>want to learn<\/b> the guitar. (Гитар сурмаар байна.)<\/p><p>Угтвар үгийн дараа үргэлж <b>-ing<\/b>: I\'m good <b>at drawing<\/b>. I\'m interested <b>in learning<\/b> Korean.<\/p><p>-ing өгүүлэгдэхүүн болно: <b>Swimming<\/b> is good exercise. (Усанд сэлэх бол сайн дасгал.)<\/p>',
ex:[['I love reading in bed.','Би орондоо хэвтээд унших дуртай.'],['She wants to learn yoga.','Тэр иог сурмаар байна.'],['We decided to take up hiking.','Бид явган аялал хийж эхлэхээр шийдсэн.'],['I can\'t stand waiting in traffic.','Би түгжрэлд хүлээхийг огт тэвчдэггүй.'],['He\'s interested in taking photos.','Тэр зураг авах сонирхолтой.']],

dl:[{t:'What do you do for fun?',tm:'Юугаар зугаацдаг вэ?',lines:[['A','What do you like doing in your spare time?','Сул цагаараа юу хийх дуртай вэ?'],['B','I\'m really into photography. I love taking photos of nature.','Би гэрэл зурагт их дуртай. Байгалийн зураг авах дуртай.'],['A','That sounds great. Where do you go?','Гоё юм. Хаашаа явдаг вэ?'],['B','Usually to Terelj. And you? Do you have any hobbies?','Ихэвчлэн Тэрэлж. Чи яадаг вэ? Хоббитой юу?'],['A','I\'ve just taken up yoga. I want to be more flexible.','Би дөнгөж иог эхэлсэн. Илүү уян хатан болмоор байна.'],['B','Good for you! I can\'t stand sitting still, so yoga isn\'t for me.','Сайн байна! Би хөдөлгөөнгүй суухыг тэвчдэггүй болохоор иог надад тохирохгүй.']]},
{t:'Joining a club',tm:'Клубт элсэх',lines:[['A','Hi, I\'d like to join the English conversation club.','Сайн байна уу, англи хэлний ярианы клубт элсмээр байна.'],['B','Great! When are you free to come?','Гоё! Хэзээ ирэх боломжтой вэ?'],['A','I finish working at five, so evenings are best.','Таван цагт ажлаа тардаг тул орой хамгийн тохиромжтой.'],['B','We meet on Tuesdays at six thirty. Do you mind speaking in front of a group?','Бид мягмар гарагт 18:30-д уулздаг. Бүлгийн өмнө ярихад дургүйцэх үү?'],['A','I\'m a bit nervous, but I want to practise.','Жаахан сандардаг ч дадлага хиймээр байна.'],['B','Don\'t worry. Everyone is friendly. We\'re looking forward to meeting you!','Бүү санаа зов. Бүгд найрсаг. Тантай уулзахыг тэсэн ядан хүлээж байна!']]}],
story:{t:'The book club',tm:'Номын клуб',s:[['Last year, Nomin felt bored after work.','Өнгөрсөн жил Номин ажлын дараа уйддаг байв.'],['She spent every evening watching series on her phone.','Тэр орой бүр утсаараа цуврал үзэж өнгөрүүлдэг байв.'],['One day, she saw a poster for a book club at the library.','Нэг өдөр тэр номын сан дахь номын клубын зар харав.'],['She decided to go, although she was nervous about meeting new people.','Шинэ хүмүүстэй уулзахаас сандарч байсан ч тэр очихоор шийдэв.'],['The members were friendly, and they enjoyed talking about stories.','Гишүүд нь найрсаг байсан бөгөөд түүх ярилцах дуртай байв.'],['Every month, they choose one book and meet to discuss it.','Сар бүр тэд нэг ном сонгоод уулзаж хэлэлцдэг.'],['Nomin started reading on the bus instead of scrolling on her phone.','Номин утсаа гүйлгэхийн оронд автобусанд ном уншиж эхлэв.'],['Now she has read twenty books, and she has made five new friends.','Одоо тэр хорин ном уншиж, таван шинэ найзтай болжээ.'],['Next month, she is planning to read her first book in English.','Ирэх сард тэр анхны англи номоо уншихаар төлөвлөж байна.'],['"Taking up a hobby changed my life," she says.','«Хобби эхлүүлсэн нь миний амьдралыг өөрчилсөн» гэж тэр хэлдэг.']],

words:[['invent','зохион бүтээх','The telephone was invented in 1876.','Утсыг 1876 онд зохион бүтээсэн.','💡'],['invention','шинэ бүтээл','The internet is a great invention.','Интернэт бол агуу шинэ бүтээл.','🧪'],['inventor','зохион бүтээгч','Who was the inventor of the light bulb?','Гэрлийн чийдэнг хэн зохион бүтээсэн бэ?','👨‍🔬'],['discover','нээх','Penicillin was discovered by accident.','Пенициллиныг санамсаргүй нээсэн.','🔬'],['develop','хөгжүүлэх','The app was developed by students.','Аппыг сурагчид хөгжүүлсэн.','🛠️'],['produce','үйлдвэрлэх','Cashmere is produced in Mongolia.','Ноолуурыг Монголд үйлдвэрлэдэг.','🏭'],['factory','үйлдвэр','The factory employs 500 workers.','Үйлдвэр 500 ажилтантай.','🏗️'],['machine','машин, төхөөрөмж','This machine makes bottles.','Энэ төхөөрөмж сав хийдэг.','⚙️'],['device','төхөөрөмж','Smartphones are useful devices.','Ухаалаг утас бол хэрэгтэй төхөөрөмж.','📱'],['artificial intelligence','хиймэл оюун ухаан','Artificial intelligence is used in many apps.','Хиймэл оюун ухааныг олон аппад ашигладаг.','🤖'],['data','өгөгдөл','The data is stored in the cloud.','Өгөгдлийг үүлэн санд хадгалдаг.','📊'],['software','програм хангамж','The software is updated every month.','Програм хангамжийг сар бүр шинэчилдэг.','💾'],['electricity','цахилгаан','Electricity is produced from coal here.','Энд цахилгааныг нүүрснээс үйлдвэрлэдэг.','⚡'],['battery','батарей','The battery lasts all day.','Батарей бүтэн өдөр барьдаг.','🔋'],['screen','дэлгэц','The screen is made of glass.','Дэлгэц шилээр хийгдсэн.','🖥️'],['wireless','утасгүй','Wireless headphones are popular.','Утасгүй чихэвч түгээмэл.','📶'],['invented by','… -аар зохион бүтээгдсэн','The web was invented by Tim Berners-Lee.','Вэбийг Тим Бернерс-Ли зохион бүтээсэн.','✍️'],['made of','… -аар хийгдсэн','The ger is made of wood and felt.','Гэр модон хийц, эсгийгээр хийгдсэн.','🧱'],['used for','… -д ашиглагддаг','Drones are used for delivery.','Дроныг хүргэлтэд ашигладаг.','🚁'],['robot','робот','Robots are used in car factories.','Автомашины үйлдвэрт робот ашигладаг.','🤖'],['3D printer','3D хэвлэгч','The model was made with a 3D printer.','Загварыг 3D хэвлэгчээр хийсэн.','🖨️'],['space','сансар','The first satellite was sent into space in 1957.','Анхны хиймэл дагуулыг 1957 онд сансарт хөөргөсөн.','🚀'],['satellite','хиймэл дагуул','GPS uses satellites.','GPS хиймэл дагуул ашигладаг.','🛰️'],['engineer','инженер','Engineers designed the bridge.','Инженерүүд гүүрийг зохион бүтээсэн.','👷'],['design','зохион бүтээх; загвар','The logo was designed by a student.','Логог нэг сурагч зохиосон.','🎨'],['useful','хэрэгтэй','This tool is very useful.','Энэ хэрэгсэл их хэрэгтэй.','🧰'],['useless','хэрэггүй','My old phone is useless now.','Хуучин утас маань одоо хэрэггүй болсон.','🗑️'],['affect','нөлөөлөх','Technology affects how we learn.','Технологи бидний суралцах арга барилд нөлөөлдөг.','🔀'],['replace','орлох','Will robots replace teachers?','Робот багш нарыг орлох уу?','🔄'],['century','зуун','Cars were invented in the 19th century.','Машиныг 19-р зуунд зохион бүтээсэн.','💯']],
gram:{t:'The passive: is made / was invented',tm:'Идэвхгүй хэв: is made / was invented',
en:'<p>Use the <b>passive<\/b> when the action is more important than who did it.<\/p><p>Present: <b>am/is/are + past participle<\/b>: Cashmere <b>is produced<\/b> in Mongolia.<\/p><p>Past: <b>was/were + past participle<\/b>: The telephone <b>was invented<\/b> in 1876.<\/p><p>Add <b>by<\/b> to say who: The web was invented <b>by<\/b> Tim Berners-Lee.<\/p><p>Active: Students <b>developed<\/b> the app. → Passive: The app <b>was developed<\/b> by students.<\/p>',
mn:'<p>Хэн хийсэн гэхээсээ илүү юу болсон нь чухал үед <b>идэвхгүй хэв<\/b>-ийг хэрэглэнэ.<\/p><p>Одоо: <b>am/is/are + 3-р хэлбэр<\/b>: Cashmere <b>is produced<\/b> in Mongolia. (Ноолуурыг Монголд үйлдвэрлэдэг.)<\/p><p>Өнгөрсөн: <b>was/were + 3-р хэлбэр<\/b>: The telephone <b>was invented<\/b> in 1876. (Утсыг 1876 онд зохион бүтээсэн.)<\/p><p>Хэн хийснийг <b>by<\/b>-аар: … <b>by<\/b> Tim Berners-Lee.<\/p>',

dl:[{t:'At the science museum',tm:'Шинжлэх ухааны музейд',lines:[['A','Look at this old phone! When was it made?','Энэ хуучин утсыг хар! Хэзээ хийсэн юм бол?'],['B','In 1920. Phones were much bigger then.','1920 онд. Тэр үед утас хамаагүй том байсан.'],['A','And what\'s that machine?','Тэр төхөөрөмж юу вэ?'],['B','It\'s one of the first computers. It was used for calculations.','Анхны компьютеруудын нэг. Тооцоо хийхэд ашигладаг байсан.'],['A','It\'s huge! Now computers are carried in our pockets.','Асар том юм! Одоо компьютерыг халаасандаа авч явдаг болсон.'],['B','Exactly. Technology has changed so much.','Яг тийм. Технологи их өөрчлөгдсөн.']]},
{t:'AI in the classroom',tm:'Ангид хиймэл оюун ухаан',lines:[['A','Do you use artificial intelligence in your lessons?','Та хичээлдээ хиймэл оюун ухаан ашигладаг уу?'],['B','Sometimes. My worksheets are checked faster with AI.','Заримдаа. Ажлын хуудсыг хиймэл оюун ухаанаар илүү хурдан шалгадаг.'],['A','Do you think teachers will be replaced by robots?','Багш нарыг робот орлоно гэж бодож байна уу?'],['B','No. Students need people who care about them.','Үгүй. Сурагчдад тэдний төлөө санаа тавьдаг хүн хэрэгтэй.'],['A','I agree. AI is a tool, not a teacher.','Санал нэг байна. Хиймэл оюун ухаан бол багш биш, хэрэгсэл.']]}],
story:{t:'The ger that travels',tm:'Нүүдэг гэр',s:[['The Mongolian ger is one of the oldest inventions in Central Asia.','Монгол гэр бол Төв Азийн хамгийн эртний бүтээлүүдийн нэг.'],['It has been used by nomads for more than two thousand years.','Нүүдэлчид түүнийг хоёр мянга гаруй жил ашиглаж ирсэн.'],['A ger is made of a wooden frame, felt and canvas.','Гэр модон хана, эсгий, бүрээсээр хийгддэг.'],['It can be built in about two hours by three or four people.','Гурав, дөрвөн хүн хоёр цаг орчимд барьж чадна.'],['The round shape is very strong, so it is not damaged by strong winds.','Дугуй хэлбэр нь маш бат бөх тул хүчтэй салхинд эвдэрдэггүй.'],['In winter, it is heated by a stove in the centre.','Өвөл төвд нь байрлах зуухаар халаадаг.'],['Today, some gers are equipped with solar panels and satellite TV.','Өнөөдөр зарим гэрийг нарны хавтан, сансрын телевизээр тоноглосон байдаг.'],['Gers are even sold abroad as holiday homes.','Гэрийг бүр гадаадад амралтын байшин болгон зардаг.'],['Engineers study the ger because it is so simple and smart.','Инженерүүд гэрийг маш энгийн бөгөөд ухаалаг учраас судалдаг.'],['It is a perfect example of design that is made for nature.','Энэ бол байгальд зориулсан дизайны төгс жишээ юм.']],

speak:[['Describe a useful invention. When was it invented and how is it used?','Хэрэгтэй нэг шинэ бүтээлийг тайлбарла. Хэзээ зохион бүтээгдсэн, хэрхэн ашигладаг вэ?','The smartphone is a very useful invention. The first iPhone was released in 2007. Today it is used for work, study and talking to family.'],['How is technology used at your school?','Танай сургуульд технологийг хэрхэн ашигладаг вэ?','Projectors are used in every classroom. Homework is uploaded to our website, and grades are recorded online.'],['Will robots replace people at work? Give your opinion.','Робот хүмүүсийг ажил дээр орлох уу? Санал бодлоо хэл.','I think some jobs will be replaced, especially in factories. But jobs that need care and creativity will stay.']]},

{id:22,st:2,t:'People and personalities',tm:'Хүмүүс ба зан чанар',c:'#ef476f',sc:['🧑‍🤝‍🧑','Describing people','Хүнийг тодорхойлоход'],
goal:{en:'Describe people\'s appearance and personality using relative clauses.',mn:'Хүний гадаад төрх, зан чанарыг холбоос өгүүлбэрээр тайлбарлах.'},
words:[['personality','зан чанар','She has a warm personality.','Тэр дулаахан зан чанартай.','🧠'],['appearance','гадаад төрх','Don\'t judge people by their appearance.','Хүнийг гадаад төрхөөр нь бүү дүгнэ.','👤'],['friendly','найрсаг','Our neighbours are very friendly.','Хөршүүд маань их найрсаг.','😊'],['kind','сайхан сэтгэлтэй','He\'s the kindest person I know.','Тэр бол миний мэдэх хамгийн сайхан сэтгэлтэй хүн.','💗'],['honest','шударга, үнэнч','I trust her because she\'s honest.','Тэр шударга тул би түүнд итгэдэг.','🤞'],['patient','тэвчээртэй','Teachers need to be patient.','Багш нар тэвчээртэй байх хэрэгтэй.','⏳'],['generous','өгөөмөр','My grandfather was very generous.','Өвөө маань их өгөөмөр байсан.','🎁'],['shy','ичимхий','He was shy as a child.','Тэр хүүхэд байхдаа ичимхий байсан.','🙈'],['confident','өөртөө итгэлтэй','She is a confident speaker.','Тэр өөртөө итгэлтэй илтгэгч.','😎'],['hard-working','хөдөлмөрч','Mongolian herders are hard-working.','Монгол малчид хөдөлмөрч.','💪'],['lazy','залхуу','Don\'t be lazy — do your homework!','Бүү залхуур — даалгавраа хий!','🦥'],['funny','хөгжилтэй','My brother is really funny.','Ах маань их хөгжилтэй.','😂'],['serious','нухацтай','He looks serious, but he\'s nice.','Тэр нухацтай харагддаг ч сайн хүн.','😐'],['creative','бүтээлч','Artists are creative people.','Уран бүтээлчид бүтээлч хүмүүс.','🎨'],['reliable','найдвартай','I need a reliable colleague.','Надад найдвартай хамт ажиллагч хэрэгтэй.','🧱'],['selfish','хувиа хичээсэн','It\'s selfish to take the last piece.','Сүүлчийн хэсгийг авах хувиа хичээсэн хэрэг.','🙄'],['curious','сониуч','Children are naturally curious.','Хүүхдүүд угаасаа сониуч.','🧐'],['calm','тайван','She stays calm in difficult situations.','Тэр хэцүү нөхцөлд тайван байдаг.','😌'],['tall','өндөр','My son is taller than me now.','Хүү маань одоо надаас өндөр.','📏'],['short','намхан; богино','She has short hair.','Тэр богино үстэй.','✂️'],['curly','буржгар','The girl with curly hair is my niece.','Буржгар үстэй охин миний зээ.','➰'],['beard','сахал','My father has a grey beard.','Аав маань буурал сахалтай.','🧔'],['glasses','нүдний шил','The man who is wearing glasses is our principal.','Нүдний шил зүүсэн эр бол манай захирал.','👓'],['in his forties','40 гаруй настай','He\'s in his forties.','Тэр 40 гаруй настай.','🔢'],['look like','… шиг харагдах','You look like your mother.','Чи ээж шигээ харагддаг.','🪞'],['get on with','эвтэй байх','I get on well with my colleagues.','Би хамт ажиллагсадтайгаа сайн эвтэй.','🤝'],['role model','үлгэр дуурайл','My first teacher is my role model.','Анхны багш маань миний үлгэр дуурайл.','🌟'],['admire','бахдах','I admire people who never give up.','Би хэзээ ч бууж өгдөггүй хүмүүсийг бахддаг.','👏'],['character','зан төлөв','She has a strong character.','Тэр хүчтэй зан төлөвтэй.','🧩'],['trust','итгэх','You can trust him.','Та түүнд итгэж болно.','🔐']],
gram:{t:'Relative clauses: who, which, that, where',tm:'Холбоос өгүүлбэр: who, which, that, where',
en:'<p>Use relative clauses to add information about a noun.<\/p><p><b>who<\/b> for people: My sister is the woman <b>who<\/b> is wearing a red dress.<\/p><p><b>which<\/b> for things: This is the app <b>which<\/b> helps me learn English.<\/p><p><b>that<\/b> for people or things (informal): The book <b>that<\/b> I bought is great.<\/p><p><b>where<\/b> for places: This is the school <b>where<\/b> I work.<\/p><p><b>whose<\/b> for possession: He\'s the student <b>whose<\/b> robot won.<\/p>',
mn:'<p>Нэр үгийн талаар нэмэлт мэдээлэл өгөхдөө холбоос өгүүлбэр ашиглана.<\/p><p><b>who<\/b> — хүн: the woman <b>who<\/b> is wearing a red dress (улаан даашинз өмссөн эмэгтэй).<\/p><p><b>which<\/b> — юм: the app <b>which<\/b> helps me (надад тусалдаг апп).<\/p><p><b>that<\/b> — хүн, юм аль алинд (ярианы).<\/p><p><b>where<\/b> — газар: the school <b>where<\/b> I work (миний ажилладаг сургууль).<\/p><p><b>whose<\/b> — хэний: the student <b>whose<\/b> robot won (роботоо түрүүлүүлсэн сурагч).<\/p>',
ex:[['A teacher is a person who helps people learn.','Багш бол хүмүүст суралцахад тусалдаг хүн.'],['This is the café where we first met.','Энэ бол бидний анх танилцсан кафе.'],['I have a friend whose father is a pilot.','Надад аав нь нисгэгч найз бий.'],['The phone which I bought last year is broken.','Өнгөрсөн жил авсан утас маань эвдэрсэн.'],['She\'s the woman that I admire most.','Тэр бол миний хамгийн их бахддаг эмэгтэй.']],

dl:[{t:'Who\'s that?',tm:'Тэр хэн бэ?',lines:[['A','Who\'s the man who\'s talking to the principal?','Захиралтай ярьж байгаа эр хэн бэ?'],['B','The one with glasses? That\'s Mr. Ganbold, the new maths teacher.','Нүдний шилтэй нь уу? Тэр бол шинэ математикийн багш Ганболд.'],['A','What\'s he like?','Тэр ямар хүн бэ?'],['B','He\'s calm and very patient. The students who have him love his lessons.','Тайван, их тэвчээртэй. Түүнээр хичээл заалгадаг сурагчид хичээлд нь их дуртай.'],['A','And who is the woman whose bag is on my chair?','Миний сандал дээр цүнх нь байгаа эмэгтэй хэн бэ?'],['B','Oh, that\'s Oyuna. She\'s really funny — you\'ll get on well with her.','Өө, тэр Оюуна. Их хөгжилтэй — та хоёр эвтэй байх болно.']]},
{t:'My role model',tm:'Миний үлгэр дуурайл',lines:[['A','Who do you admire most?','Чи хэнийг хамгийн их бахддаг вэ?'],['B','My grandmother. She\'s the person who taught me to be strong.','Эмээгээ. Тэр бол надад хүчтэй байхыг сургасан хүн.'],['A','What is she like?','Тэр ямар хүн бэ?'],['B','She\'s generous and honest, and she never complains.','Өгөөмөр, шударга, хэзээ ч гомдоллодоггүй.'],['A','She sounds amazing.','Гайхалтай хүн юм.'],['B','She is. She raised six children in the countryside.','Тийм ээ. Тэр хөдөө зургаан хүүхэд өсгөсөн.']]}],
story:{t:'The new neighbour',tm:'Шинэ хөрш',s:[['When the Batbayar family moved into their new apartment, they felt nervous.','Батбаярын гэр бүл шинэ байрандаа нүүж ороход сандарсан.'],['They didn\'t know anyone in the building.','Тэд байранд хэнийг ч танихгүй байв.'],['On the first evening, someone knocked on the door.','Эхний орой хэн нэгэн хаалга тогшив.'],['It was an old woman who lived next door.','Энэ бол хажуугийн айлд амьдардаг хөгшин эмэгтэй байв.'],['She had grey hair, bright eyes and a smile that made everyone relax.','Тэр буурал үстэй, гэрэлтсэн нүдтэй, бүгдийг тайвшруулдаг инээмсэглэлтэй байлаа.'],['She was carrying a plate of fresh buuz which she had made herself.','Тэр өөрөө хийсэн шинэхэн буузтай таваг барьж байв.'],['"Welcome! I\'m Dolgor. If you need anything, just ask," she said.','«Тавтай морил! Би Долгор. Юу хэрэгтэй байвал асуугаарай» гэв.'],['Over the next months, she became the person who the children loved most.','Дараагийн хэдэн сард тэр хүүхдүүдийн хамгийн их хайрладаг хүн болжээ.'],['She told them stories, helped them with Mongolian script and taught them to knit.','Тэр тэдэнд үлгэр ярьж, монгол бичигт тусалж, сүлжмэл заажээ.'],['Now the building is a place where neighbours really care about each other.','Одоо тэр байр хөршүүд бие биедээ үнэхээр санаа тавьдаг газар болжээ.']],

speak:[['Describe a person you admire: appearance, personality and why.','Бахддаг хүнээ тайлбарла: гадаад төрх, зан чанар, яагаад.','I admire my mother. She is a short woman with kind eyes. She is patient and hard-working, and she always helps people who need it.'],['Describe yourself: what kind of person are you?','Өөрийгөө тайлбарла: та ямар хүн бэ?','I think I am creative and hard-working, but sometimes I am a bit shy with new people.'],['What qualities make a good friend?','Сайн найзад ямар чанар хэрэгтэй вэ?','A good friend is someone who is honest and reliable, and who listens to you.']]},

{id:23,st:2,t:'Money and dreams',tm:'Мөнгө ба мөрөөдөл',c:'#80b918',sc:['💰','Money matters','Мөнгөний асуудал'],
goal:{en:'Talk about money and imaginary situations using the second conditional.',mn:'Мөнгө болон төсөөллийн нөхцөлийг хоёрдугаар нөхцөлөөр ярих.'},
words:[['save','хадгалах (мөнгө)','I save some money every month.','Би сар бүр мөнгө хуримтлуулдаг.','🐷'],['spend','зарцуулах','How much do you spend on food?','Хоолонд хэдэн төгрөг зарцуулдаг вэ?','💸'],['budget','төсөв','We need a family budget.','Бидэнд гэр бүлийн төсөв хэрэгтэй.','📒'],['afford','хүрэлцэх (мөнгө)','I can\'t afford a new car.','Би шинэ машин авах мөнгөгүй.','🤷'],['loan','зээл','They took a loan to buy a flat.','Тэд байр авахаар зээл авсан.','🏦'],['borrow','зээлэх (авах)','Can I borrow some money?','Жаахан мөнгө зээлж болох уу?','🤲'],['lend','зээлдүүлэх','I lent my friend 50,000 tugriks.','Би найздаа 50,000 төгрөг зээлдүүлсэн.','🫴'],['owe','өртэй байх','I owe you a coffee.','Би чамд нэг кофены өртэй.','🧾'],['debt','өр','He paid off all his debts.','Тэр бүх өрөө төлж барагдуулсан.','📉'],['income','орлого','Teachers have a stable income.','Багш нар тогтвортой орлоготой.','📈'],['rent','түрээс','The rent is too high.','Түрээс хэтэрхий өндөр.','🏠'],['bill','төлбөр','I pay the electricity bill online.','Би цахилгааны төлбөрөө онлайнаар төлдөг.','🧾'],['account','данс','I opened a savings account.','Би хадгаламжийн данс нээсэн.','🏧'],['invest','хөрөнгө оруулах','She invested in a small business.','Тэр жижиг бизнест хөрөнгө оруулсан.','📊'],['rich','баян','If I were rich, I would travel the world.','Хэрэв баян бол дэлхийг тойрон аялах байсан.','🤑'],['poor','ядуу','Many poor families need help in winter.','Олон ядуу айл өвөл тусламж хэрэгтэй.','🥺'],['charity','буяны байгууллага','We donated clothes to a charity.','Бид хувцсаа буяны байгууллагад хандивласан.','🤝'],['donate','хандивлах','I donate to a children\'s hospital.','Би хүүхдийн эмнэлэгт хандивладаг.','💝'],['lottery','сугалаа','What would you do if you won the lottery?','Сугалаанд хожвол юу хийх байсан бэ?','🎟️'],['wish','хүсэх','I wish I had more free time.','Илүү их чөлөөт цагтай байгаасай.','🌠'],['imagine','төсөөлөх','Imagine you had a million dollars.','Сая доллартай гэж төсөөл.','💭'],['luxury','тансаг','A luxury hotel costs a lot.','Тансаг зочид буудал их үнэтэй.','💎'],['necessary','зайлшгүй','Food and housing are necessary.','Хоол, орон байр зайлшгүй хэрэгтэй.','❗'],['price','үнэ','Prices go up every year.','Үнэ жил бүр өсдөг.','🏷️'],['bargain','хямд авсан зүйл','This coat was a real bargain.','Энэ пальто үнэхээр хямд олдсон.','🎯'],['waste of money','мөнгө үрэх','That phone was a waste of money.','Тэр утас мөнгө үрсэн хэрэг байлаа.','🗑️'],['worth','үнэ цэнэтэй','The trip was worth every tugrik.','Аялал төгрөг бүрийн үнэ цэнэтэй байсан.','✨'],['pocket money','халаасны мөнгө','My son gets pocket money every week.','Хүү маань долоо хоног бүр халаасны мөнгө авдаг.','👛'],['cost of living','амьжиргааны өртөг','The cost of living is rising.','Амьжиргааны өртөг өсөж байна.','📊'],['financial','санхүүгийн','Financial planning is important.','Санхүүгийн төлөвлөлт чухал.','🧮']],
gram:{t:'Second conditional: if + past, would',tm:'Хоёрдугаар нөхцөл: if + өнгөрсөн цаг, would',
en:'<p>Use the <b>second conditional<\/b> for imaginary or unlikely situations: <b>If<\/b> + past simple, <b>would<\/b> + verb.<\/p><p><b>If<\/b> I <b>won<\/b> the lottery, I <b>would buy<\/b> a house.<\/p><p>With <b>be<\/b>, use <b>were<\/b> for all persons: <b>If I were<\/b> you, I would save more.<\/p><p>Compare: If I <b>have<\/b> time, I <b>will<\/b> help (real, possible). If I <b>had<\/b> time, I <b>would<\/b> help (imaginary — I don\'t have time).<\/p><p><b>I wish<\/b> + past: I wish I <b>had<\/b> a bigger flat.<\/p>',
mn:'<p>Төсөөллийн эсвэл болох магадлал багатай нөхцөлийг <b>хоёрдугаар нөхцөл<\/b>-өөр хэлнэ: <b>If<\/b> + өнгөрсөн энгийн цаг, <b>would<\/b> + үйл үг.<\/p><p><b>If<\/b> I <b>won<\/b> the lottery, I <b>would buy<\/b> a house. (Сугалаанд хожвол байшин авах байсан.)<\/p><p><b>be<\/b>-тэй бол бүх биед <b>were<\/b>: <b>If I were<\/b> you, … (Би чиний оронд байсан бол …)<\/p><p>Харьцуул: If I <b>have<\/b> time, I <b>will<\/b> help (бодит). If I <b>had<\/b> time, I <b>would<\/b> help (төсөөлөл — цаг байхгүй).<\/p>',
ex:[['If I had more money, I would travel to Europe.','Илүү их мөнгөтэй бол Европ руу аялах байсан.'],['If I were you, I would open a savings account.','Би чиний оронд байсан бол хадгаламжийн данс нээх байсан.'],['What would you do if you lost your job?','Ажлаа алдвал юу хийх байсан бэ?'],['She would buy a car if she could afford it.','Хүрэлцэх мөнгөтэй бол тэр машин авах байсан.'],['I wish I had more free time.','Илүү их чөлөөт цагтай байгаасай.']],

dl:[{t:'If you won the lottery…',tm:'Хэрэв сугалаанд хожвол…',lines:[['A','What would you do if you won a million dollars?','Сая доллар хожвол юу хийх байсан бэ?'],['B','First, I would pay off my parents\' loan.','Эхлээд эцэг эхийнхээ зээлийг төлөх байсан.'],['A','That\'s kind. And then?','Сайхан сэтгэл юм. Тэгээд?'],['B','I would open a free computer school for children in the countryside.','Хөдөөгийн хүүхдүүдэд үнэгүй компьютерын сургууль нээх байсан.'],['A','Wouldn\'t you buy anything for yourself?','Өөртөө юу ч авахгүй гэж үү?'],['B','Maybe a trip around the world! What about you?','Магадгүй дэлхийг тойрох аялал! Чи яах вэ?'],['A','If I were rich, I would never cook again!','Баян бол би дахиж хэзээ ч хоол хийхгүй!']]},
{t:'Money advice',tm:'Мөнгөний зөвлөгөө',lines:[['A','I never have money at the end of the month.','Сарын эцэст надад хэзээ ч мөнгө үлддэггүй.'],['B','Do you have a budget?','Төсөвтэй юу?'],['A','Not really. I just spend.','Үгүй. Зүгээр л зарцуулдаг.'],['B','If I were you, I would write down everything you spend for one month.','Би чиний оронд байсан бол нэг сарын турш зарцуулсан бүхнээ бичих байсан.'],['A','Good idea. Anything else?','Сайн санаа. Өөр юу байна?'],['B','Save ten percent as soon as you get paid. You won\'t miss it.','Цалингаа авмагц арван хувийг хадгал. Тоохгүй л өнгөрнө.']]}],
story:{t:'The jar of coins',tm:'Зоосны лонх',s:[['When Bilguun was eight, his grandfather gave him an empty glass jar.','Билгүүнийг найман настай байхад өвөө нь түүнд хоосон шилэн лонх өгчээ.'],['"Every time you get money, put one coin in here," he said.','«Мөнгө авах болгондоо энд нэг зоос хий» гэж тэр хэлэв.'],['Bilguun thought it was boring, but he did it anyway.','Билгүүн уйтгартай гэж бодсон ч ямартай ч хийжээ.'],['After a year, the jar was full.','Жилийн дараа лонх дүүрэв.'],['He wanted to spend it all on toys and sweets.','Тэр бүгдийг тоглоом, чихэрт зарцуулахыг хүсэв.'],['"If you spent it now, you would forget it tomorrow," said his grandfather.','«Одоо зарцуулбал маргааш мартчихна» гэж өвөө нь хэлэв.'],['"But if you saved it, you could buy something important."','«Харин хадгалбал чухал зүйл авч чадна.»'],['Bilguun kept saving for five years.','Билгүүн таван жил хадгалсаар байв.'],['At thirteen, he bought his first computer with his own money.','Арван гурван настайдаа тэр өөрийн мөнгөөр анхны компьютераа авав.'],['Today he is a software engineer, and he still keeps a jar on his desk.','Өнөөдөр тэр програм хангамжийн инженер бөгөөд ширээн дээрээ одоо ч лонх тавьдаг.']],

speak:[['What would you do if you won the lottery?','Сугалаанд хожвол юу хийх байсан бэ?','If I won the lottery, I would build a modern school in my hometown and travel with my family.'],['Give advice to a young person about money. Use: If I were you…','Залуу хүнд мөнгөний талаар зөвлөгөө өг. «If I were you…» ашигла.','If I were you, I would save some money every month and I wouldn\'t borrow money for expensive phones.'],['Is it better to save money or to spend it on experiences?','Мөнгөө хадгалах уу, туршлагад зарцуулах уу — аль нь дээр вэ?','I think we should do both. Saving is important for the future, but travel gives us memories for life.']]},

{id:24,st:2,t:'News and media',tm:'Мэдээ ба хэвлэл мэдээлэл',c:'#073b4c',sc:['📰','In the news','Мэдээн дээр'],
goal:{en:'Talk about news and report what people said.',mn:'Мэдээний тухай ярьж, бусдын хэлснийг дамжуулан хэлэх.'},
words:[['news','мэдээ','I read the news every morning.','Би өглөө бүр мэдээ уншдаг.','📰'],['headline','гарчиг (мэдээний)','The headline was shocking.','Мэдээний гарчиг цочирдмоор байлаа.','🗞️'],['article','нийтлэл','I read an interesting article about AI.','Би хиймэл оюун ухааны тухай сонирхолтой нийтлэл уншсан.','📄'],['journalist','сэтгүүлч','The journalist interviewed the minister.','Сэтгүүлч сайдаас ярилцлага авсан.','🎙️'],['report','мэдээлэх; тайлан','The TV reported the accident.','Телевиз ослыг мэдээлсэн.','📺'],['social media','олон нийтийн сүлжээ','News spreads quickly on social media.','Мэдээ олон нийтийн сүлжээгээр хурдан тархдаг.','📱'],['post','нийтлэл (сошиал)','Her post got a thousand likes.','Түүний нийтлэл мянган лайк авсан.','👍'],['share','хуваалцах','Don\'t share news before you check it.','Шалгахаасаа өмнө мэдээ бүү хуваалц.','🔗'],['fake news','худал мэдээ','Fake news can be dangerous.','Худал мэдээ аюултай байж болно.','🤥'],['source','эх сурвалж','Always check the source.','Эх сурвалжаа үргэлж шалга.','🔎'],['reliable','найдвартай','Is this website reliable?','Энэ сайт найдвартай юу?','✅'],['announce','зарлах','The school announced a holiday.','Сургууль амралт зарласан.','📣'],['claim','мэдэгдэх (баталгаагүй)','He claimed that he was innocent.','Тэр өөрийгөө буруугүй гэж мэдэгдсэн.','🗣️'],['according to','… -ын мэдээлснээр','According to the forecast, it will snow.','Цаг агаарын мэдээгээр цас орно.','📊'],['event','үйл явдал','It was the biggest event of the year.','Энэ бол оны хамгийн том үйл явдал байлаа.','🎪'],['election','сонгууль','The election is next year.','Сонгууль ирэх жил болно.','🗳️'],['government','засгийн газар','The government announced new rules.','Засгийн газар шинэ дүрэм зарласан.','🏛️'],['interview','ярилцлага','I watched an interview with the athlete.','Би тамирчны ярилцлагыг үзсэн.','🎤'],['viewer','үзэгч','Millions of viewers watched the final.','Сая сая үзэгч финалыг үзсэн.','👀'],['audience','үзэгч, сонсогч','The audience clapped loudly.','Үзэгчид чанга алга ташив.','👏'],['channel','суваг','Which channel is the match on?','Тэмцээн аль сувгаар гарах вэ?','📡'],['live','шууд','The concert is live on TV.','Концерт телевизээр шууд гарч байна.','🔴'],['update','шинэчлэл','Here is the latest update.','Хамгийн сүүлийн мэдээлэл энэ байна.','🆕'],['breaking news','шуурхай мэдээ','Breaking news: a new bridge has opened.','Шуурхай мэдээ: шинэ гүүр ашиглалтад орлоо.','🚨'],['opinion','санал бодол','That article is just an opinion.','Тэр нийтлэл зүгээр л санал бодол.','💬'],['fact','баримт','Facts are more important than opinions.','Баримт санал бодлоос чухал.','📌'],['spread','тархах','Rumours spread quickly.','Цуурхал хурдан тархдаг.','🌐'],['influence','нөлөө; нөлөөлөх','Media has a big influence on young people.','Хэвлэл мэдээлэл залууст их нөлөөтэй.','🧲'],['trend','чиг хандлага','Short videos are a big trend.','Богино видео бол том чиг хандлага.','📈'],['comment','сэтгэгдэл','Read the comments carefully.','Сэтгэгдлүүдийг анхааралтай унш.','💭']],
gram:{t:'Reported speech: said that…, told me…, asked if…',tm:'Шууд бус яриа: said that…, told me…, asked if…',
en:'<p>When we report what someone said, we usually move the verb one step back in time.<\/p><p>"I <b>am<\/b> tired." → She said (that) she <b>was<\/b> tired.<\/p><p>"We <b>will<\/b> win." → They said they <b>would<\/b> win. "I <b>can<\/b> help." → He said he <b>could<\/b> help.<\/p><p><b>say<\/b> + (that): He said that… <b>tell<\/b> + person: He told <b>me<\/b> that…<\/p><p>Questions: "Are you OK?" → She asked <b>if<\/b> I was OK. "Where do you live?" → He asked where I <b>lived<\/b>.<\/p><p>Change pronouns and time words: today → that day, tomorrow → the next day.<\/p>',
mn:'<p>Бусдын хэлснийг дамжуулахдаа үйл үгийг ихэвчлэн нэг алхам өнгөрсөн рүү шилжүүлнэ.<\/p><p>"I <b>am<\/b> tired." → She said she <b>was<\/b> tired. (Тэр ядарсан гэж хэлсэн.)<\/p><p>will → <b>would<\/b>, can → <b>could<\/b>.<\/p><p><b>say<\/b> + (that); <b>tell<\/b> + хүн: He told <b>me<\/b> that… (Тэр надад … гэж хэлсэн.)<\/p><p>Асуулт: "Are you OK?" → She asked <b>if<\/b> I was OK. (Тэр намайг зүгээр үү гэж асуусан.)<\/p>',
ex:[['The principal said that the meeting was cancelled.','Захирал хурал цуцлагдсан гэж хэлсэн.'],['My son told me he had finished his homework.','Хүү маань даалгавраа дуусгасан гэж надад хэлсэн.'],['The reporter said the bridge would open next week.','Сурвалжлагч гүүр ирэх долоо хоногт нээгдэнэ гэж хэлсэн.'],['She asked if I could help her.','Тэр намайг тусалж чадах эсэхийг асуусан.'],['They asked where we were going.','Тэд биднийг хаашаа явж байгааг асуусан.']],

dl:[{t:'Did you hear the news?',tm:'Мэдээ сонссон уу?',lines:[['A','Did you hear the news? They said schools would close tomorrow.','Мэдээ сонссон уу? Маргааш сургуулиуд хаагдана гэж хэлсэн.'],['B','Really? Who said that?','Үнэхээр үү? Хэн хэлсэн юм бэ?'],['A','I saw it in a post on social media.','Сошиал медиагийн нэг нийтлэлээс харсан.'],['B','Hmm, is the source reliable? Let\'s check the official website.','Хмм, эх сурвалж нь найдвартай юу? Албан ёсны сайтыг шалгая.'],['A','Oh… the ministry said that classes would continue as normal.','Өө… яам хичээл хэвийн үргэлжилнэ гэж хэлсэн байна.'],['B','See? It was fake news. Always check before you share!','Харав уу? Худал мэдээ байжээ. Хуваалцахаасаа өмнө үргэлж шалга!']]},
{t:'Passing on a message',tm:'Зурвас дамжуулах',lines:[['A','Did anyone call while I was in class?','Намайг хичээлд байхад хэн нэгэн залгасан уу?'],['B','Yes, Mr. Bat called. He said he couldn\'t come to the meeting.','Тийм, Бат багш залгасан. Хуралд ирж чадахгүй гэсэн.'],['A','Did he say why?','Яагаад гэдгийг хэлсэн үү?'],['B','He told me his son was sick.','Хүү нь өвчтэй байгаа гэж надад хэлсэн.'],['A','Oh, I hope he gets better. Anything else?','Өө, хурдан эдгэрээсэй. Өөр юм байна уу?'],['B','He asked if you could send him the notes.','Тэмдэглэлийг явуулж өгч болох эсэхийг асуусан.']]}],
story:{t:'The photo that lied',tm:'Худал хэлсэн зураг',s:[['One morning, a photo spread quickly on social media.','Нэг өглөө сошиал медиад нэгэн зураг хурдан тархав.'],['It showed a huge snow leopard walking through a city street.','Хотын гудамжаар алхаж буй асар том ирвэсийг харуулсан байв.'],['The post said that the animal was in Ulaanbaatar.','Нийтлэлд амьтан Улаанбаатарт байгаа гэж бичжээ.'],['Thousands of people shared it, and some parents kept their children at home.','Олон мянган хүн хуваалцаж, зарим эцэг эх хүүхдээ гэртээ үлдээв.'],['A student called Anu was curious, so she checked the photo carefully.','Ану гэдэг сурагч сониуч зантай тул зургийг анхааралтай шалгав.'],['She noticed that the signs in the street were in another language.','Гудамжны тэмдэг өөр хэлээр бичигдсэнийг тэр анзаарав.'],['She searched online and found the original photo from another country.','Тэр онлайнаар хайж, өөр орноос авсан эх зургийг олов.'],['Anu wrote a comment and explained that the post was fake.','Ану сэтгэгдэл бичиж, нийтлэл худал гэдгийг тайлбарлав.'],['Later, a journalist interviewed her, and she said, "Always check the source before you share."','Дараа нь сэтгүүлч түүнээс ярилцлага авахад тэр «Хуваалцахаасаа өмнө эх сурвалжаа үргэлж шалга» гэж хэлэв.'],['Her teacher told the class that Anu was a real digital citizen.','Багш нь ангийнхандаа Ану бол жинхэнэ цахим иргэн гэж хэлсэн.']],

q:[{q:'What did the photo show?',o:['A snow leopard in a city','A flood','A new bridge'],a:0},{q:'How did Anu know it was fake?',o:['The street signs were in another language','Her friend told her','The animal was too small'],a:0},{q:'What did Anu say to the journalist?',o:['Always check the source','Never use social media','Snow leopards are dangerous'],a:0}]},
speak:[['Report a conversation you had today. Use said / told / asked.','Өнөөдөр хийсэн нэг яриагаа шууд бусаар дамжуулан ярь.','This morning my colleague told me she was tired. She said she had worked late. She asked if I could help her with a report.'],['How do you get your news? Which sources do you trust?','Та мэдээг хаанаас авдаг вэ? Аль эх сурвалжид итгэдэг вэ?','I usually read news on my phone, but I trust official websites more than social media.'],['How can we stop fake news?','Худал мэдээг яаж зогсоох вэ?','People should check the source and compare different websites. Schools should teach media literacy.']]}
]);
