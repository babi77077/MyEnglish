<!DOCTYPE html>

<head>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="БАБИ">

<link rel="icon" href="icon-192.png">

<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--bg:#f4f9ff;--card:#fff;--ink:#0f2244;--mut:#5b6b88;--line:#d9e5f7;--pri:#2f6bff;--pri2:#4d8bff;--ok:#12a46b;--bad:#e0435b;--warn:#f59f00;--soft:#e6f0ff;--mn:#7a4b00;--mnbg:#fff6df}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:17px/1.55 Nunito,system-ui,-apple-system,sans-serif;-webkit-tap-highlight-color:transparent;padding-bottom:84px}
button{font:inherit;cursor:pointer;border:0;border-radius:14px;padding:10px 16px;background:var(--pri);color:#fff;font-weight:800;transition:transform .12s,background .15s}
button:active{transform:scale(.97)}
button.ghost{background:#fff;color:var(--pri);border:2px solid var(--line)}
button.soft{background:var(--soft);color:var(--pri)}
button.sm{padding:6px 12px;font-size:14px;border-radius:11px}
button:disabled{opacity:.5;cursor:default}
a{color:var(--pri)}
header{padding-top:env(safe-area-inset-top);position:sticky;top:0;z-index:30;background:rgba(244,249,255,.9);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.hd{max-width:860px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:10px 16px}
.logo{display:flex;align-items:center;gap:8px;font-weight:900;font-size:19px;color:var(--ink);text-decoration:none}
.logo i{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,var(--pri),#ff4f9a);color:#fff;font-style:normal;font-size:15px}
.sp{flex:1}
.mnbtn{background:#fff;color:var(--ink);border:2px solid var(--line);padding:6px 10px;border-radius:999px;font-size:14px}
.mnbtn.on{background:var(--mnbg);border-color:#f2c14e;color:var(--mn)}
main{max-width:860px;margin:0 auto;padding:16px}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:40;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(6,1fr);padding:6px 2px calc(6px + env(safe-area-inset-bottom))}
nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none;color:var(--mut);font-size:11px;font-weight:800;padding:4px 0;border-radius:12px}
nav.tabs a svg{width:24px;height:24px}
nav.tabs a.on{color:var(--pri);background:var(--soft)}
h1{font-size:26px;margin:4px 0 6px;line-height:1.2}h2{font-size:21px;margin:18px 0 8px;line-height:1.25}h3{font-size:18px;margin:0 0 6px}
.mn{display:block;color:var(--mn);background:var(--mnbg);border-radius:8px;padding:2px 8px;margin-top:3px;font-size:.88em;font-weight:600;width:fit-content;max-width:100%}
.mn.in{display:inline;padding:1px 6px;margin:0 0 0 4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin:12px 0;box-shadow:0 4px 18px rgba(20,80,180,.05)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.mut{color:var(--mut)}.small{font-size:14px}
.hero{background:linear-gradient(135deg,#2f6bff,#22c3e6 60%,#ff4f9a);color:#fff;border-radius:24px;padding:20px;position:relative;overflow:hidden}
.hero h1{color:#fff}.hero .mn{background:#ffffff26;color:#fff}
.hero .big{font-size:44px;font-weight:900;line-height:1}
.ring{width:92px;height:92px}
.task{display:flex;gap:12px;align-items:center;padding:12px;border:2px solid var(--line);border-radius:16px;margin:8px 0;background:#fff;text-decoration:none;color:var(--ink)}
.task .ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--soft);font-size:21px;flex:none}
.task.done{border-color:#b9ecd5;background:#f1fbf6}.task.done .ic{background:#d6f5e6}
.task b{display:block}
.chk{margin-left:auto;width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none}
.task.done .chk{background:var(--ok);border-color:var(--ok);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.unit{display:block;text-decoration:none;color:var(--ink);border-radius:20px;padding:16px;background:#fff;border:1px solid var(--line);border-left:8px solid var(--uc)}
.bar{height:8px;border-radius:9px;background:var(--soft);overflow:hidden}.bar i{display:block;height:100%;background:var(--uc,var(--pri))}
.pills{display:flex;gap:6px;overflow-x:auto;padding:4px 0 8px;scrollbar-width:none}.pills::-webkit-scrollbar{display:none}
.pill{flex:none;border-radius:999px;padding:8px 14px;background:#fff;border:2px solid var(--line);color:var(--ink);font-weight:800;font-size:14px}
.pill.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{aspect-ratio:1;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:14px;background:#fff;border:2px solid var(--line);text-decoration:none;color:var(--ink)}
.day.done{background:var(--ok);border-color:var(--ok);color:#fff}.day.cur{border-color:var(--pri);box-shadow:0 0 0 3px #cfe0ff}.day.part{background:#e8fbf2;border-color:#9fe3c2}
.word{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.word:last-child{border-bottom:0}
.word b{font-size:18px}
.spk{width:40px;height:40px;border-radius:50%;padding:0;display:grid;place-items:center;flex:none;background:var(--soft);color:var(--pri)}
.spk svg{width:20px;height:20px}
.spk.on{background:var(--pri);color:#fff;animation:pul 1s infinite}
@keyframes pul{50%{box-shadow:0 0 0 6px #2f6bff33}}
.mic{background:var(--bad)}.mic.on{animation:pul 1s infinite}
.flash{perspective:1000px;margin:12px 0}
.fc{position:relative;height:330px;transition:transform .5s;transform-style:preserve-3d;cursor:pointer}
.fc.flip{transform:rotateY(180deg)}
.fc>div{position:absolute;inset:0;backface-visibility:hidden;border-radius:24px;padding:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:#fff;border:2px solid var(--line)}
.fc .bk{transform:rotateY(180deg);background:linear-gradient(160deg,#fff,#eaf4ff)}
.fc .w{font-size:34px;font-weight:900}
.srs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.srs button{padding:10px 4px;font-size:14px}
.again{background:var(--bad)}.hard{background:var(--warn)}.good{background:var(--ok)}.easy{background:#2f80ed}
.line{display:flex;gap:10px;margin:10px 0;align-items:flex-start}
.line .who{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:900;color:#fff;flex:none}
.line .bub{background:#fff;border:1px solid var(--line);border-radius:4px 18px 18px 18px;padding:10px 12px;max-width:85%}
.line.me{flex-direction:row-reverse}.line.me .bub{background:#e5f0ff;border-color:#c9ddff;border-radius:18px 4px 18px 18px}
.line.cur .bub{outline:3px solid #ffd166}
.line.hide .en{filter:blur(6px)}
.sent{display:inline;cursor:pointer;border-radius:6px;padding:1px 2px;line-height:1.9}
.sent.cur{background:#fff1b8}
.hidetx .sent,.hidetx .mn{filter:blur(7px);user-select:none}
.st p{margin:0 0 10px}
.gw{border-bottom:2px dotted var(--pri);cursor:help}
.score{font-weight:900;font-size:22px}
.res{margin-top:8px;padding:10px 12px;border-radius:14px;background:var(--soft)}
.w-ok{color:var(--ok);font-weight:800}.w-no{color:var(--bad);text-decoration:underline wavy;font-weight:800}
.q{border:2px solid var(--line);border-radius:16px;padding:12px;margin:10px 0;background:#fff}
.opts{display:grid;gap:6px;margin-top:8px}
.opt{text-align:left;background:#fff;color:var(--ink);border:2px solid var(--line);font-weight:700}
.opt.ok{background:#e3f8ee;border-color:var(--ok)}.opt.no{background:#fde8eb;border-color:var(--bad)}
.gram p{margin:0 0 8px}
.ex{padding:8px 0;border-bottom:1px dashed var(--line);display:flex;gap:8px;align-items:center}
.chat{display:flex;flex-direction:column;gap:8px;min-height:240px}
.msg{max-width:86%;padding:10px 13px;border-radius:18px;background:#fff;border:1px solid var(--line)}
.msg.me{align-self:flex-end;background:var(--pri);color:#fff;border-color:var(--pri)}
.msg .fix{display:block;margin-top:6px;font-size:14px;background:#fff6df;color:#7a4b00;border-radius:10px;padding:4px 8px}
.inp{display:flex;gap:8px;margin-top:10px}
.inp input{flex:1;font:inherit;padding:12px 14px;border-radius:14px;border:2px solid var(--line);min-width:0}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:14px;font-weight:800;z-index:60;opacity:0;transition:.3s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1}
.pop{position:fixed;z-index:70;background:var(--ink);color:#fff;padding:8px 12px;border-radius:12px;font-weight:700;font-size:15px;max-width:240px}
.note{background:#fff6df;border:1px solid #f2d18b;border-radius:14px;padding:10px 12px;font-size:15px}
.stat{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.stat div{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px}.stat b{display:block;font-size:26px;font-weight:900}
.wg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media(min-width:620px){.wg{grid-template-columns:repeat(3,minmax(0,1fr))}}
.wt{background:#fff;border:1px solid var(--line);border-radius:20px;padding:12px;display:flex;flex-direction:column;gap:4px;box-shadow:0 4px 14px rgba(20,80,180,.06)}
.wpic{all:unset;cursor:pointer;display:grid;place-items:center;height:96px;border-radius:16px;background:linear-gradient(160deg,#eaf4ff,#fff0f7);font-size:58px;line-height:1}
.wpic:active{transform:scale(.96)}
.wt b{font-size:19px}.wt .m{color:var(--mut);font-size:15px}
.wt .exs{font-size:14px;border-top:1px dashed var(--line);padding-top:6px;margin-top:2px}
.wt .rl{font-size:12px;font-weight:800;color:var(--pri);text-transform:none}
.scene{font-size:46px;letter-spacing:4px;line-height:1.1}
.gpics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}
.gp{all:unset;cursor:pointer;display:grid;place-items:center;aspect-ratio:1.3;border-radius:22px;background:#fff;border:3px solid var(--line);font-size:64px}
.gp.ok{border-color:var(--ok);background:#e3f8ee}.gp.no{border-color:var(--bad);background:#fde8eb}
.mt.ok{background:#e3f8ee;border-color:var(--ok)}
@keyframes rise{from{bottom:-90px}to{bottom:360px}}
.road{position:relative;padding-left:26px}.road:before{content:"";position:absolute;left:10px;top:8px;bottom:8px;width:4px;border-radius:4px;background:linear-gradient(var(--pri),#ff4f9a,#f59f00)}
.stage{position:relative}.stage:before{content:"";position:absolute;left:-23px;top:22px;width:14px;height:14px;border-radius:50%;background:#fff;border:4px solid var(--pri)}
.stage.lock{opacity:.85}.stage.lock:before{border-color:#c3d3ea}
.rec{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:8px}
.rec .dot{width:10px;height:10px;border-radius:50%;background:var(--bad);display:inline-block;animation:pul 1s infinite}
@media(min-width:900px){body{padding-bottom:20px}nav.tabs{position:sticky;top:57px;bottom:auto;max-width:860px;margin:0 auto;border:0;background:transparent;grid-template-columns:repeat(6,auto);justify-content:start;gap:4px}nav.tabs a{flex-direction:row;padding:8px 12px;font-size:15px;gap:6px}.toast{bottom:30px}}

body{background:radial-gradient(900px 500px at 0% -10%,#dcecff 0,transparent 60%),radial-gradient(700px 420px at 100% 0%,#ffe3f1 0,transparent 55%),var(--bg)}
button{background:linear-gradient(135deg,#2f6bff,#3d8cff);box-shadow:0 6px 16px rgba(47,107,255,.22)}
button.ghost,button.soft,.opt,.spk,.srs button,.pill,.mnbtn{box-shadow:none}
.logo span{line-height:1.05}.logo em{font-style:normal;background:linear-gradient(90deg,#ff4f9a,#22c3e6);-webkit-background-clip:text;background-clip:text;color:transparent}
.logo i{background:linear-gradient(135deg,#2f6bff,#22c3e6 55%,#ff4f9a)!important;box-shadow:0 4px 12px rgba(47,107,255,.35);font-size:18px!important}
.hero{box-shadow:0 14px 34px rgba(47,107,255,.28)}
.hero>*{position:relative;z-index:1}
.hero:before{content:"✦ ✧ ✦";position:absolute;right:18px;bottom:10px;font-size:20px;letter-spacing:6px;color:#ffffffaa}
.hero:after{content:"";position:absolute;right:-50px;top:-60px;width:190px;height:190px;border-radius:50%;background:radial-gradient(circle,#ffffff4d,transparent 68%)}
.slogan{margin-top:12px;background:#ffffff26;border:1px solid #ffffff55;border-radius:16px;padding:9px 12px;font-weight:900;font-size:15px;line-height:1.35}
.slogan span{display:block;font-weight:700;font-size:13px;opacity:.9}
nav.tabs a.on{background:linear-gradient(135deg,#e3eeff,#ffe8f3);color:#2f6bff}
.quote{display:flex;gap:12px;align-items:center;margin:12px 0;padding:14px;border-radius:20px;background:linear-gradient(135deg,#fff,#fff0f7);border:2px solid #ffd0e6;box-shadow:0 6px 18px rgba(255,79,154,.12)}
.quote .qe{font-size:34px;flex:none}.quote b{display:block;color:#c2185b;font-size:16px;line-height:1.35}.quote span{display:block;color:var(--mut);font-size:14px}.quote div{flex:1}
.cheer{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translate(-50%,-160%);z-index:80;display:flex;gap:12px;align-items:center;width:min(92vw,460px);padding:14px 16px;border-radius:22px;color:#fff;background:linear-gradient(135deg,#2f6bff,#22c3e6 55%,#ff4f9a);box-shadow:0 16px 40px rgba(20,60,160,.35);transition:transform .45s cubic-bezier(.2,1.3,.4,1);cursor:pointer}
.cheer.on{transform:translate(-50%,0)}
.cheer .ce{font-size:38px;flex:none;animation:bob 1.2s ease-in-out infinite}.cheer b{display:block;font-size:16px;line-height:1.3}.cheer span span{display:block;font-size:13px;opacity:.92;margin-top:2px}
@keyframes bob{50%{transform:translateY(-4px) rotate(-6deg)}}
.wbb{display:flex;gap:12px;align-items:center;text-decoration:none;color:#fff;padding:16px;border-radius:22px;margin:10px 0 4px;background:linear-gradient(135deg,#22c3e6,#2f6bff 60%,#ff4f9a);box-shadow:0 10px 26px rgba(47,107,255,.25)}
.wbb .wbi{font-size:36px;width:56px;height:56px;border-radius:16px;background:#ffffff33;display:grid;place-items:center;flex:none}
.lvb{display:inline-block;font-size:12px;font-weight:900;padding:2px 9px;border-radius:999px;background:var(--uc,#2f6bff);color:#fff}
.deck{border-left:0;border-top:6px solid var(--uc)}
.unit{box-shadow:0 4px 14px rgba(20,80,180,.06);transition:transform .15s}.unit:active{transform:scale(.98)}
.task .ic{background:linear-gradient(135deg,#e3eeff,#ffe8f3)}
.wt{min-width:0}.wt b{overflow-wrap:anywhere;hyphens:auto}
</style>
</head>

words:[

gram:{t:'have / has and my, your, his, her',tm:'have / has ба миний, чиний, түүний',
en:'<p>Use <b>have<\/b> with I, you, we, they. Use <b>has<\/b> with he, she, it.<\/p><p>I <b>have<\/b> a sister. She <b>has<\/b> two sons.<\/p><p>Possessive words: <b>my<\/b> (I), <b>your<\/b> (you), <b>his<\/b> (he), <b>her<\/b> (she), <b>our<\/b> (we), <b>their<\/b> (they).<\/p><p>Question: <b>Do you have<\/b> children? <b>Does she have<\/b> a brother?<\/p>',
mn:'<p>I, you, we, they-тэй <b>have<\/b>, he, she, it-тэй <b>has<\/b> хэрэглэнэ. Утга нь «-тэй байх, эзэмших».<\/p><p>I <b>have<\/b> a sister. (Би эгчтэй.) She <b>has<\/b> two sons. (Тэр хоёр хүүтэй.)<\/p><p>Хамаатуулах үг: <b>my<\/b> миний, <b>your<\/b> чиний/таны, <b>his<\/b> түүний (эрэгтэй), <b>her<\/b> түүний (эмэгтэй), <b>our<\/b> бидний, <b>their<\/b> тэдний.<\/p><p>Асуулт: <b>Do you have<\/b> children? (Та хүүхэдтэй юу?)<\/p>',

story:{t:'Bold\'s Monday',tm:'Болдын даваа гараг',s:[

['He works in a big office with ten people.','Тэр арван хүнтэй том оффист ажилладаг.'],
['At one o\'clock, he has lunch with his friends.','Нэг цагт тэр найзуудтайгаа өдрийн хоолоо иддэг.'],
['He finishes work at six.','Тэр зургаан цагт ажлаа тардаг.'],
['In the evening, he plays basketball.','Орой тэр сагсан бөмбөг тоглодог.'],
['He goes to bed at eleven, very tired but happy.','Тэр арван нэгэн цагт маш ядарсан ч баяртай унтдаг.']],

gram:{t:'I\'d like… / Can I have…? / some & any',tm:'I\'d like… / Can I have…? / some ба any',
en:'<p>To order politely, say <b>I\'d like<\/b> (= I would like) or <b>Can I have…?<\/b><\/p><p>I\'d like a coffee, please. Can I have the soup?<\/p><p>Use <b>some<\/b> in positive sentences and offers, and <b>any<\/b> in negatives and questions: I have <b>some<\/b> bread. I don\'t have <b>any<\/b> milk. Do you have <b>any<\/b> tea?<\/p><p>Likes: I <b>like<\/b> fruit. I <b>don\'t like<\/b> spicy food. Do you like…?<\/p>',

story:{t:'The best buuz in town',tm:'Хотын хамгийн амттай бууз',s:[

['"Mmm, this is delicious!" she says with a smile.','«Ммм, ямар амттай юм бэ!» гэж тэр инээмсэглэн хэлэв.'],
['Now buuz is Anna\'s favourite food in Mongolia.','Одоо бууз бол Аннагийн Монголд хамгийн дуртай хоол.']],

['B','No, it doesn\'t. You need the number 7.','Үгүй. Танд 7-р автобус хэрэгтэй.'],
['A','Where can I catch it?','Хаанаас суух вэ?'],
['B','The bus stop is opposite the museum.','Автобусны буудал музейн эсрэг талд.'],
['A','How long does it take?','Хэр удаан явах вэ?'],
['B','About twenty minutes, but the traffic is bad now.','Хорин минут орчим, гэхдээ одоо түгжрэл ихтэй байна.']]}],
story:{t:'Lost in Seoul',tm:'Сөүлд төөрсөн нь',s:[
['Nomin is on holiday in Seoul.','Номин Сөүлд амарч байна.'],
['She wants to visit a famous palace, but she is lost.','Тэр алдартай ордонд очмоор байгаа ч төөрчихөв.'],
['Her phone battery is dead, so she can\'t use the map.','Утасных нь цэнэг дууссан тул газрын зураг ашиглаж чадахгүй.'],
['She sees a young man near a bus stop.','Тэр автобусны буудлын дэргэд залуу эр харав.'],
['"Excuse me, do you speak English?" she asks.','«Уучлаарай, та англиар ярьдаг уу?» гэж тэр асуув.'],
['"Yes, a little," he says with a smile.','«Тийм, жаахан» гэж тэр инээмсэглэн хэлэв.'],
['"Go straight on, turn right at the big bank, and the palace is opposite a park."','«Чигээрээ яваад том банкны дэргэд баруун тийш эргэвэл ордон цэцэрлэгт хүрээлэнгийн эсрэг талд байна.»'],
['Nomin follows his directions.','Номин түүний зааврыг дагав.'],
['After ten minutes, she sees the beautiful palace.','Арван минутын дараа тэр гоё ордныг харав.'],
['She is happy, because she can ask for help in English.','Тэр англиар тусламж гуйж чаддаг болсондоо баяртай байлаа.']],

gram:{t:'Polite requests: Can I…? Could you…? Would you…?',tm:'Эелдэг хүсэлт: Can I…? Could you…? Would you…?',
en:'<p>Ask for permission: <b>Can I<\/b> have a window seat? <b>Could I<\/b> leave my bag here? (Could is more polite.)<\/p><p>Ask someone to do something: <b>Could you<\/b> help me, please? <b>Would you<\/b> call a taxi for me?<\/p><p>Answer: Yes, of course. / Sure. / I\'m sorry, I can\'t.<\/p><p>Always add <b>please<\/b> and <b>thank you<\/b> — they make your English sound kind.<\/p>',
mn:'<p>Зөвшөөрөл асуух: <b>Can I<\/b> have a window seat? (Цонхны суудал авч болох уу?) <b>Could I<\/b>…? нь илүү эелдэг.<\/p><p>Бусдаас ямар нэг юм хийж өгөхийг хүсэх: <b>Could you<\/b> help me, please? (Туслаж өгөхгүй юу?) <b>Would you<\/b> call a taxi for me? (Такси дуудаж өгөхгүй юу?)<\/p><p>Хариулт: Yes, of course. (Мэдээж.) / I\'m sorry, I can\'t. (Уучлаарай, чадахгүй.)<\/p><p><b>please<\/b>, <b>thank you<\/b> гэдгийг үргэлж нэмээрэй.<\/p>',
ex:[['Could I see your passport, please?','Паспортаа үзүүлнэ үү?'],['Can I have an aisle seat?','Гарцны дэргэдэх суудал авч болох уу?'],['Could you call a taxi, please?','Такси дуудаж өгнө үү?'],['Would you help me with my suitcase?','Чемоданыг минь авалцаж өгөхгүй юу?'],['Yes, of course.','Тийм, мэдээж.']],
q:[{q:'___ I have a window seat, please?',o:['Can','Do','Am'],a:0},{q:'___ you help me, please?',o:['Could','Are','Does'],a:0},{q:'Your flight is ___. It leaves at 11 now.',o:['delayed','early','gate'],a:0},{q:'I have a ___ for two nights.',o:['reservation','towel','luggage'],a:0},{q:'Where is ___ 12?',o:['gate','key','towel'],a:0},{q:'Polite answer: "Could you open the door?" — "Yes, ___."',o:['of course','no way','never'],a:0}]},
dl:[{t:'At check-in',tm:'Бүртгэлийн ширээнд',lines:[
['A','Good morning. Can I see your passport, please?','Өглөөний мэнд. Паспортаа үзүүлнэ үү?'],
['B','Here you are.','Энэ байна.'],
['A','Thank you. How many bags do you have?','Баярлалаа. Хэдэн ачаатай вэ?'],
['B','Just one suitcase. Could I have a window seat?','Ганц чемодан. Цонхны суудал авч болох уу?'],
['A','Sure. Here is your boarding pass. Your gate is 4.','Тэгье. Энэ таны суух тасалбар. Таны гарц 4.'],
['B','What time is boarding?','Хэдэн цагт суух вэ?'],
['A','At 8:15. Have a nice flight!','8:15-д. Сайхан нисээрэй!']]},
{t:'At the hotel',tm:'Зочид буудалд',lines:[
['A','Good evening. Welcome to the Blue Sky Hotel.','Оройн мэнд. Blue Sky зочид буудалд тавтай морил.'],
['B','Hello. I have a reservation. My name is Batsetseg.','Сайн байна уу. Би захиалгатай. Намайг Батцэцэг гэдэг.'],
['A','Yes, a single room for three nights. Here is your key.','Тийм, нэг хүний өрөө, гурван хоног. Энэ таны түлхүүр.'],
['B','Thank you. What time is breakfast?','Баярлалаа. Өглөөний цай хэдэн цагт вэ?'],
['A','From seven to ten, on the first floor.','Долоогоос арван цаг хүртэл, нэгдүгээр давхарт.'],
['B','And could you tell me the Wi-Fi password?','Мөн Wi-Fi-ийн нууц үгийг хэлж өгөхгүй юу?'],
['A','Of course. It\'s on your key card.','Мэдээж. Таны түлхүүр карт дээр бичээстэй.']]}],
story:{t:'A long day',tm:'Урт өдөр',s:[
['Saraa is flying to Tokyo for a teachers\' conference.','Сараа багш нарын хуралд оролцохоор Токио руу нисэж байна.'],
['At the airport, she hears bad news: her flight is delayed.','Нисэх буудал дээр тэр муу мэдээ сонсов: нислэг нь хойшилжээ.'],
['She waits for three hours and reads a book.','Тэр гурван цаг хүлээж, ном уншив.'],
['Finally, she gets on the plane.','Эцэст нь тэр онгоцонд суув.'],
['She arrives at her hotel very late at night.','Тэр зочид буудалдаа шөнө их оройтож ирэв.'],
['"I\'m sorry, we don\'t have your reservation," says the receptionist.','«Уучлаарай, танай захиалга манайд алга» гэж хүлээн авагч хэлэв.'],
['Saraa is tired, but she stays calm.','Сараа ядарсан ч тайван байв.'],
['"Could you check again, please? Here is my email."','«Дахин шалгаж өгөхгүй юу? Энэ миний имэйл.»'],
['The receptionist checks and smiles. "Oh, here it is! Sorry!"','Хүлээн авагч шалгаад инээмсэглэв. «Өө, энэ байна! Уучлаарай!»'],
['Saraa gets her key and sleeps for ten hours.','Сараа түлхүүрээ аваад арван цаг унтав.']],

speak:[['Check in at a hotel. Say your name, how long you\'re staying and ask one question.','Зочид буудалд бүртгүүл. Нэр, хэр удаан байрлахаа хэлж, нэг асуулт асуу.','Hello, I have a reservation for two nights. My name is Batsetseg. What time is breakfast?'],
['Make three polite requests on a plane.','Онгоцонд гурван эелдэг хүсэлт гарга.','Could I have some water, please? Can I have a blanket? Could you help me with my bag?'],
['Talk about a trip you remember.','Санаж буй нэг аяллынхаа тухай ярь.','I went to Khuvsgul Lake with my family. It was beautiful and the water was very clean.']]},

{id:8,t:'My job: a teacher',tm:'Миний ажил: багш',c:'#118ab2',
goal:{en:'Talk about your job, what you are doing now and your workplace.',mn:'Ажил мэргэжил, одоо хийж буй зүйл, ажлын байрныхаа тухай ярих.'},
words:[
['job','ажил, мэргэжил','I love my job.','Би ажилдаа дуртай.'],
['colleague','хамт ажиллагч','My colleagues are very friendly.','Миний хамт ажиллагчид их найрсаг.'],
['principal','захирал (сургуулийн)','The principal is in a meeting.','Захирал хуралд байна.'],
['subject','хичээл (сэдэв)','My subject is IT.','Миний заадаг хичээл мэдээллийн технологи.'],

['classroom','анги танхим','Our classroom has twenty computers.','Манай анги хорин компьютертэй.'],
['grade','анги (түвшин); дүн','I teach grade 7.','Би 7-р ангид заадаг.'],
['homework','гэрийн даалгавар','Please do your homework.','Гэрийн даалгавраа хийгээрэй.'],
['explain','тайлбарлах','Let me explain the task.','Даалгаврыг тайлбарлая.'],
['prepare','бэлтгэх','I prepare my lessons at home.','Би хичээлээ гэртээ бэлтгэдэг.'],
['meeting','хурал','We have a meeting on Friday.','Бид Баасан гарагт хуралтай.'],
['busy','завгүй','I\'m very busy this week.','Би энэ долоо хоногт их завгүй.'],

gram:{t:'Present continuous: now and around now',tm:'Одоо цагийн үргэлжилсэн хэлбэр: яг одоо',
en:'<p>Use the <b>present continuous<\/b> for actions happening now: am/is/are + verb<b>-ing<\/b>.<\/p><p>I <b>am teaching<\/b> now. She <b>is preparing<\/b> a lesson. They <b>are working<\/b> on a project.<\/p><p>Compare: I <b>teach<\/b> IT (every day — present simple). I<b>\'m teaching<\/b> grade 7 now (at this moment).<\/p><p>Question: What <b>are<\/b> you <b>doing<\/b>? Negative: I\'m <b>not<\/b> working today.<\/p><p>Spelling: make → mak<b>ing<\/b>, sit → sit<b>ting<\/b>, write → writ<b>ing<\/b>.<\/p>',
mn:'<p>Яг одоо болж буй үйлдлийг <b>одоо цагийн үргэлжилсэн хэлбэр<\/b>-ээр хэлнэ: am/is/are + үйл үг<b>-ing<\/b>.<\/p><p>I <b>am teaching<\/b> now. (Би одоо хичээл зааж байна.) She <b>is preparing<\/b> a lesson. (Тэр хичээл бэлтгэж байна.)<\/p><p>Харьцуул: I <b>teach<\/b> IT (өдөр бүр — энгийн хэлбэр). I<b>\'m teaching<\/b> grade 7 now (яг одоо).<\/p><p>Асуулт: What <b>are<\/b> you <b>doing<\/b>? (Чи юу хийж байна?) Үгүйсгэл: I\'m <b>not<\/b> working today.<\/p>',
ex:[['I\'m writing an email to the principal.','Би захиралд имэйл бичиж байна.'],['The students are doing a test now.','Сурагчид одоо шалгалт өгч байна.'],['What are you doing?','Чи юу хийж байна?'],['She isn\'t working today. She\'s at home.','Тэр өнөөдөр ажиллахгүй байна. Гэртээ байгаа.'],['I teach IT, but this week I\'m teaching maths too.','Би мэдээллийн технологи заадаг ч энэ долоо хоногт математик бас зааж байна.']],

story:{t:'The robot club',tm:'Роботын дугуйлан',s:[
['Every Wednesday, Ms. Oyuna runs a robot club at her school.','Лхагва гараг бүр Оюуна багш сургуульдаа роботын дугуйлан хичээллүүлдэг.'],
['Today, twelve students are in the classroom.','Өнөөдөр ангид арван хоёр сурагч байна.'],
['Some students are building a small car.','Зарим сурагчид жижиг машин угсарч байна.'],
['Others are writing code on their computers.','Бусад нь компьютер дээрээ код бичиж байна.'],
['One boy, Temuulen, is not happy.','Тэмүүлэн гэдэг нэг хүү баяргүй байна.'],
['His robot is not moving.','Түүний робот хөдлөхгүй байна.'],
['Ms. Oyuna sits next to him and looks at his code.','Оюуна багш түүний хажууд сууж, кодыг нь харав.'],
['"Look, you forgot one number here," she explains.','«Хар даа, чи энд нэг тоо мартжээ» гэж тэр тайлбарлав.'],
['Temuulen changes the number and presses start.','Тэмүүлэн тоог засаад эхлэх товчийг дарав.'],
['Now the robot is dancing, and everyone is laughing.','Одоо робот бүжиглэж, бүгд инээлдэж байна.']],

gram:{t:'Instructions (imperatives) and advice with should',tm:'Заавар (захирах хэлбэр) ба should-ээр зөвлөх',
en:'<p>Give instructions with the base verb: <b>Open<\/b> the file. <b>Click<\/b> Save. Negative: <b>Don\'t<\/b> touch the cables.<\/p><p>Make it softer with <b>please<\/b> or <b>Let\'s<\/b>: Let\'s start. Please sit down.<\/p><p>Give advice with <b>should<\/b> + base verb: You <b>should<\/b> save your work often. You <b>shouldn\'t<\/b> share your password.<\/p><p>Ask for advice: What <b>should<\/b> I do?<\/p>',
mn:'<p>Заавар өгөхдөө үйл үгийн үндсэн хэлбэрийг хэрэглэнэ: <b>Open<\/b> the file. (Файлыг нээ.) Үгүйсгэл: <b>Don\'t<\/b> touch the cables. (Утсанд бүү хүр.)<\/p><p>Зөөлрүүлэх: <b>please<\/b> эсвэл <b>Let\'s<\/b> (…цгаая): Let\'s start. (Эхэлцгээе.)<\/p><p>Зөвлөгөө: <b>should<\/b> + үйл үг = «… хэрэгтэй, … нь зүйтэй». You <b>should<\/b> save your work often. You <b>shouldn\'t<\/b> share your password.<\/p><p>Зөвлөгөө асуух: What <b>should<\/b> I do? (Би юу хийх ёстой вэ?)<\/p>',
ex:[['Open your notebooks, please.','Дэвтрээ нээгээрэй.'],['Don\'t eat in the computer room.','Компьютерын өрөөнд бүү хоол ид.'],['Let\'s check the answers together.','Хариултаа хамтдаа шалгацгаая.'],['You should use a strong password.','Хүчтэй нууц үг ашиглах хэрэгтэй.'],['Students shouldn\'t play games in class.','Сурагчид хичээлийн үеэр тоглоом тоглох ёсгүй.']],

dl:[{t:'In the computer room',tm:'Компьютерын өрөөнд',lines:[
['A','Good morning, class! Please turn on your computers.','Өглөөний мэнд, хүүхдүүд ээ! Компьютероо асаагаарай.'],
['B','Teacher, my computer isn\'t working.','Багшаа, миний компьютер ажиллахгүй байна.'],
['A','Let me see. Is it plugged in?','Үзье. Залгаатай юу?'],
['B','Oh! No, it isn\'t. Sorry.','Өө! Үгүй байна. Уучлаарай.'],
['A','No problem. Now open the folder "Lesson 5".','Зүгээр. Одоо «Lesson 5» хавтсыг нээ.'],
['B','Should I save my work on the desktop?','Ажлаа ширээний дэлгэц дээр хадгалах уу?'],
['A','No, you should save it in your own folder.','Үгүй, өөрийнхөө хавтсанд хадгалах хэрэгтэй.']]},
{t:'Online safety',tm:'Цахим аюулгүй байдал',lines:[
['A','Someone wants my password. What should I do?','Нэг хүн миний нууц үгийг асуугаад байна. Би яах ёстой вэ?'],
['B','You shouldn\'t give it to anyone.','Хэнд ч өгч болохгүй.'],
['A','Even to a friend?','Найздаа ч гэсэн үү?'],
['B','Yes, even to a friend. Tell your parents or a teacher.','Тийм, найздаа ч бас. Эцэг эх эсвэл багшдаа хэл.'],
['A','OK. Should I change it?','За. Нууц үгээ солих уу?'],
['B','Yes, that\'s a good idea. Use letters, numbers and symbols.','Тийм, сайн санаа. Үсэг, тоо, тэмдэг ашигла.']]}],
story:{t:'The lost project',tm:'Алдагдсан төсөл',s:[
['Anu works on her school project for three hours.','Ану сургуулийн төсөл дээрээ гурван цаг ажиллав.'],
['It is a presentation about clean water.','Энэ нь цэвэр усны тухай илтгэл.'],
['Suddenly, the lights go out.','Гэнэт гэрэл унтрав.'],
['Her computer turns off, and she didn\'t save her work.','Компьютер нь унтарсан бөгөөд тэр ажлаа хадгалаагүй байв.'],
['Anu is very upset.','Ану их бухимдав.'],
['The next day, she tells her IT teacher about the problem.','Маргааш нь тэр мэдээллийн технологийн багшдаа асуудлаа хэлэв.'],
['"Let\'s look," says the teacher. "The program saves a copy every ten minutes."','«Хамт харъя» гэж багш хэлэв. «Програм арван минут тутам хуулбар хадгалдаг юм.»'],
['They find the file, and most of her work is there!','Тэд файлыг олсон бөгөөд ажлынх нь ихэнх хэсэг тэнд байв!'],
['"You should save your work often, and you should keep a copy online," the teacher says.','«Ажлаа байнга хадгалж, интернэтэд хуулбар хадгалж байх хэрэгтэй» гэж багш хэлэв.'],
['Now Anu presses Ctrl+S every five minutes.','Одоо Ану таван минут тутам Ctrl+S дардаг болжээ.']],

speak:[['Give five instructions to students at the start of a computer lesson.','Компьютерын хичээлийн эхэнд сурагчдад таван заавар өг.','Good morning. Sit down, please. Turn on your computers. Open your folder. Don\'t eat in the room.'],
['Give advice to a friend who uses a weak password.','Сул нууц үг ашигладаг найздаа зөвлөгөө өг.','You should use a longer password. You shouldn\'t use your birthday.'],
['How do you use technology in your life?','Та амьдралдаа технологийг хэрхэн ашигладаг вэ?','I use my phone to talk to my family and I use my computer to prepare lessons.']]},

words:[

gram:{t:'Past simple: was/were and -ed / irregular verbs',tm:'Өнгөрсөн энгийн цаг: was/were ба -ed / дүрмийн бус үйл үг',
en:'<p><b>was<\/b> (I, he, she, it) / <b>were<\/b> (you, we, they): The film <b>was<\/b> fun. We <b>were<\/b> tired.<\/p><p>Regular verbs add <b>-ed<\/b>: visit → visit<b>ed<\/b>, clean → clean<b>ed<\/b>, stay → stay<b>ed<\/b>.<\/p><p>Irregular verbs change: go → <b>went<\/b>, see → <b>saw<\/b>, eat → <b>ate<\/b>, have → <b>had<\/b>, buy → <b>bought<\/b>, make → <b>made<\/b>, meet → <b>met<\/b>.<\/p><p>Negative & question with <b>did<\/b> + base verb: I <b>didn\'t go<\/b>. <b>Did<\/b> you <b>see<\/b> it? What <b>did<\/b> you <b>do<\/b>?<\/p>',
mn:'<p><b>was<\/b> (I, he, she, it) / <b>were<\/b> (you, we, they) — «байсан»: The film <b>was<\/b> fun. (Кино хөгжилтэй байсан.)<\/p><p>Дүрмийн үйл үгэнд <b>-ed<\/b> нэмнэ: visit → visit<b>ed<\/b> (зочилсон).<\/p><p>Дүрмийн бус үйл үг хэлбэрээ өөрчилнө: go → <b>went<\/b>, see → <b>saw<\/b>, eat → <b>ate<\/b>, have → <b>had<\/b>, buy → <b>bought<\/b>. Эдгээрийг цээжлэх хэрэгтэй.<\/p><p>Үгүйсгэл, асуултад <b>did<\/b> + үндсэн хэлбэр: I <b>didn\'t go<\/b>. (Би яваагүй.) <b>Did<\/b> you <b>see<\/b> it? What <b>did<\/b> you <b>do<\/b>? (Чи юу хийсэн бэ?)<\/p>',
ex:[['I went to the cinema last night.','Би өчигдөр орой кино театрт очсон.'],['We visited my grandmother on Sunday.','Бид ням гарагт эмээ дээрээ очсон.'],['The weather was cold.','Цаг агаар хүйтэн байсан.'],['I didn\'t buy anything.','Би юу ч аваагүй.'],['Did you have a good weekend?','Амралт сайхан өнгөрөв үү?']],

story:{t:'A surprise in the snow',tm:'Цасан дахь гэнэтийн бэлэг',s:[
['Last Saturday, Bat and his son went to the mountains.','Өнгөрсөн бямба гарагт Бат хүүтэйгээ уул руу явсан.'],
['It was cold, and there was a lot of snow.','Хүйтэн байсан бөгөөд их цас орсон байв.'],
['They walked for two hours and took many photos.','Тэд хоёр цаг алхаж, олон зураг авав.'],
['Suddenly, his son stopped and pointed at a tree.','Гэнэт хүү нь зогсоод нэг мод руу заав.'],
['There was a small deer behind the tree.','Модны ард жижиг буга байлаа.'],
['They didn\'t move. They didn\'t speak.','Тэд хөдөлсөнгүй. Ярьсангүй.'],
['The deer looked at them for a long time.','Буга тэднийг удаан харав.'],
['Then it ran into the forest.','Тэгээд ой руу гүйгээд алга болов.'],
['On the way home, they bought hot tea and talked about the deer.','Гэр рүүгээ харих замдаа тэд халуун цай авч, бугын тухай ярилцав.'],
['It was the best day of the winter.','Энэ бол өвлийн хамгийн сайхан өдөр байлаа.']],

gram:{t:'Talking about health: have, feel, hurt + should/need',tm:'Эрүүл мэндээ ярих: have, feel, hurt + should/need',
en:'<p>Use <b>have<\/b> + illness: I <b>have a<\/b> headache / a cold / a fever / a cough.<\/p><p>Use <b>feel<\/b> + adjective: I <b>feel<\/b> sick / tired / better.<\/p><p>Use <b>hurt<\/b> for pain: My leg <b>hurts<\/b>. My eyes <b>hurt<\/b>.<\/p><p>Advice: You <b>should<\/b> rest. You <b>need to<\/b> see a doctor. Why don\'t you drink some tea?<\/p><p>Asking: What\'s the matter? / What\'s wrong? / Are you OK?<\/p>',
mn:'<p>Өвчнийг <b>have<\/b>-ээр: I <b>have a<\/b> headache (толгой өвдөж байна) / a cold (ханиад хүрсэн) / a fever (халуурч байна).<\/p><p>Мэдрэмжийг <b>feel<\/b>-ээр: I <b>feel<\/b> sick / tired / better. (Бие муу / ядарсан / дээрдсэн.)<\/p><p>Өвдөлтийг <b>hurt<\/b>-ээр: My leg <b>hurts<\/b>. (Хөл өвдөж байна.)<\/p><p>Зөвлөгөө: You <b>should<\/b> rest. You <b>need to<\/b> see a doctor. (Эмчид үзүүлэх хэрэгтэй.)<\/p><p>Асуух: What\'s the matter? / What\'s wrong? (Юу болов?) Are you OK? (Зүгээр үү?)<\/p>',
ex:[['I have a terrible headache.','Миний толгой аймаар өвдөж байна.'],['She feels tired today.','Тэр өнөөдөр ядарсан байна.'],['My stomach hurts.','Миний гэдэс өвдөж байна.'],['You should drink a lot of water.','Та их ус уух хэрэгтэй.'],['What\'s the matter? You look pale.','Юу болов? Чи цайвар харагдаж байна.']],
q:[{q:'I ___ a headache.',o:['have','feel','hurt'],a:0},{q:'I ___ much better today.',o:['have','feel','am have'],a:1},{q:'My back ___.',o:['hurts','hurt','is hurt'],a:0},{q:'You ___ see a doctor.',o:['should','shoulds','are'],a:0},{q:'What\'s the ___? Are you OK?',o:['matter','problem with','wrong'],a:0},{q:'In an emergency in Mongolia, call ___.',o:['103','911','100'],a:0}]},
dl:[{t:'At the doctor\'s',tm:'Эмчид',lines:[
['A','Good morning. What\'s the matter?','Өглөөний мэнд. Юу болов?'],
['B','I have a sore throat and a cough.','Хоолой өвдөж, ханиалгаж байна.'],
['A','How long have you had it?','Хэдэн өдөр болж байна?'],
['B','For three days. And I feel very tired.','Гурван өдөр. Бас их ядарч байна.'],
['A','Do you have a fever?','Халуурч байна уу?'],
['B','A little, in the evening.','Орой жаахан.'],
['A','It\'s a cold. Take this medicine and rest for two days.','Ханиад байна. Энэ эмийг уугаад хоёр өдөр амраарай.']]},
{t:'Are you OK?',tm:'Чи зүгээр үү?',lines:[
['A','Are you OK? You look tired.','Чи зүгээр үү? Ядарсан харагдаж байна.'],
['B','I didn\'t sleep well. I have a lot of work.','Сайн унтаж чадаагүй. Ажил их байна.'],
['A','You should take a break.','Жаахан амсхийх хэрэгтэй.'],
['B','I know, but the deadline is tomorrow.','Мэдэж байна, гэхдээ эцсийн хугацаа маргааш.'],
['A','Why don\'t you go for a short walk? It helps.','Богино алхалт хийвэл яасан юм? Тусалдаг шүү.'],
['B','Good idea. Thank you!','Сайн санаа. Баярлалаа!']]}],
story:{t:'Too much screen time',tm:'Дэлгэцийн өмнө хэт удсан нь',s:[
['Erdene is fifteen, and he loves video games.','Эрдэнэ арван таван настай, видео тоглоомд маш дуртай.'],
['Every night, he plays until two in the morning.','Тэр шөнө бүр хоёр цаг хүртэл тоглодог.'],
['One morning, he feels terrible.','Нэг өглөө тэр их муу санагдав.'],
['His eyes hurt, and he has a bad headache.','Нүд нь өвдөж, толгой нь хүчтэй өвдөж байлаа.'],
['His mother takes him to the doctor.','Ээж нь түүнийг эмчид авч очив.'],
['"You need more sleep and less screen time," the doctor says.','«Чи илүү их унтаж, дэлгэцийн өмнө бага суух хэрэгтэй» гэж эмч хэлэв.'],
['"You should stop using your phone one hour before bed."','«Унтахаасаа нэг цагийн өмнө утсаа хэрэглэхээ болих хэрэгтэй.»'],
['Erdene isn\'t happy, but he tries it.','Эрдэнэд таалагдаагүй ч тэр туршиж үзэв.'],
['After one week, he feels much better.','Нэг долоо хоногийн дараа бие нь хамаагүй дээрдэв.'],
['Now he plays games only at the weekend, and he has more energy for football.','Одоо тэр зөвхөн амралтын өдөр тоглодог болж, хөлбөмбөг тоглох илүү их эрч хүчтэй болжээ.']],

speak:[['You feel sick. Tell the doctor about your problem.','Таны бие муу байна. Эмчид асуудлаа хэл.','I have a headache and a fever. I feel very tired. It started two days ago.'],
['Give advice to a stressed colleague.','Стресстэй байгаа хамт ажиллагсдаа зөвлөгөө өг.','You should take a break. You should sleep more and go for a walk.'],
['What do you do to stay healthy?','Та эрүүл байхын тулд юу хийдэг вэ?','I walk every day, I drink a lot of water and I try to sleep early.']]},

{id:12,t:'Plans, opinions and the future',tm:'Төлөвлөгөө, санал бодол, ирээдүй',c:'#5a189a',
goal:{en:'Talk about plans, give opinions with reasons and answer exam-style speaking questions.',mn:'Төлөвлөгөөгөө ярих, санал бодлоо шалтгаантай илэрхийлэх, шалгалтын маягийн ярианы асуултад хариулах.'},
words:[
['plan','төлөвлөгөө','What are your plans for the summer?','Зуны төлөвлөгөө чинь юу вэ?'],
['future','ирээдүй','I want to study abroad in the future.','Ирээдүйд гадаадад суралцмаар байна.'],
['hope','найдах, хүсэх','I hope to visit London one day.','Нэг л өдөр Лондонд очно гэж найдаж байна.'],
['dream','мөрөөдөл','My dream is to travel the world.','Миний мөрөөдөл бол дэлхийг тойрон аялах.'],
['opinion','санал бодол','In my opinion, English is very useful.','Миний бодлоор англи хэл маш хэрэгтэй.'],
['agree','санал нийлэх','I agree with you.','Би тантай санал нэг байна.'],
['disagree','санал зөрөх','I disagree. I think it\'s too expensive.','Би санал нийлэхгүй. Хэтэрхий үнэтэй гэж бодож байна.'],
['because','учир нь','I like summer because it\'s warm.','Би зунд дуртай, учир нь дулаахан.'],
['important','чухал','Education is very important.','Боловсрол маш чухал.'],
['probably','магадгүй','I will probably stay at home.','Би магадгүй гэртээ байх байх.'],
['next year','ирэх жил','Next year I\'m going to take an exam.','Ирэх жил би шалгалт өгөх гэж байна.'],
['goal','зорилго','My goal is to speak English well.','Миний зорилго англиар сайн ярих.'],
['abroad','гадаадад','Many students want to study abroad.','Олон сурагч гадаадад сурахыг хүсдэг.'],
['improve','сайжруулах','I\'m going to improve my speaking.','Би ярианы чадвараа сайжруулах гэж байна.'],
['advantage','давуу тал','One advantage of the city is the jobs.','Хотын нэг давуу тал нь ажлын байр.'],
['disadvantage','сул тал','A disadvantage is the traffic.','Сул тал нь замын түгжрэл.'],
['example','жишээ','For example, I use English at work.','Жишээ нь, би ажил дээрээ англи хэл ашигладаг.'],
['decide','шийдэх','I decided to learn English.','Би англи хэл сурахаар шийдсэн.'],
['succeed','амжилтад хүрэх','If you practise every day, you will succeed.','Өдөр бүр давтвал амжилтад хүрнэ.'],
['confident','өөртөө итгэлтэй','I feel more confident now.','Би одоо илүү итгэлтэй болсон.']],
gram:{t:'going to / will and giving opinions',tm:'going to / will ба санал бодол илэрхийлэх',
en:'<p><b>be going to<\/b> + verb for plans you already decided: I\'m <b>going to<\/b> visit Japan next year.<\/p><p><b>will<\/b> + verb for predictions and quick decisions: I think it <b>will<\/b> rain. OK, I<b>\'ll<\/b> help you.<\/p><p>Opinions: <b>I think<\/b>… / <b>In my opinion<\/b>… / <b>I believe<\/b>… + a reason with <b>because<\/b> + an example with <b>for example<\/b>.<\/p><p>Exam tip: answer, give a reason, add an example — 3 sentences. (Answer → Reason → Example.)<\/p>',
mn:'<p><b>be going to<\/b> + үйл үг — урьдчилан шийдсэн төлөвлөгөө: I\'m <b>going to<\/b> visit Japan next year. (Ирэх жил Японд очих гэж байна.)<\/p><p><b>will<\/b> + үйл үг — таамаглал, тэр дороо гаргасан шийдвэр: I think it <b>will<\/b> rain. (Бороо орох байх.) OK, I<b>\'ll<\/b> help you. (За, би тусалъя.)<\/p><p>Санал бодол: <b>I think<\/b>… (Би … гэж боддог) / <b>In my opinion<\/b>… (Миний бодлоор) + <b>because<\/b> (учир нь) шалтгаан + <b>for example<\/b> (жишээ нь).<\/p><p>Шалгалтын зөвлөгөө: хариулт → шалтгаан → жишээ гэсэн 3 өгүүлбэрээр хариул.<\/p>',
ex:[['I\'m going to study English every day.','Би өдөр бүр англи хэл сурах гэж байна.'],['I think English will help my career.','Англи хэл миний ажил мэргэжилд тусална гэж бодож байна.'],['In my opinion, reading is the best way to learn words.','Миний бодлоор үг сурах хамгийн сайн арга бол унших.'],['I like living in the city because there are many opportunities.','Хотод амьдрах дуртай, учир нь боломж олон.'],['For example, I can join English clubs.','Жишээ нь, би англи хэлний клубт явж болно.']],

{t:'Speaking exam: Part 1',tm:'Ярианы шалгалт: 1-р хэсэг',lines:[
['A','Let\'s talk about your hometown. Where are you from?','Төрсөн нутгийнхаа тухай ярья. Та хаанаас гаралтай вэ?'],
['B','I\'m from Erdenet. It\'s a mining city in the north of Mongolia.','Би Эрдэнэтээс. Энэ бол Монголын хойд хэсэгт орших уул уурхайн хот.'],
['A','What do you like about it?','Тэнд юу нь танд таалагддаг вэ?'],
['B','I like it because it\'s quiet and green. For example, there are beautiful forests near the city.','Нам гүм, ногоон байдгаараа таалагддаг. Жишээ нь хотын ойролцоо гоё ой бий.'],
['A','Do you think it will change in the future?','Ирээдүйд өөрчлөгдөнө гэж бодож байна уу?'],

story:{t:'Ninety days',tm:'Ерэн хоног',s:[
['Batsetseg is a teacher, and she has a big goal.','Батцэцэг багш бөгөөд тэр том зорилготой.'],
['She wants to speak English well in ninety days.','Тэр ерэн хоногт англиар сайн ярьдаг болохыг хүсдэг.'],
['At first, it is difficult.','Эхэндээ хэцүү байна.'],
['She forgets new words, and she is afraid to speak.','Тэр шинэ үгээ мартаж, ярихаас айдаг.'],
['But she decides to practise every day, even for thirty minutes.','Гэвч тэр өдөр бүр, гучхан минут ч болов дасгал хийхээр шийдэв.'],
['She listens to stories, repeats sentences and talks to her computer.','Тэр үлгэр сонсож, өгүүлбэр давтаж, компьютертэйгээ ярилцдаг.'],
['After one month, she understands simple conversations.','Нэг сарын дараа тэр энгийн яриаг ойлгодог болов.'],
['After two months, she can talk about her job and her family.','Хоёр сарын дараа тэр ажил, гэр бүлийнхээ тухай ярьж чаддаг болов.'],
['On day ninety, she gives a short talk in English to her colleagues.','Ерэн дэх өдөр тэр хамт ажиллагсдынхаа өмнө англиар богино илтгэл тавив.'],
['Everyone claps. She is nervous, but she is very proud.','Бүгд алга ташив. Тэр сандарсан ч маш их бахархав.'],
['"Next, I\'m going to read a whole English book," she says.','«Дараа нь би бүтэн англи ном унших гэж байна» гэж тэр хэлэв.']],

['Exam question (Part 2): Describe a person who helped you learn something. Speak for one minute.','Шалгалтын асуулт (2-р хэсэг): Танд ямар нэг зүйл сурахад тусалсан хүний тухай нэг минут ярь.','I want to talk about my first IT teacher. She taught me how to use a computer when I was twelve. She was patient and kind. Because of her, I became a teacher too.']]}

words:[['experience','туршлага','It was an amazing experience.','Гайхалтай туршлага байлаа.','🌟'],['ever','хэзээ нэгэн цагт','Have you ever been to Japan?','Чи Японд очиж байсан уу?','❓'],['never','хэзээ ч','I have never flown in a helicopter.','Би нисдэг тэргэнд хэзээ ч суугаагүй.','🚫'],['already','аль хэдийн','I have already finished my report.','Би тайлангаа аль хэдийн дуусгасан.','✅'],['yet','хараахан','I haven\'t eaten yet.','Би хараахан хоол идээгүй.','⌛'],['just','дөнгөж сая','She has just arrived.','Тэр дөнгөж сая ирлээ.','⏱️'],['abroad','гадаадад','Have you ever lived abroad?','Та гадаадад амьдарч байсан уу?','🌍'],['climb','авирах','We climbed a mountain last year.','Бид өнгөрсөн жил ууланд авирсан.','🧗'],['adventure','адал явдал','Travelling alone is an adventure.','Ганцаараа аялах бол адал явдал.','🗺️'],['brave','зоригтой','You were very brave!','Чи их зоригтой байлаа!','🦁'],['scared','айсан','I was scared of the dark.','Би харанхуйгаас айдаг байсан.','😨'],['proud','бахархсан','I\'m proud of my students.','Би сурагчдаараа бахархдаг.','🥇'],['achievement','амжилт','Learning English is a big achievement.','Англи хэл сурах бол том амжилт.','🏆'],['competition','тэмцээн','My team won the competition.','Манай баг тэмцээнд түрүүлсэн.','🏅'],['prize','шагнал','She won first prize.','Тэр нэгдүгээр байр эзэлсэн.','🎁'],['famous','алдартай','I have met a famous singer.','Би алдартай дуучинтай уулзаж байсан.','⭐'],['skydiving','шүхрээр үсрэх','Have you ever tried skydiving?','Чи шүхрээр үсэрч үзсэн үү?','🪂'],['festival','наадам, баяр','Naadam is a famous festival.','Наадам бол алдартай баяр.','🎪'],['ride','унах','I have ridden a camel in the Gobi.','Би Говьд тэмээ унаж үзсэн.','🐫'],['taste','амсах','Have you tasted French cheese?','Чи Францын бяслаг амсаж үзсэн үү?','👅'],['lose','алдах, гээх','I have lost my keys again!','Би түлхүүрээ дахиад гээчихлээ!','🔑'],['break','хугалах','He has broken his arm.','Тэр гараа хугалчихжээ.','🦴'],['win','ялах','Our school has won many medals.','Манай сургууль олон медаль хүртсэн.','🥇'],['once','нэг удаа','I have been to Seoul once.','Би Сөүлд нэг удаа очсон.','1️⃣'],['twice','хоёр удаа','I have seen that film twice.','Би тэр киног хоёр удаа үзсэн.','2️⃣'],['several times','хэд хэдэн удаа','I have visited Khuvsgul several times.','Би Хөвсгөлд хэд хэдэн удаа очсон.','🔁'],['in my life','амьдралдаа','I have never been so happy in my life.','Амьдралдаа ийм баяртай байгаагүй.','🌱'],['memorable','мартагдашгүй','It was a memorable day.','Мартагдашгүй өдөр байлаа.','📸'],['unforgettable','хэзээ ч мартагдахгүй','The trip was unforgettable.','Аялал хэзээ ч мартагдахгүй.','💖'],['bucket list','хийх хүсэлтэй зүйлсийн жагсаалт','Seeing the Northern Lights is on my bucket list.','Туйлын туяа харах нь миний хүслийн жагсаалтад бий.','📝']],
gram:{t:'Present perfect: experiences',tm:'Одоо төгсөх цаг: туршлага',
en:'<p>Use <b>have/has + past participle<\/b> to talk about experiences in your life, without saying when.<\/p><p>I <b>have visited<\/b> Korea. She <b>has never tried<\/b> sushi.<\/p><p>Question: <b>Have you ever<\/b> + past participle? — Yes, I have. / No, I haven\'t.<\/p><p>Participles: go → <b>been/gone<\/b>, see → <b>seen<\/b>, eat → <b>eaten<\/b>, do → <b>done<\/b>, write → <b>written<\/b>, fly → <b>flown<\/b>.<\/p><p>When you say <b>when<\/b> (yesterday, in 2019), use the past simple: I visited Korea <b>in 2019<\/b>.<\/p>',
mn:'<p>Амьдралдаа хийж үзсэн зүйлээ <b>хэзээ<\/b> гэдгийг хэлэхгүйгээр ярихдаа <b>have/has + 3-р хэлбэр<\/b> хэрэглэнэ.<\/p><p>I <b>have visited<\/b> Korea. (Би Солонгост очиж байсан.) She <b>has never tried<\/b> sushi. (Тэр суши хэзээ ч амсаж үзээгүй.)<\/p><p>Асуулт: <b>Have you ever<\/b> …? (Чи хэзээ нэгэн цагт … байсан уу?)<\/p><p>Хэзээ гэдгийг хэлбэл (yesterday, 2019 онд) өнгөрсөн энгийн цаг: I visited Korea <b>in 2019<\/b>.<\/p>',
ex:[['I have been to Japan twice.','Би Японд хоёр удаа очсон.'],['Have you ever ridden a horse?','Чи морь унаж үзсэн үү?'],['She has never seen the sea.','Тэр далай хэзээ ч хараагүй.'],['We have already met.','Бид аль хэдийн танилцсан.'],['I went there last summer.','Би өнгөрсөн зун тэнд очсон.']],
q:[{q:'Have you ever ___ sushi?',o:['eat','ate','eaten'],a:2},{q:'She ___ never been to London.',o:['have','has','is'],a:1},{q:'I ___ Paris in 2018.',o:['have visited','visited'],a:1},{q:'They have ___ finished. (= before now)',o:['already','yet','ever'],a:0},{q:'I haven\'t done my homework ___.',o:['already','yet','just'],a:1},{q:'fly → have ___',o:['flied','flew','flown'],a:2}]},
dl:[{t:'Have you ever…?',tm:'Чи хэзээ нэгэн цагт…?',lines:[['A','Have you ever been abroad?','Чи гадаадад гарч байсан уу?'],['B','Yes, I have. I\'ve been to China and Korea.','Тийм. Хятад, Солонгост очиж байсан.'],['A','When did you go to Korea?','Солонгост хэзээ очсон бэ?'],['B','Two years ago, for a teachers\' workshop.','Хоёр жилийн өмнө, багш нарын семинарт.'],['A','Have you ever tried Korean barbecue?','Солонгос шарсан мах амсаж үзсэн үү?'],['B','Yes! It was delicious. Have you ever been there?','Тийм! Их амттай байсан. Чи очиж байсан уу?'],['A','No, never. But it\'s on my bucket list.','Үгүй, хэзээ ч. Гэхдээ миний хүслийн жагсаалтад бий.']]},
{t:'Good news',tm:'Сайн мэдээ',lines:[['A','You look happy! What\'s happened?','Чи баяртай харагдаж байна! Юу болов?'],['B','My students have just won the robotics competition!','Миний сурагчид дөнгөж сая роботын тэмцээнд түрүүллээ!'],['A','Congratulations! Have they won before?','Баяр хүргэе! Өмнө нь түрүүлж байсан уу?'],['B','No, this is the first time.','Үгүй, анх удаа.'],['A','You must be very proud.','Чи их бахархаж байгаа байх.'],['B','I am. It\'s an unforgettable day.','Тийм ээ. Мартагдашгүй өдөр.']]}],
story:{t:'The camel ride',tm:'Тэмээ унасан нь',s:[['Anna has lived in Mongolia for two years.','Анна Монголд хоёр жил амьдарчээ.'],['She has visited many places, but she has never been to the Gobi.','Тэр олон газар очсон ч Говьд хэзээ ч очиж байгаагүй.'],['Last summer, Saraa invited her on a trip to the desert.','Өнгөрсөн зун Сараа түүнийг цөл рүү аялалд урив.'],['On the second day, a herder offered them a camel ride.','Хоёр дахь өдөр нэг малчин тэднийг тэмээ унуулахаар болов.'],['Anna was scared, because the camel was very tall.','Тэмээ их өндөр тул Анна айсан.'],['"Have you ever ridden a camel?" she asked Saraa.','«Чи тэмээ унаж үзсэн үү?» гэж тэр Сараагаас асуув.'],['"Many times! Don\'t worry," Saraa laughed.','«Олон удаа! Бүү санаа зов» гэж Сараа инээв.'],['Anna climbed on, held tight and slowly began to smile.','Анна мордоод чанга барьж, аажмаар инээмсэглэж эхлэв.'],['They rode across the sand dunes as the sun went down.','Нар жаргах үеэр тэд элсэн манхан дундуур явав.'],['"This is the most memorable experience of my life," Anna said.','«Энэ бол миний амьдралын хамгийн мартагдашгүй туршлага» гэж Анна хэлэв.']],
gl:{desert:'цөл',herder:'малчин',offered:'санал болгосон',tall:'өндөр',worry:'санаа зовох','held tight':'чанга барьсан',slowly:'аажмаар','sand dunes':'элсэн манхан','went down':'жаргасан',invited:'урьсан'},
q:[{q:'How long has Anna lived in Mongolia?',o:['Two years','Two months','Ten years'],a:0},{q:'Why was Anna scared?',o:['The camel was very tall','It was dark','She was alone'],a:0},{q:'How many times has Saraa ridden a camel?',o:['Never','Once','Many times'],a:2}]},
speak:[['Talk about three things you have done in your life and one thing you have never done.','Амьдралдаа хийж үзсэн гурван зүйл, хэзээ ч хийж үзээгүй нэг зүйлээ ярь.','I have climbed Bogd Khan Mountain. I have taught over a thousand students. I have travelled to Korea. But I have never tried skydiving.'],['Describe your proudest achievement.','Хамгийн их бахархдаг амжилтаа тайлбарла.','My proudest achievement is when my students won a national competition. We worked very hard for months.'],['What is on your bucket list? Why?','Таны хүслийн жагсаалтад юу байдаг вэ? Яагаад?','I want to see the Northern Lights because I have seen them only in photos.']]},

{id:14,st:2,t:'Work and career',tm:'Ажил мэргэжил, карьер',c:'#00bbf9',sc:['💼','At work','Ажил дээр'],
goal:{en:'Describe your career history and talk about how long you have done things.',mn:'Ажлын түүхээ ярьж, хэр удаан хийж байгаагаа хэлэх.'},
words:[['career','карьер, мэргэжлийн зам','I started my career in 2010.','Би 2010 онд ажлын гараагаа эхэлсэн.','🪜'],['degree','эрдмийн зэрэг, диплом','I have a degree in computer science.','Би компьютерын ухааны дипломтой.','🎓'],['university','их сургууль','I studied at the National University.','Би Үндэсний их сургуульд суралцсан.','🏛️'],['graduate','төгсөх','I graduated in 2009.','Би 2009 онд төгссөн.','👩‍🎓'],['apply','өргөдөл гаргах','She applied for a new job.','Тэр шинэ ажилд өргөдөл гаргасан.','📨'],['interview','ярилцлага','I have a job interview tomorrow.','Маргааш ажлын ярилцлагатай.','🤝'],['CV','намтар (CV)','Please send us your CV.','Намтраа бидэнд илгээнэ үү.','📄'],['hire','ажилд авах','The school hired two new teachers.','Сургууль хоёр шинэ багш авсан.','✍️'],['promotion','албан тушаал дэвших','He got a promotion last year.','Тэр өнгөрсөн жил дэвшсэн.','⬆️'],['responsible for','хариуцдаг','I\'m responsible for the IT room.','Би компьютерын өрөөг хариуцдаг.','🧭'],['department','тэнхим, хэлтэс','I work in the IT department.','Би мэдээллийн технологийн тэнхимд ажилладаг.','🏢'],['full-time','бүтэн цагийн','It\'s a full-time job.','Энэ бүтэн цагийн ажил.','🕘'],['part-time','цагийн ажил','I worked part-time as a student.','Оюутан байхдаа цагийн ажил хийдэг байсан.','🕐'],['since','-аас хойш','I have worked here since 2015.','Би 2015 оноос хойш энд ажиллаж байна.','📍'],['for','турш, хугацаанд','I have taught for twelve years.','Би арван хоёр жил багшилж байна.','⏳'],['employee','ажилтан','The company has 200 employees.','Компани 200 ажилтантай.','🧑‍💼'],['boss','дарга','My boss is very supportive.','Миний дарга их дэмждэг.','👔'],['qualification','мэргэшил, ур чадварын гэрчилгээ','You need a teaching qualification.','Танд багшийн мэргэшил хэрэгтэй.','📜'],['workplace','ажлын байр','A friendly workplace is important.','Найрсаг ажлын байр чухал.','🏬'],['earn','олох (мөнгө)','How much do teachers earn?','Багш нар хэдэн төгрөг цалин авдаг вэ?','💰'],['retire','тэтгэвэрт гарах','My father retired last year.','Аав маань өнгөрсөн жил тэтгэвэрт гарсан.','🏖️'],['quit','гарах (ажлаас)','She quit her job to start a business.','Тэр бизнес эхлүүлэхээр ажлаасаа гарсан.','🚪'],['business','бизнес','He runs a small business.','Тэр жижиг бизнес эрхэлдэг.','🏪'],['opportunity','боломж','This job is a great opportunity.','Энэ ажил бол сайхан боломж.','🚀'],['strength','давуу тал','My biggest strength is patience.','Миний хамгийн том давуу тал бол тэвчээр.','💪'],['weakness','сул тал','My weakness is public speaking.','Олны өмнө ярих бол миний сул тал.','🪫'],['achieve','хүрэх','What have you achieved this year?','Та энэ жил юунд хүрсэн бэ?','🎯'],['colleague','хамт ажиллагч','I share an office with two colleagues.','Би хоёр хамт ажиллагчтай нэг өрөөнд суудаг.','👥'],['overtime','илүү цаг','We often work overtime in June.','Бид зургадугаар сард ихэвчлэн илүү цаг ажилладаг.','🌙'],['salary','цалин','The salary is paid monthly.','Цалинг сар бүр олгодог.','💵']],
gram:{t:'Present perfect with for / since; past simple vs present perfect',tm:'for / since-тэй одоо төгсөх цаг; өнгөрсөн цагтай харьцуулах',
en:'<p>Use the present perfect for situations that started in the past and continue now.<\/p><p><b>for<\/b> + a period: for 10 years, for three months. <b>since<\/b> + a starting point: since 2015, since Monday.<\/p><p>I <b>have worked<\/b> here <b>for<\/b> ten years / <b>since<\/b> 2015. <b>How long have you<\/b> lived here?<\/p><p>Finished time → past simple: I <b>worked<\/b> in a bank from 2010 to 2014. I <b>graduated<\/b> in 2009.<\/p>',
mn:'<p>Өнгөрсөнд эхэлж одоо үргэлжилж буй байдлыг одоо төгсөх цагаар хэлнэ.<\/p><p><b>for<\/b> + хугацаа (10 жил, 3 сар). <b>since<\/b> + эхэлсэн цэг (2015 оноос, даваа гарагаас).<\/p><p>I <b>have worked<\/b> here <b>for<\/b> ten years. (Би энд арван жил ажиллаж байна.) <b>How long have you<\/b> lived here? (Та энд хэр удаан амьдарч байна?)<\/p><p>Дууссан хугацаа → өнгөрсөн энгийн цаг: I <b>worked<\/b> in a bank from 2010 to 2014.<\/p>',
ex:[['I have taught IT for twelve years.','Би арван хоёр жил мэдээллийн технологи зааж байна.'],['She has lived in Darkhan since 2018.','Тэр 2018 оноос хойш Дарханд амьдарч байна.'],['How long have you known her?','Чи түүнийг хэр удаан таньж байна?'],['I worked in a bank before I became a teacher.','Багш болохоосоо өмнө банкинд ажилладаг байсан.'],['He graduated in 2009 and started work in 2010.','Тэр 2009 онд төгсөөд 2010 онд ажилд орсон.']],
q:[{q:'I have worked here ___ 2015.',o:['for','since','ago'],a:1},{q:'She has taught ___ ten years.',o:['for','since','from'],a:0},{q:'How long ___ you lived in this city?',o:['did','have','are'],a:1},{q:'I ___ from university in 2009.',o:['have graduated','graduated'],a:1},{q:'They ___ married for twenty years.',o:['have been','were','are'],a:0},{q:'I\'m responsible ___ the IT room.',o:['of','for','to'],a:1}]},
dl:[{t:'Job interview',tm:'Ажлын ярилцлага',lines:[['A','Thank you for coming. Can you tell me about yourself?','Ирсэнд баярлалаа. Өөрийнхөө тухай ярина уу?'],['B','Of course. I\'m an IT teacher, and I\'ve taught for twelve years.','Мэдээж. Би мэдээллийн технологийн багш, арван хоёр жил багшилж байна.'],['A','Where did you study?','Та хаана суралцсан бэ?'],['B','I graduated from the University of Science and Technology in 2009.','Би 2009 онд Шинжлэх ухаан, технологийн их сургуулийг төгссөн.'],['A','What are you responsible for in your current job?','Одоогийн ажилдаа юуг хариуцдаг вэ?'],['B','I teach grades six to twelve, and I manage the school website.','Зургаагаас арван хоёрдугаар ангид заадаг, сургуулийн сайтыг хариуцдаг.'],['A','What is your biggest strength?','Таны хамгийн том давуу тал юу вэ?'],['B','I think it\'s creativity. I always find new ways to teach.','Бүтээлч чанар гэж боддог. Би үргэлж заах шинэ арга хайдаг.']]},
{t:'Catching up',tm:'Уулзаж хуучилсан нь',lines:[['A','Bat! I haven\'t seen you for ages! How are you?','Бат аа! Чамайг уулзаагүй удаж байна! Сайн уу?'],['B','Great, thanks. I\'ve changed jobs since we last met.','Сайн, баярлалаа. Сүүлд уулзсанаас хойш ажлаа сольсон.'],['A','Really? Where do you work now?','Үнэхээр үү? Одоо хаана ажиллаж байна?'],['B','At a software company. I\'ve been there for six months.','Програм хангамжийн компанид. Зургаан сар болж байна.'],['A','Do you like it?','Таалагдаж байна уу?'],['B','Yes, but I sometimes work overtime. And you?','Тийм, гэхдээ заримдаа илүү цаг ажилладаг. Чи яаж байна?'],['A','I got a promotion! I\'m head of the department now.','Би дэвшсэн! Одоо тэнхимийн эрхлэгч болсон.']]}],
story:{t:'From bank to classroom',tm:'Банкнаас анги танхим руу',s:[['Oyuna graduated from university in 2008 with a degree in economics.','Оюуна 2008 онд эдийн засгийн мэргэжлээр их сургуулиа төгссөн.'],['For five years, she worked in a big bank.','Тэр таван жил том банкинд ажилласан.'],['The salary was good, but she wasn\'t happy.','Цалин сайн байсан ч тэр аз жаргалгүй байв.'],['Every evening, she taught maths to her neighbour\'s children for free.','Орой бүр тэр хөршийнхөө хүүхдүүдэд үнэгүй математик заадаг байв.'],['She loved it, and the children\'s grades improved quickly.','Тэр үүнд дуртай байсан бөгөөд хүүхдүүдийн дүн хурдан сайжирчээ.'],['In 2013, she quit her job and studied to become a teacher.','2013 онд тэр ажлаасаа гараад багш болохоор суралцав.'],['Her family was worried, but she was sure.','Гэр бүлийнхэн нь санаа зовсон ч тэр итгэлтэй байв.'],['She has worked at School 130 since 2015.','Тэр 2015 оноос хойш 130 дугаар сургуульд ажиллаж байна.'],['She has taught hundreds of students and won two teaching awards.','Тэр олон зуун сурагчид заасан бөгөөд багшийн хоёр шагнал хүртжээ.'],['"I earn less money now, but I\'m much happier," she says.','«Одоо бага цалинтай ч хамаагүй аз жаргалтай байна» гэж тэр хэлдэг.']],

speak:[['Describe your career: your studies, your first job and your job now.','Ажил мэргэжлийн замаа ярь: суралцсан, анхны ажил, одоогийн ажил.','I studied computer science and graduated in 2009. My first job was at a small company. I have been a teacher since 2012.'],['What are your strengths and weaknesses at work?','Ажил дээрх давуу болон сул талаа хэл.','My biggest strength is that I am creative. My weakness is that I sometimes work too late.'],['How long have you lived in your home? Do you like it?','Та одоогийн гэртээ хэр удаан амьдарч байна? Танд таалагддаг уу?','I have lived in my apartment for six years. I like it because it is near my school.']]},

words:[['crowded','хүн ихтэй, бөөгнөрсөн','The bus is very crowded in the morning.','Өглөө автобус их хүн ихтэй.','👥'],['peaceful','амар тайван','The countryside is peaceful.','Хөдөө амар тайван.','🕊️'],['modern','орчин үеийн','Seoul is a very modern city.','Сөүл маш орчин үеийн хот.','🏙️'],['ancient','эртний','Karakorum is an ancient capital.','Хархорум бол эртний нийслэл.','🏯'],['polluted','бохирдсон','The air is polluted in winter.','Өвөл агаар бохирддог.','🏭'],['clean','цэвэр','The lake water is very clean.','Нуурын ус маш цэвэр.','💧'],['dangerous','аюултай','This road is dangerous at night.','Энэ зам шөнө аюултай.','⚠️'],['safe','аюулгүй','Is it safe to walk here at night?','Энд шөнө алхахад аюулгүй юу?','🛡️'],['population','хүн ам','Mongolia has a small population.','Монгол цөөн хүн амтай.','👨‍👩‍👧'],['capital','нийслэл','Ulaanbaatar is the capital of Mongolia.','Улаанбаатар бол Монголын нийслэл.','🏛️'],['huge','асар том','Russia is a huge country.','Орос бол асар том улс.','🐋'],['tiny','бяцхан','We stayed in a tiny village.','Бид бяцхан тосгонд буусан.','🐜'],['nightlife','шөнийн амьдрал','Tokyo has amazing nightlife.','Токио гайхалтай шөнийн амьдралтай.','🌃'],['public transport','нийтийн тээвэр','Public transport in Seoul is excellent.','Сөүлийн нийтийн тээвэр маш сайн.','🚇'],['climate','уур амьсгал','Mongolia has an extreme climate.','Монгол эрс тэс уур амьсгалтай.','🌡️'],['landscape','байгалийн үзэмж','The landscape in Khentii is beautiful.','Хэнтийн байгаль үзэсгэлэнтэй.','🏞️'],['skyscraper','тэнгэр баганадсан барилга','Dubai has the tallest skyscraper.','Дубайд хамгийн өндөр тэнгэр баганадсан барилга бий.','🏢'],['village','тосгон','My mother grew up in a village.','Ээж маань тосгонд өссөн.','🏘️'],['coast','далайн эрэг','I\'d like to live on the coast.','Би далайн эрэг дээр амьдармаар байна.','🏖️'],['desert','цөл','The Gobi is a cold desert.','Говь бол хүйтэн цөл.','🏜️'],['expensive','үнэтэй','London is more expensive than Ulaanbaatar.','Лондон Улаанбаатараас үнэтэй.','💎'],['cheaper','илүү хямд','Food is cheaper in the countryside.','Хөдөө хоол илүү хямд.','🪙'],['the best','хамгийн сайн','This is the best café in town.','Энэ бол хотын хамгийн сайн кафе.','🥇'],['the worst','хамгийн муу','Winter traffic is the worst.','Өвлийн түгжрэл хамгийн муу.','👎'],['similar','төстэй','Our cities are similar in many ways.','Манай хотууд олон талаараа төстэй.','🟰'],['different from','-аас ялгаатай','Life in Tokyo is different from life here.','Токиогийн амьдрал эндхээс ялгаатай.','≠'],['compared to','харьцуулбал','Compared to Beijing, our city is small.','Бээжинтэй харьцуулбал манай хот жижиг.','⚖️'],['lively','амьд, хөл хөдөлгөөнтэй','The market is lively on Saturdays.','Бямба гарагт зах хөл хөдөлгөөнтэй.','🎉'],['quiet','нам гүм','I prefer quiet places.','Би нам гүм газрыг илүүд үздэг.','🤫'],['convenient','тохиромжтой','The flat is convenient for work.','Байр ажилд явахад тохиромжтой.','👌']],
gram:{t:'Comparatives and superlatives',tm:'Харьцуулах ба хэтрүүлсэн зэрэг',
en:'<p>Short adjectives: add <b>-er / -est<\/b>: cheap → cheap<b>er<\/b> → the cheap<b>est<\/b>; big → big<b>ger<\/b> → the big<b>gest<\/b>; busy → bus<b>ier<\/b> → the bus<b>iest<\/b>.<\/p><p>Long adjectives: <b>more / the most<\/b>: modern → <b>more<\/b> modern → <b>the most<\/b> modern.<\/p><p>Irregular: good → better → the best; bad → worse → the worst; far → further → the furthest.<\/p><p>Compare with <b>than<\/b>: Seoul is bigger <b>than<\/b> Ulaanbaatar. Same: <b>as … as<\/b>: It\'s <b>as<\/b> cold <b>as<\/b> Moscow. <b>not as … as<\/b> = less.<\/p>',
mn:'<p>Богино тэмдэг нэр: <b>-er / -est<\/b>: cheap → cheaper (илүү хямд) → the cheapest (хамгийн хямд).<\/p><p>Урт тэмдэг нэр: <b>more / the most<\/b>: modern → more modern → the most modern.<\/p><p>Дүрмийн бус: good → better → the best; bad → worse → the worst.<\/p><p>Харьцуулахдаа <b>than<\/b> (-аас): Seoul is bigger <b>than<\/b> Ulaanbaatar. Адил: <b>as … as<\/b>: It\'s <b>as<\/b> cold <b>as<\/b> Moscow. (Москва шиг хүйтэн.)<\/p>',
ex:[['Ulaanbaatar is colder than Seoul.','Улаанбаатар Сөүлээс хүйтэн.'],['Tokyo is one of the biggest cities in the world.','Токио бол дэлхийн хамгийн том хотуудын нэг.'],['Public transport is more convenient than driving.','Нийтийн тээвэр машин унахаас илүү тохиромжтой.'],['This is the best restaurant I have ever been to.','Энэ бол миний очиж байсан хамгийн сайн ресторан.'],['Darkhan isn\'t as crowded as Ulaanbaatar.','Дархан Улаанбаатар шиг хүн ихтэй биш.']],
q:[{q:'Seoul is ___ than Ulaanbaatar.',o:['big','bigger','biggest'],a:1},{q:'It\'s the ___ city in the world.',o:['more crowded','most crowded','crowdeder'],a:1},{q:'good → better → the ___',o:['goodest','best','better'],a:1},{q:'This café is ___ expensive than that one.',o:['more','most','much'],a:0},{q:'My town is ___ quiet as a village.',o:['so','as','than'],a:1},{q:'Winter traffic is the ___ (bad).',o:['baddest','worse','worst'],a:2}]},
dl:[{t:'Where would you live?',tm:'Хаана амьдармаар байна?',lines:[['A','If you could choose, would you live in Seoul or Ulaanbaatar?','Сонгож болдог бол Сөүл үү, Улаанбаатар уу?'],['B','Seoul, I think. Public transport is much better.','Сөүл гэж бодож байна. Нийтийн тээвэр нь хамаагүй сайн.'],['A','But it\'s more expensive, isn\'t it?','Гэхдээ илүү үнэтэй биз дээ?'],['B','Yes, rent is higher. But salaries are higher too.','Тийм, түрээс өндөр. Гэхдээ цалин ч бас өндөр.'],['A','I prefer Ulaanbaatar. It\'s closer to nature.','Би Улаанбаатарыг илүүд үздэг. Байгальд ойрхон.'],['B','That\'s true. The landscape here is the most beautiful.','Үнэн. Эндхийн байгаль хамгийн үзэсгэлэнтэй.']]},
{t:'Choosing a hotel',tm:'Зочид буудал сонгох',lines:[['A','Which hotel should we book?','Аль зочид буудлыг захиалах вэ?'],['B','The Sky Hotel is cheaper, but the Riverside is closer to the centre.','Sky зочид буудал хямд, харин Riverside нь төвд ойр.'],['A','Which one has better reviews?','Аль нь илүү сайн сэтгэгдэлтэй вэ?'],['B','The Riverside. People say it\'s the quietest hotel in town.','Riverside. Хотын хамгийн нам гүм буудал гэж хүмүүс ярьдаг.'],['A','Then let\'s book the Riverside. Sleep is more important than money!','Тэгвэл Riverside-г захиалъя. Нойр мөнгөнөөс чухал!']]}],
story:{t:'Two cities',tm:'Хоёр хот',s:[['Bold has lived in two very different cities: Ulaanbaatar and Seoul.','Болд хоёр тэс өөр хотод амьдарч байсан: Улаанбаатар, Сөүл.'],['Seoul is much bigger and more modern.','Сөүл хамаагүй том, орчин үеийн.'],['The trains are faster, and the streets are cleaner.','Галт тэрэг нь хурдан, гудамж нь цэвэрхэн.'],['However, life there is more expensive and more stressful.','Гэсэн хэдий ч тэндхийн амьдрал илүү үнэтэй, стресстэй.'],['People work longer hours, and the city never sleeps.','Хүмүүс урт цагаар ажилладаг, хот хэзээ ч унтдаггүй.'],['Ulaanbaatar is colder and the traffic is worse.','Улаанбаатар хүйтэн, түгжрэл нь дор.'],['But the sky is bluer and the mountains are closer.','Харин тэнгэр нь цэнхэр, уулс нь ойрхон.'],['On weekends, Bold can drive to the countryside in one hour.','Амралтын өдөр Болд нэг цагийн дотор хөдөө гарч чадна.'],['"Seoul is the most exciting city I know," he says,','«Сөүл бол миний мэдэх хамгийн сонирхолтой хот» гэж тэр хэлдэг,'],['"but Ulaanbaatar is the best place to call home."','«харин Улаанбаатар бол гэр гэж нэрлэх хамгийн сайн газар.»']],
gl:{stressful:'стресстэй',however:'гэсэн хэдий ч','never sleeps':'хэзээ ч унтдаггүй',bluer:'илүү цэнхэр',exciting:'сонирхолтой, догдлом','call home':'гэр гэж нэрлэх',faster:'илүү хурдан',cleaner:'илүү цэвэр',longer:'илүү урт'},
q:[{q:'Which city is more modern?',o:['Seoul','Ulaanbaatar'],a:0},{q:'What is better in Ulaanbaatar?',o:['The traffic','Nature is closer','The trains'],a:1},{q:'What does Bold call home?',o:['Seoul','Ulaanbaatar','Tokyo'],a:1}]},
speak:[['Compare your city with another city you know.','Өөрийн хотоо таны мэдэх өөр нэг хоттой харьцуул.','Ulaanbaatar is smaller than Beijing, but it is closer to nature. Beijing has better public transport.'],['What is the most beautiful place in Mongolia? Why?','Монголын хамгийн үзэсгэлэнтэй газар хаана вэ? Яагаад?','I think Khuvsgul Lake is the most beautiful place because the water is the cleanest and the mountains are amazing.'],['Is it better to live in the city or the countryside?','Хот эсвэл хөдөө амьдрах аль нь дээр вэ?','For me, the city is better because there are more jobs, but the countryside is more peaceful.']]},

{id:16,st:2,t:'Plans and arrangements',tm:'Төлөвлөгөө, товлосон уулзалт',c:'#9b5de5',sc:['📅','Making plans','Төлөвлөгөө гаргахад'],
goal:{en:'Talk about future plans, arrangements and predictions.',mn:'Ирээдүйн төлөвлөгөө, товлосон ажил, таамаглалаа ярих.'},
words:[['arrangement','товлолт, тохиролцоо','I have an arrangement with the dentist.','Би шүдний эмчтэй цаг товлосон.','🗓️'],['appointment','цаг авалт','My appointment is at 3 p.m.','Миний товлосон цаг 15:00.','📆'],['invite','урих','We\'re inviting twenty guests.','Бид хорин зочин урьж байна.','💌'],['accept','хүлээн авах','I\'m happy to accept your invitation.','Урилгыг тань баяртайгаар хүлээн авч байна.','👍'],['decline','татгалзах','I\'m afraid I have to decline.','Харамсалтай нь татгалзах хэрэгтэй байна.','🙅'],['cancel','цуцлах','The meeting has been cancelled.','Хурал цуцлагдсан.','❌'],['postpone','хойшлуулах','Can we postpone the trip?','Аяллаа хойшлуулж болох уу?','⏭️'],['book','захиалах','I\'ve booked a table for six.','Би зургаан хүний ширээ захиалсан.','📖'],['available','боломжтой, сул','Are you available on Friday?','Баасан гарагт завтай юу?','🟢'],['free','чөлөөтэй','I\'m free after five.','Таван цагаас хойш чөлөөтэй.','🆓'],['busy','завгүй','Sorry, I\'m busy this weekend.','Уучлаарай, энэ амралтаар завгүй.','🔴'],['celebrate','тэмдэглэх','We\'re celebrating my mother\'s birthday.','Бид ээжийн төрсөн өдрийг тэмдэглэж байна.','🎉'],['wedding','хурим','My cousin\'s wedding is next month.','Үеэлийн минь хурим ирэх сард.','💒'],['anniversary','ой','It\'s our tenth wedding anniversary.','Энэ бол бидний гэрлэсний арав дахь ой.','💐'],['graduation','төгсөлт','My son\'s graduation is in June.','Хүүгийн минь төгсөлт зургадугаар сард.','🎓'],['holiday','амралт','We\'re going on holiday in July.','Бид долдугаар сард амралтаар явна.','🏝️'],['predict','таамаглах','Experts predict a cold winter.','Мэргэжилтнүүд хүйтэн өвөл болно гэж таамаглаж байна.','🔮'],['forecast','урьдчилсан мэдээ','The weather forecast says it will snow.','Цаг агаарын мэдээгээр цас орно.','🌦️'],['probably','магадгүй','I\'ll probably be late.','Би магадгүй хоцорно.','🤔'],['definitely','мэдээж, гарцаагүй','I\'ll definitely be there.','Би гарцаагүй очно.','💯'],['intend to','санаатай, бодож байгаа','I intend to finish by Friday.','Баасан гараг гэхэд дуусгахаар бодож байна.','🎯'],['schedule','хуваарь','Let me check my schedule.','Хуваариа шалгая.','🗂️'],['reminder','сануулга','I\'ll set a reminder on my phone.','Утсандаа сануулга тавина.','⏰'],['deadline','эцсийн хугацаа','The deadline is next Monday.','Эцсийн хугацаа ирэх даваа.','⏳'],['tomorrow','маргааш','What are you doing tomorrow?','Маргааш юу хийх вэ?','➡️'],['next month','ирэх сар','I\'m starting a course next month.','Ирэх сард сургалтад суух гэж байна.','📅'],['in the future','ирээдүйд','In the future, I\'d like to teach abroad.','Ирээдүйд гадаадад багшилмаар байна.','🔭'],['guest','зочин','The guests are arriving at seven.','Зочид долоон цагт ирнэ.','🧑‍🤝‍🧑'],['venue','болох газар','The venue is a hotel downtown.','Арга хэмжээ хотын төвийн зочид буудалд болно.','🏨'],['confirm','баталгаажуулах','Please confirm your booking.','Захиалгаа баталгаажуулна уу.','✔️']],
gram:{t:'Future forms: present continuous, going to, will',tm:'Ирээдүйн хэлбэрүүд: present continuous, going to, will',
en:'<p><b>Present continuous<\/b> for fixed arrangements (time and place agreed): I<b>\'m meeting<\/b> Anna at six.<\/p><p><b>be going to<\/b> for plans and intentions: I<b>\'m going to<\/b> learn to drive.<\/p><p><b>will<\/b> for predictions, offers, promises and quick decisions: It <b>will<\/b> rain. I<b>\'ll<\/b> help you. I<b>\'ll<\/b> call you later.<\/p><p>Predictions with evidence use going to: Look at those clouds — it<b>\'s going to<\/b> rain.<\/p>',
mn:'<p><b>Present continuous<\/b> — цаг, газар нь тохирсон уулзалт: I<b>\'m meeting<\/b> Anna at six. (Би зургаан цагт Аннатай уулзана.)<\/p><p><b>be going to<\/b> — төлөвлөгөө, бодож буй зүйл: I<b>\'m going to<\/b> learn to drive.<\/p><p><b>will<\/b> — таамаглал, санал, амлалт, тэр дороо гаргасан шийдвэр: I<b>\'ll<\/b> help you. (Би туслая.)<\/p><p>Нүдэнд харагдаж буй баримттай таамаглал → going to: Look at those clouds — it<b>\'s going to<\/b> rain.<\/p>',
ex:[['I\'m having dinner with my parents on Sunday.','Би ням гарагт эцэг эхтэйгээ оройн хоол идэх гэж байна.'],['We\'re going to visit Japan next spring.','Бид ирэх хавар Японд очихоор төлөвлөж байна.'],['I think English will be useful for my career.','Англи хэл миний ажилд хэрэгтэй болно гэж бодож байна.'],['Don\'t worry, I\'ll send you the file.','Бүү санаа зов, би файлыг илгээнэ.'],['Look at the sky! It\'s going to snow.','Тэнгэрийг хар! Цас орох гэж байна.']],

dl:[{t:'Making plans',tm:'Төлөвлөгөө гаргах нь',lines:[['A','Are you free on Saturday?','Бямба гарагт завтай юу?'],['B','In the morning I\'m taking my son to football. Why?','Өглөө хүүгээ хөлбөмбөгт хүргэж өгнө. Яагаад?'],['A','We\'re having a small party for Nomin\'s birthday. Can you come?','Номины төрсөн өдрөөр жижиг үдэшлэг хийх гэж байна. Ирж чадах уу?'],['B','I\'d love to! What time does it start?','Их баяртай ирнэ! Хэдэн цагт эхлэх вэ?'],['A','At six, at the café near the park.','Зургаан цагт, цэцэрлэгт хүрээлэнгийн дэргэдэх кафед.'],['B','Great. I\'ll bring a cake!','Гоё. Би бялуу авчирна!']]},
{t:'Changing an appointment',tm:'Цаг өөрчлөх',lines:[['A','Hello, I have an appointment with Dr. Lee on Tuesday at ten.','Сайн байна уу, мягмар гарагийн 10 цагт эмч Литэй цаг авсан юм.'],['B','Yes, I can see that. How can I help?','Тийм, харагдаж байна. Юугаар туслах вэ?'],['A','I\'m afraid I can\'t come. Could we postpone it?','Уучлаарай, ирж чадахгүй нь. Хойшлуулж болох уу?'],['B','Sure. Is Thursday at two convenient?','Тэгье. Пүрэв гарагийн хоёр цаг тохирох уу?'],['A','Yes, that\'s perfect.','Тийм, яг таарч байна.'],['B','OK. I\'ll send you a reminder by text.','За. Мессежээр сануулга илгээнэ.']]}],
story:{t:'The big day',tm:'Том өдөр',s:[['Next Saturday is a very important day for Tuya.','Ирэх бямба гараг Туяад маш чухал өдөр.'],['She is getting married to her boyfriend, Ganaa.','Тэр найз залуу Ганаатайгаа гэрлэх гэж байна.'],['They have booked a beautiful venue near the river.','Тэд голын эрэг дээрх гоё газрыг захиалсан.'],['One hundred guests are coming, and her grandmother is flying in from Khovd.','Зуун зочин ирэх бөгөөд эмээ нь Ховдоос нисэж ирнэ.'],['Tuya has a long list of things to do.','Туяад хийх зүйлсийн урт жагсаалт бий.'],['On Monday, she is meeting the photographer.','Даваа гарагт тэр гэрэл зурагчинтай уулзана.'],['On Wednesday, she is going to try on her dress for the last time.','Лхагва гарагт даашинзаа хамгийн сүүлд өмсөж үзнэ.'],['The weather forecast says it will be sunny but windy.','Цаг агаарын мэдээгээр нартай ч салхитай байна.'],['"Don\'t worry," says Ganaa. "Everything will be perfect."','«Бүү санаа зов» гэж Ганаа хэлэв. «Бүх зүйл төгс болно.»'],['Tuya smiles. She is nervous, but she is very happy.','Туяа инээмсэглэнэ. Тэр сандарч байгаа ч их аз жаргалтай байна.']],

speak:[['What are you doing this weekend? Talk about arrangements and plans.','Энэ амралтаар юу хийх гэж байна? Товлосон уулзалт, төлөвлөгөөгөө ярь.','On Saturday I\'m meeting my friends for lunch. On Sunday I\'m going to clean the house and prepare my lessons.'],['Invite a friend to an event, then decline an invitation politely.','Найзаа арга хэмжээнд урьж, дараа нь урилгаас эелдгээр татгалз.','Would you like to come to my birthday party on Friday? — Thank you, but I\'m afraid I\'m busy that evening.'],['How do you think your life will change in five years?','Таван жилийн дараа амьдрал тань хэрхэн өөрчлөгдөнө гэж бодож байна?','I think I will speak English well. I will probably teach at an international school.']]}
